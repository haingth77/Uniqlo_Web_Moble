n\n**Q4: `flatMap` khác `map().flat()` thế nào?**\n\n`flatMap(fn)` = `map(fn).flat(1)` nhưng làm 1 lượt → hơi nhanh hơn cho array nhỏ. Chỉ flat 1 level.\n\n### Output-Prediction Quiz\n\n```js\nconst r = [1, 2, 3].reduce((acc, x) => acc + x);\nconsole.log(r);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `6`. Không có initial → start với `acc=1, x=2`, rồi `acc=3, x=3` → 6.\n\n</details>\n\n```js\nconst r = [[1, 2], [3, 4]].flatMap((arr) => arr.map((x) => x * 2));\nconsole.log(r);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `[2, 4, 6, 8]`. map mỗi sub-array rồi flat.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `.sort()` MUTATE array gốc. Muốn không mutate: `[...arr].sort()`.\n\n> [!GOTCHA]\n> `.sort()` không tham số → so sánh STRING. `[10, 2, 1].sort()` → `[1, 10, 2]`. Phải `.sort((a, b) => a - b)`.\n\n---\n\n## I. Destructuring, Spread, Rest\n\n### Mental model\n\n- **Destructuring**: extract value từ array/object vào biến.\n- **Spread (`...`)** ở vị trí giá trị: \"rải\" array/object ra.\n- **Rest (`...`)** ở vị trí khai báo: \"gom\" args vào array.\n\n### Code\n\n```ts\n// Object destructure + default + rename\nconst user = { id: 1, name: 'Hai', email: 'h@x.com' };\nconst { name, email: userEmail, age = 0 } = user;\n// name='Hai', userEmail='h@x.com', age=0\n\n// Array destructure + skip\nconst [first, , third] = [1, 2, 3];\n\n// Nested\nconst { address: { city } } = { address: { city: 'HN' } };\n\n// Rest in destructure\nconst { id, ...rest } = user;  // id=1, rest={name, email}\n\n// Spread (clone shallow)\nconst cloned = { ...user, name: 'Anh' };  // override name\nconst merged = [...arr1, ...arr2];\n\n// Rest in function param\nfunction logAll(first, ...others) { console.log(first, others); }\nlogAll(1, 2, 3, 4);  // 1, [2, 3, 4]\n```\n\n### Interview Q&A\n\n**Q1: Spread vs Rest?**\n\nCùng cú pháp `...` nhưng vị trí khác nhau:\n- Spread = expand: `[...arr]`, `{...obj}`, `fn(...args)`.\n- Rest = collect: `const [a, ...rest] = ...`, `function(...args) {}`.\n\n**Q2: `{...obj}` là shallow hay deep clone?**\n\nShallow. Nested object/array vẫn share reference. Deep clone: `structuredClone(obj)` (ES2022) hoặc `JSON.parse(JSON.stringify(obj))` (mất Date, function...).\n\n**Q3: Destructure default value khi nào áp dụng?**\n\nCHỈ khi giá trị là `undefined`. `null` không trigger default.\n\n```js\nconst { x = 10 } = { x: undefined };  // x = 10\nconst { x = 10 } = { x: null };       // x = null\n```\n\n**Q4: Spread vs Object.assign?**\n\n`{...a, ...b}` ~ `Object.assign({}, a, b)`. Spread mới hơn, syntax gọn hơn. Object.assign mutate target nếu target không phải `{}`.\n\n### Output-Prediction Quiz\n\n```js\nconst { a = 1, b = 2 } = { a: undefined, b: null };\nconsole.log(a, b);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `1 null`. Default chỉ áp dụng với undefined.\n\n</details>\n\n```js\nconst arr = [1, 2, 3];\nconst [head, ...tail] = arr;\nconsole.log(head, tail);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `1 [2, 3]`.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> Spread của object KHÔNG copy non-enumerable properties (như getter trong class). Dùng `Object.assign` cẩn thận, hoặc clone qua cách khác.\n\n---\n\n## J. Prototype & Class\n\n### Mental model\n\nJS dùng **prototypal inheritance**, không phải classical. Mỗi object có `__proto__` trỏ tới object cha. Khi access property: lookup trên object → nếu không có thì lên `__proto__` → cứ thế đến `null`.\n\n`class` ES6 là **syntactic sugar** cho prototype + constructor function. Bên trong vẫn là prototype chain.\n\n### Code\n\n```js\n// Prototype manual\nconst animal = { eat() { console.log('eating'); } };\nconst dog = Object.create(animal);\ndog.bark = function () { console.log('woof'); };\ndog.eat();   // 'eating' — qua prototype chain\ndog.bark();  // 'woof'\n\n// Class\nclass Animal {\n  constructor(name) { this.name = name; }\n  eat() { console.log(`${this.name} eating`); }\n}\n\nclass Dog extends Animal {\n  constructor(name, breed) {\n    super(name);  // BẮT BUỘC trước khi dùng this\n    this.breed = breed;\n  }\n  bark() { console.log('woof'); }\n}\n\nconst d = new Dog('Rex', 'Husky');\nd.eat();  // 'Rex eating'\nd.bark(); // 'woof'\nd instanceof Dog;     // true\nd instanceof Animal;  // true\n```\n\n### Interview Q&A\n\n**Q1: `class` trong JS có phải class thật?**\n\nKhông hẳn. Là sugar cho prototype-based inheritance. Behind the scenes: `class Dog extends Animal` = `Dog.prototype.__proto__ = Animal.prototype`. Method định nghĩa trong class gắn lên prototype.\n\n**Q2: `instanceof` hoạt động thế nào?**\n\nWalk prototype chain của object, check có chạm `Constructor.prototype` không.\n\n**Q3: `super()` làm gì?**\n\nTrong constructor: gọi parent constructor. BẮT BUỘC gọi trước khi access `this` trong subclass constructor. Trong method: gọi method cha.\n\n**Q4: Static method là gì?**\n\nMethod gắn lên class chính, không phải instance. `class Foo { static bar() {} }` → gọi `Foo.bar()`, không phải `new Foo().bar()`. Dùng cho factory, utility.\n\n### Output-Prediction Quiz\n\n```js\nclass A { greet() { return 'A'; } }\nclass B extends A { greet() { return super.greet() + 'B'; } }\nconsole.log(new B().greet());\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `'AB'`. `super.greet()` gọi method của A.\n\n</details>\n\n```js\nclass C {}\nconst c = new C();\nconsole.log(c.__proto__ === C.prototype);\nconsole.log(C.prototype.constructor === C);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `true true`. Instance `__proto__` = class prototype; class prototype `.constructor` trỏ về class.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> Trong subclass constructor, dùng `this` trước `super()` → ReferenceError.\n\n> [!GOTCHA]\n> Arrow function trong class body là **field**, không phải method trên prototype. Mỗi instance có function riêng → tốn RAM nếu nhiều instance.\n\n---\n\n## S. OOP — Object-Oriented Programming in JS/TS\n\n### Mental model\n\n4 trụ OOP:\n\n| Pillar | Tinh thần | TS construct |\n|---|---|---|\n| **Encapsulation** | Đóng gói data + behavior, ẩn detail | `private`, `protected`, `#field` |\n| **Inheritance** | Subclass kế thừa từ superclass | `extends`, `super` |\n| **Polymorphism** | Cùng interface, behavior khác nhau | Method override, interface |\n| **Abstraction** | Lộ ra \"what\", giấu \"how\" | `abstract class`, `interface` |\n\n### Code (Page Object refactor — minh hoạ 4 pillars)\n\n```ts\n// ABSTRACTION + ENCAPSULATION via abstract class + protected\nabstract class BasePage {\n  protected readonly page: Page;        // encapsulation: protected, không public\n\n  constructor(page: Page) {\n    this.page = page;\n  }\n\n  abstract get url(): string;            // abstraction: subclass MUST implement\n\n  async goto(): Promise<void> {          // shared behavior\n    await this.page.goto(this.url);\n    await this.waitForReady();\n  }\n\n  protected async waitForReady(): Promise<void> {\n    await this.page.waitForLoadState('domcontentloaded');\n  }\n}\n\n// INHERITANCE\nclass HomePage extends BasePage {\n  get url() { return '/'; }              // implement abstract\n  async search(query: string) {\n    await this.page.fill('[data-testid=\"search\"]', query);\n  }\n}\n\n// POLYMORPHISM — cùng interface, behavior khác\nclass CartPage extends BasePage {\n  get url() { return '/cart'; }\n  async waitForReady() {                 // override\n    await super.waitForReady();\n    await this.page.waitForSelector('[data-testid=\"cart-loaded\"]');\n  }\n}\n\n// Sử dụng polymorphism\nasync function navigate(p: BasePage) {\n  await p.goto();  // gọi đúng waitForReady của subclass\n}\n```\n\n### TS Access Modifiers\n\n| Modifier | Truy cập từ |\n|---|---|\n| `public` (default) | Mọi nơi |\n| `protected` | Trong class + subclass |\n| `private` (TS) | Trong class duy nhất — TS check, runtime KHÔNG enforce |\n| `#field` (JS) | Trong class duy nhất — runtime ENFORCE |\n| `readonly` | Read-only sau init |\n\n### Composition vs Inheritance\n\n> [!IMPORTANT]\n> **\"Favor composition over inheritance\"** — nguyên tắc kinh điển. Inheritance tạo coupling chặt, khó refactor. Composition linh hoạt hơn.\n\n```ts\n// ❌ Inheritance — chain dài, rigid\nclass A { ... }\nclass B extends A { ... }\nclass C extends B { ... }  // C couple với cả A và B\n\n// ✅ Composition — A \"has-a\" relationship\nclass C {\n  constructor(\n    private logger: Logger,    // C \"has\" Logger\n    private api: ApiClient,    // C \"has\" ApiClient\n  ) {}\n}\n```\n\nTrong Playwright: **fixture pattern = composition**. Test \"has-a\" page, \"has-a\" api — chứ không phải \"is-a\".\n\n### SOLID briefly\n\n| | Tên | Tinh thần |\n|---|---|---|\n| **S** | Single Responsibility | 1 class = 1 lý do thay đổi |\n| **O** | Open / Closed | Open for extension, closed for modification |\n| **L** | Liskov Substitution | Subclass thay được superclass mà không phá behavior |\n| **I** | Interface Segregation | Nhiều interface nhỏ > 1 interface to |\n| **D** | Dependency Inversion | Depend on abstraction, không phải concrete class |\n\n### Interview Q&A\n\n**Q1: 4 pillars OOP là gì?**\n\nEncapsulation (đóng gói), Inheritance (kế thừa), Polymorphism (đa hình), Abstraction (trừu tượng). Xem bảng mental model.\n\n**Q2: `abstract class` vs `interface` trong TS?**\n\n| | abstract class | interface |\n|---|---|---|\n| Có implementation? | Có (method có body, abstract method thì không) | Không (chỉ contract) |\n| Multiple inheritance? | Không (extends 1 abstract) | Có (implements nhiều interface) |\n| Runtime presence? | Có (compiled to JS class) | Không (erased) |\n| Khi nào dùng | Share code + bắt buộc implement vài method | Define contract pure, không có code chung |\n\n**Q3: Composition vs inheritance — chọn cái nào?**\n\nMặc định **composition**. Inheritance khi:\n- Có \"is-a\" relationship rõ ràng (Dog is-a Animal).\n- Cần override behavior từ parent.\n- Hierarchy không quá 2-3 level.\n\nTránh inheritance khi:\n- Chỉ để reuse code (dùng composition + delegate).\n- Subclass phá Liskov (cần override để DISABLE parent method).\n\n**Q4: Liskov Substitution Principle (LSP) là gì?**\n\nObject của subclass phải thay thế được object của superclass mà không phá behavior. Vi phạm thường thấy: `Square extends Rectangle` — setting `width` đổi cả `height` → phá behavior Rectangle.\n\n**Q5: Tại sao Page Object Model là OOP?**\n\nPOM áp dụng cả 4 pillars:\n- **Encapsulation**: locator + action gói trong class.\n- **Inheritance**: `BasePage` → `HomePage`, `CartPage`.\n- **Polymorphism**: override `waitForReady` cho page có async load đặc biệt.\n- **Abstraction**: `BasePage` abstract method `url`, subclass implement.\n\n### Output-Prediction Quiz\n\n```ts\nclass A {\n  greet() { return 'A'; }\n}\nclass B extends A {\n  greet() { return super.greet() + 'B'; }\n}\nclass C extends B {\n  greet() { return super.greet() + 'C'; }\n}\nconsole.log(new C().greet());\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `'ABC'`. Mỗi class call super, build chuỗi A → AB → ABC.\n\n</details>\n\n```ts\nclass Counter {\n  #count = 0;\n  inc() { this.#count++; }\n  get value() { return this.#count; }\n}\nconst c = new Counter();\nc.inc(); c.inc();\nconsole.log(c.value);\n// console.log(c.#count); // gì xảy ra?\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `2` cho `c.value`. `c.#count` → SyntaxError runtime (private field không access ngoài class).\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> TS `private` KHÔNG enforce runtime — chỉ TS check compile time. Code JS chạy vẫn access được. Dùng `#field` (private hash) để runtime enforce thật.\n\n> [!GOTCHA]\n> Deep inheritance chain (4-5 level) là code smell. Refactor sang composition.\n\n> [!GOTCHA]\n> Quên gọi `super()` trong subclass constructor (extends) → ReferenceError khi access `this`.\n\n> [!TIP]\n> Khi không chắc dùng abstract class hay interface: interface trước (purer, ít coupling). Abstract class chỉ khi cần SHARED CODE thật sự.\n\n---\n\n## TIER 3 — Advanced (gap từ interview feedback)\n\n> [!IMPORTANT]\n> Phần này bù đắp đúng các điểm interviewer đánh rớt: **Promise methods đầy đủ, event loop sâu, deep/shallow copy, function expressions, TypeScript syntax, coding tasks**. Mỗi phần có **\"Nó là gì → Thành phần/Phương thức → Ví dụ\"**.\n\n---\n\n## K. Promise — full method reference\n\n### Nó là gì\n\n`Promise` là object đại diện cho **kết quả tương lai** của một tác vụ bất đồng bộ. Nó có 3 state:\n\n- `pending` — chưa xong.\n- `fulfilled` — xong, có `value`.\n- `rejected` — lỗi, có `reason`.\n\nKhi đã rời `pending` thì **settled** (không đổi state nữa). Promise giải quyết \"callback hell\" bằng cách cho chain phẳng (`.then().then()`) và `async/await`.\n\n### Thành phần / phương thức\n\n**A. Static combinators (gộp nhiều promise):**\n\n| Method | Settle khi | Trả về | Reject khi |\n|---|---|---|---|\n| `Promise.all([])` | TẤT CẢ fulfilled | array values (đúng thứ tự) | promise ĐẦU TIÊN reject (fail-fast) |\n| `Promise.allSettled([])` | TẤT CẢ settled | `[{status,value}|{status,reason}]` | KHÔNG BAO GIỜ reject |\n| `Promise.race([])` | promise đầu tiên SETTLE | value/reason của cái đó | nếu cái đầu tiên là reject |\n| `Promise.any([])` | promise đầu tiên FULFILL | value đầu tiên | chỉ khi TẤT CẢ reject → `AggregateError` |\n\n**B. Static creators:**\n\n- `Promise.resolve(v)` — promise fulfilled sẵn (nếu `v` là thenable thì \"theo\" nó).\n- `Promise.reject(e)` — promise rejected sẵn.\n- `Promise.withResolvers()` (ES2024) — trả `{promise, resolve, reject}` để resolve từ ngoài.\n\n**C. Instance methods (chain):**\n\n- `.then(onFulfilled, onRejected)` — chạy khi settle, **trả promise mới** (chainable).\n- `.catch(onRejected)` = `.then(undefined, onRejected)`.\n- `.finally(fn)` — chạy dù fulfill hay reject, KHÔNG nhận value, KHÔNG đổi value (cleanup).\n\n### Code\n\n```ts\n// all — fail-fast, dùng khi cần TẤT CẢ thành công\nconst [u, p, o] = await Promise.all([api.users(), api.products(), api.orders()]);\n\n// allSettled — vẫn cần biết cái nào fail (vd refund nhiều order)\nconst results = await Promise.allSettled(ids.map((id) => api.refund(id)));\nconst ok = results.filter((r) => r.status === 'fulfilled');\nconst failed = results.filter((r) => r.status === 'rejected').map((r) => r.reason);\n\n// race — timeout pattern kinh điển\nfunction withTimeout<T>(p: Promise<T>, ms: number): Promise<T> {\n  const timeout = new Promise<never>((_, reject) =>\n    setTimeout(() => reject(new Error('timeout')), ms),\n  );\n  return Promise.race([p, timeout]);   // cái nào xong trước thắng\n}\n\n// any — lấy server nào trả lời nhanh nhất, bỏ qua server lỗi\nconst fastest = await Promise.any([fetch(mirror1), fetch(mirror2), fetch(mirror3)]);\n\n// withResolvers — resolve từ event bên ngoài\nconst { promise, resolve } = Promise.withResolvers<string>();\nsocket.on('message', (msg) => resolve(msg));\nconst firstMessage = await promise;\n\n// .finally — cleanup chạy dù pass/fail\nasync function load() {\n  showSpinner();\n  try {\n    return await api.fetch();\n  } finally {\n    hideSpinner();   // luôn chạy\n  }\n}\n```\n\n### Interview Q&A\n\n**Q1: `all` vs `allSettled` vs `race` vs `any` — chọn khi nào?**\n\n- `all`: cần TẤT CẢ thành công, fail 1 cái là bỏ hết (vd load 3 phần data bắt buộc).\n- `allSettled`: muốn biết kết quả từng cái, không bỏ cuộc giữa chừng (vd batch job, report).\n- `race`: lấy cái settle đầu tiên — timeout, hoặc \"cái nào nhanh nhất\".\n- `any`: lấy cái **fulfill** đầu tiên — fallback giữa nhiều nguồn, bỏ qua lỗi.\n\n**Q2: `Promise.race` vs `Promise.any` khác gì?**\n\n`race` dừng ở promise **settle** đầu tiên (kể cả reject). `any` bỏ qua reject, chỉ dừng ở **fulfill** đầu tiên; chỉ reject khi tất cả fail (gói lỗi vào `AggregateError`).\n\n**Q3: `.then(f, g)` vs `.then(f).catch(g)`?**\n\n`.then(f, g)`: `g` KHÔNG bắt được lỗi do `f` ném (chúng \"song song\"). `.then(f).catch(g)`: `g` bắt cả lỗi gốc lẫn lỗi trong `f`. → Luôn ưu tiên `.catch` cuối chain.\n\n**Q4: Một promise có `.then` nhiều lần được không?**\n\nĐược. Mỗi `.then` nhận cùng value (promise settle 1 lần, value cache). Khác callback chỉ gọi 1 lần.\n\n**Q5: Promise có cancel được không?**\n\nKhông native. Promise settle là settle. Muốn \"huỷ\" → dùng `AbortController` truyền `signal` vào `fetch`/API, hoặc dùng flag bỏ qua kết quả.\n\n### Output-Prediction Quiz\n\n```js\nPromise.race([\n  Promise.reject('A'),\n  Promise.resolve('B'),\n]).then((v) => console.log('then', v), (e) => console.log('catch', e));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `catch A`. `race` lấy promise settle ĐẦU TIÊN — ở đây reject 'A' đứng trước → reject toàn bộ.\n\n</details>\n\n```js\nPromise.any([\n  Promise.reject('x'),\n  Promise.reject('y'),\n]).catch((e) => console.log(e.constructor.name, e.errors));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `AggregateError ['x', 'y']`. `any` chỉ reject khi tất cả fail, gói reasons vào `AggregateError.errors`.\n\n</details>\n\n```js\nPromise.resolve(1)\n  .then((v) => v + 1)\n  .then((v) => { throw new Error('boom'); })\n  .then((v) => console.log('skipped'))\n  .catch((e) => console.log('caught', e.message))\n  .finally(() => console.log('done'));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `caught boom` rồi `done`. `.then` thứ 3 bị skip (vì chain đang ở rejected), `.catch` bắt, `.finally` luôn chạy cuối.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `Promise.all` **fail-fast**: 1 reject là cả nhóm reject, nhưng các promise khác VẪN chạy tiếp (không bị huỷ) — chỉ là kết quả bị bỏ. Nếu cần biết hết → `allSettled`.\n\n> [!GOTCHA]\n> `.finally(fn)` không nhận và không đổi value. `return` trong `finally` bị bỏ qua (trừ khi `throw`).\n\n> [!TIP]\n> Pattern timeout = `Promise.race([work, timeoutReject])`. Pattern fallback = `Promise.any([...mirrors])`.\n\n---\n\n## L. Event Loop — deep dive\n\n### Nó là gì\n\nJS là **single-threaded**: 1 call stack, chạy 1 việc tại 1 thời điểm. Event loop là cơ chế điều phối để code async không block thread. Runtime (browser/Node) cung cấp **Web APIs / libuv** chạy việc nền (timer, network, fs), rồi đẩy callback vào các **queue** để event loop nhặt.\n\n### Thành phần\n\n| Thành phần | Vai trò | Ví dụ nguồn |\n|---|---|---|\n| **Call stack** | Code đang chạy | function call |\n| **Web API / libuv** | Việc nền do runtime lo | `setTimeout`, `fetch`, fs |\n| **Microtask queue** | Ưu tiên CAO, flush HẾT mỗi vòng | Promise `.then`, `await`, `queueMicrotask`, `MutationObserver` |\n| **Macrotask queue** | Ưu tiên thấp, 1 cái/vòng | `setTimeout`, `setInterval`, I/O, message event |\n\n**Thuật toán (1 \"tick\"):**\n\n1. Lấy 1 macrotask, chạy đến khi stack rỗng.\n2. **Flush TOÀN BỘ** microtask queue (microtask sinh microtask cũng chạy hết).\n3. (Browser) render nếu cần.\n4. Quay lại bước 1.\n\n→ Microtask LUÔN chạy trước macrotask kế tiếp. Đây là điểm interviewer hỏi nhiều nhất.\n\n### Node-specific (bonus)\n\nNode có thêm phases: `timers` → `pending` → `poll` → `check` (`setImmediate`) → `close`. Và 2 microtask đặc biệt: `process.nextTick()` (ưu tiên CAO HƠN cả Promise microtask) chạy trước, rồi đến Promise queue.\n\n### Code / Quiz\n\n```js\nconsole.log('1: sync');\n\nsetTimeout(() => console.log('2: timeout (macro)'), 0);\n\nPromise.resolve().then(() => {\n  console.log('3: promise (micro)');\n  Promise.resolve().then(() => console.log('4: nested micro'));\n});\n\nqueueMicrotask(() => console.log('5: queueMicrotask'));\n\nconsole.log('6: sync');\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `1`, `6`, `3`, `5`, `4`, `2`\n\nSync trước (1, 6). Flush microtask: 3 chạy → đăng ký micro 4; 5 chạy; rồi 4 (nested micro vẫn trong cùng flush). Cuối cùng macrotask 2.\n\n</details>\n\n```js\nasync function a() {\n  console.log('A1');\n  await b();\n  console.log('A2');     // → microtask sau await\n}\nasync function b() { console.log('B'); }\nconsole.log('start');\na();\nconsole.log('end');\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `start`, `A1`, `B`, `end`, `A2`.\n\n`a()` chạy sync tới `await b()` → `b` chạy sync in `B`, trả promise → `a` nhường lại main → in `end`. Sau khi stack rỗng, microtask resume `a` → `A2`.\n\n</details>\n\n### Interview Q&A\n\n**Q1: Vì sao `setTimeout(fn, 0)` không chạy \"ngay\"?** Vì nó là **macrotask** — phải đợi stack rỗng VÀ toàn bộ microtask flush xong mới tới lượt.\n\n**Q2: `await` thực chất làm gì với event loop?** `await x` ~ `Promise.resolve(x).then(rest_of_function)`. Phần code sau `await` được lên lịch là **microtask**, không phải chạy đồng bộ.\n\n**Q3: Vòng `while(true){}` ảnh hưởng event loop?** Block hoàn toàn — stack không bao giờ rỗng → không microtask/macrotask nào chạy, UI freeze. Đây là lý do tránh long sync loop.\n\n> [!GOTCHA]\n> Microtask sinh microtask vô tận (`.then` đệ quy) → **đói macrotask**, UI không render. Macrotask thì \"công bằng\" hơn (1 cái/tick).\n\n> [!KEY]\n> Câu thần chú: **\"Sync hết → microtask hết → 1 macrotask → lặp.\"**\n\n---\n\n## M. Deep copy vs Shallow copy\n\n### Nó là gì\n\n- **Shallow copy:** copy 1 tầng. Primitive được copy giá trị; object/array lồng bên trong vẫn **share reference** với bản gốc.\n- **Deep copy:** copy đệ quy mọi tầng → bản mới hoàn toàn độc lập.\n\nLý do quan trọng: sửa nested của bản shallow copy sẽ **vô tình sửa bản gốc** → bug khó tìm, đặc biệt trong test data setup.\n\n### Thành phần / phương thức\n\n| Cách | Loại | Hạn chế |\n|---|---|---|\n| `{...obj}` / `[...arr]` | Shallow | nested vẫn share |\n| `Object.assign({}, obj)` | Shallow | nested vẫn share |\n| `arr.slice()` / `arr.concat()` | Shallow | nested vẫn share |\n| `structuredClone(obj)` | **Deep** (ES2022/Node 17+) | KHÔNG copy function, không copy prototype/class instance, throw với function |\n| `JSON.parse(JSON.stringify(obj))` | **Deep** | mất `Date`→string, `undefined`, function, `Map/Set`, `NaN`→null, lỗi vòng lặp |\n| lodash `_.cloneDeep` | **Deep** | cần thư viện, nhưng đầy đủ nhất |\n\n### Code\n\n```ts\nconst original = {\n  name: 'cart',\n  items: [{ id: 1, qty: 2 }],\n  meta: { createdAt: new Date() },\n};\n\n// Shallow — sửa nested ảnh hưởng gốc\nconst shallow = { ...original };\nshallow.items[0].qty = 99;\nconsole.log(original.items[0].qty);   // 99 😱 — share reference!\n\n// Top-level thì độc lập\nshallow.name = 'changed';\nconsole.log(original.name);           // 'cart' ✓ (string copy giá trị)\n\n// Deep — hoàn toàn độc lập\nconst deep = structuredClone(original);\ndeep.items[0].qty = 5;\nconsole.log(original.items[0].qty);   // 99 (không bị ảnh hưởng) ✓\n\n// JSON deep — mất Date\nconst jsonClone = JSON.parse(JSON.stringify(original));\nconsole.log(typeof jsonClone.meta.createdAt);  // 'string' (Date đã hỏng!) ⚠️\n```\n\n### Interview Q&A\n\n**Q1: `{...obj}` deep hay shallow?** Shallow. Chỉ tầng 1. Nested object/array vẫn chung reference.\n\n**Q2: Cách deep copy chuẩn nhất hiện nay?** `structuredClone()` (built-in, xử lý được `Date`, `Map`, `Set`, vòng lặp). Tránh `JSON.parse(JSON.stringify())` nếu data có `Date`/`undefined`/function.\n\n**Q3: Tại sao test bị \"data leak\" giữa các test case?** Thường do share 1 object fixture rồi mutate qua shallow copy. Fix: deep clone data trong `beforeEach`, hoặc dùng factory function tạo data mới mỗi lần.\n\n**Q4: `const` có ngăn được mutate object không?** Không. `const` chỉ khoá **rebinding** biến, không freeze nội dung. Muốn immutable nội dung → `Object.freeze(obj)` (shallow freeze).\n\n### Output-Prediction Quiz\n\n```js\nconst a = { x: 1, nested: { y: 2 } };\nconst b = { ...a };\nb.x = 10;\nb.nested.y = 20;\nconsole.log(a.x, a.nested.y);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `1 20`. `x` (primitive) độc lập; `nested` share reference → đổi `b.nested.y` đổi luôn `a`.\n\n</details>\n\n```js\nconst obj = { d: new Date('2020-01-01') };\nconst copy = JSON.parse(JSON.stringify(obj));\nconsole.log(obj.d instanceof Date, copy.d instanceof Date);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `true false`. JSON round-trip biến `Date` thành string.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `structuredClone` **throw** nếu object chứa function hoặc DOM node. Dùng cho data thuần.\n\n> [!GOTCHA]\n> `Object.freeze` là **shallow** — nested object vẫn sửa được. Cần \"deep freeze\" thủ công (đệ quy) nếu muốn khoá hết.\n\n---\n\n## N. Function expressions & các dạng function\n\n### Nó là gì\n\nJS có nhiều cách định nghĩa function, khác nhau về **hoisting, `this`, tên, và mục đích sử dụng**. Interviewer hay hỏi phân biệt \"function declaration vs expression\" và arrow.\n\n### Thành phần / các dạng\n\n| Dạng | Cú pháp | Hoisting | own `this`? | `arguments`? | `new`? |\n|---|---|---|---|---|---|\n| Function declaration | `function f() {}` | Full (gọi trước được) | ✅ | ✅ | ✅ |\n| Function expression (anonymous) | `const f = function () {}` | Như `const` (TDZ) | ✅ | ✅ | ✅ |\n| Named function expression | `const f = function g() {}` | TDZ; `g` chỉ thấy trong body | ✅ | ✅ | ✅ |\n| Arrow function | `const f = () => {}` | TDZ | ❌ (lexical) | ❌ | ❌ |\n| Method shorthand | `{ f() {} }` | — | ✅ | ✅ | ❌ |\n| IIFE | `(function(){})()` | chạy ngay | ✅ | ✅ | — |\n| Generator | `function* g() {}` | Full | ✅ | ✅ | ❌ |\n| Async | `async function f() {}` | Full | ✅ | ✅ | ❌ |\n\n### Code\n\n```js\n// 1. Declaration — hoisted full, gọi trước khi định nghĩa OK\nsayHi();                         // \"hi\" ✓\nfunction sayHi() { console.log('hi'); }\n\n// 2. Expression — TDZ, gọi trước = lỗi\nsayBye();                        // TypeError: sayBye is not a function\nvar sayBye = function () { console.log('bye'); };\n\n// 3. Named function expression — tên dùng để đệ quy, không leak ra ngoài\nconst factorial = function fac(n) {\n  return n <= 1 ? 1 : n * fac(n - 1);   // 'fac' chỉ thấy bên trong\n};\n// fac(3) → ReferenceError ngoài scope\n\n// 4. IIFE — tạo scope riêng, tránh ô nhiễm global (pattern cũ trước module)\nconst counter = (function () {\n  let count = 0;                  // private\n  return { inc: () => ++count };\n})();\n\n// 5. Arrow — không có this riêng, gọn cho callback\nconst nums = [1, 2, 3].map((n) => n * 2);   // [2, 4, 6]\n\n// 6. Higher-order function — nhận/trả function (nền tảng FP)\nconst multiplier = (factor) => (n) => n * factor;   // currying\nconst double = multiplier(2);\ndouble(5);   // 10\n```\n\n### Interview Q&A\n\n**Q1: Function declaration vs function expression?** Declaration hoist cả body → gọi trước dòng định nghĩa được. Expression gán cho biến → tuân TDZ/hoisting của `var/let/const`, gọi trước = lỗi. Declaration tốt cho API top-level; expression tốt khi gán có điều kiện / truyền làm giá trị.\n\n**Q2: First-class function nghĩa là gì?** Function trong JS là **giá trị**: gán vào biến, truyền làm tham số, return từ function khác, lưu trong array/object. → Nền tảng cho callback, HOF, closure.\n\n**Q3: Higher-order function (HOF) là gì? Ví dụ?** Function nhận function làm arg HOẶC trả về function. Ví dụ: `map`, `filter`, `reduce`, `setTimeout`, middleware, currying. Cực phổ biến trong test (custom matcher, retry wrapper).\n\n**Q4: IIFE để làm gì (thời module hoá hiện đại)?** Tạo private scope tức thì, tránh biến rò ra global. Trước ESM rất phổ biến; nay ít dùng vì module đã có scope riêng, nhưng vẫn gặp trong code cũ và `(async () => { await ... })()` để chạy async ở top-level CJS.\n\n**Q5: Tại sao arrow không làm method/constructor được?** Arrow không có `this` riêng (lấy lexical), không có `prototype`, không có `arguments` → `new` ném lỗi, và method arrow sẽ trỏ `this` sai (ra scope ngoài thay vì object).\n\n### Output-Prediction Quiz\n\n```js\nconsole.log(typeof foo, typeof bar);\nfunction foo() {}\nvar bar = function () {};\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `function undefined`. `foo` declaration hoist full; `bar` mới chỉ hoist biến `var` = `undefined`.\n\n</details>\n\n```js\nconst add = (a) => (b) => (c) => a + b + c;\nconsole.log(add(1)(2)(3));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `6`. Curry 3 tầng — mỗi arrow trả arrow nhận arg kế, closure giữ `a`, `b`.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `var f = function() {}` bị hoist là `undefined` → gọi trước dòng gán = `TypeError: f is not a function`, KHÁC với declaration.\n\n> [!TIP]\n> Async top-level trong file CJS: bọc IIFE → `(async () => { await main(); })();`. Trong ESM có thể `await` thẳng top-level.\n\n---\n\n## O. TypeScript syntax essentials\n\n### Nó là gì\n\nTypeScript = JavaScript + **static type system** (kiểm tra lúc compile, bị **erase** khi chạy). Mục tiêu: bắt bug sớm, autocomplete tốt, code tự document. Trong test automation: type cho API response, fixture, Page Object → đỡ lỗi typo, refactor an toàn.\n\n### Thành phần / cú pháp cốt lõi\n\n**1. Type cơ bản & annotation**\n```ts\nlet count: number = 0;\nlet name: string = 'Hai';\nlet active: boolean = true;\nlet ids: number[] = [1, 2, 3];\nlet pair: [string, number] = ['age', 30];        // tuple\nlet anything: unknown;                            // an toàn hơn 'any'\nfunction log(msg: string): void {}\nfunction fail(): never { throw new Error(); }     // không bao giờ return\n```\n\n**2. `interface` vs `type`**\n```ts\ninterface User { id: number; name: string; email?: string; }  // ? = optional\ntype ID = string | number;                        // union — chỉ type làm được\ntype Point = { x: number; y: number };\n// interface: extend được, merge declaration; type: linh hoạt hơn (union, mapped, conditional)\n```\n\n**3. Union, intersection, literal, narrowing**\n```ts\ntype Status = 'active' | 'inactive' | 'pending';  // literal union\ntype Admin = User & { role: 'admin' };            // intersection (gộp)\n\nfunction area(shape: Circle | Square) {\n  if (shape.kind === 'circle') return Math.PI * shape.r ** 2;  // narrowing\n  return shape.side ** 2;\n}\n```\n\n**4. Generics (tái dùng với nhiều type)**\n```ts\nfunction first<T>(arr: T[]): T | undefined { return arr[0]; }\nconst n = first([1, 2, 3]);        // T = number\nconst s = first(['a', 'b']);       // T = string\n\ninterface ApiResponse<T> { data: T; status: number; }\ntype UserResponse = ApiResponse<User>;\n\nfunction identity<T extends { id: number }>(x: T): T { return x; }  // constraint\n```\n\n**5. Utility types (built-in, hay hỏi)**\n```ts\nPartial<User>      // tất cả field optional\nRequired<User>     // tất cả field bắt buộc\nReadonly<User>     // tất cả field readonly\nPick<User, 'id' | 'name'>     // chỉ lấy vài field\nOmit<User, 'email'>           // bỏ vài field\nRecord<string, number>        // { [key: string]: number }\nReturnType<typeof fn>         // type trả về của fn\nAwaited<Promise<User>>        // unwrap Promise → User\n```\n\n**6. Enum & const assertion**\n```ts\nenum Role { Admin, User, Guest }              // Admin=0, User=1...\nenum Color { Red = 'RED', Blue = 'BLUE' }     // string enum\nconst ROLES = ['admin', 'user'] as const;     // readonly tuple, literal type\ntype Role2 = typeof ROLES[number];            // 'admin' | 'user'\n```\n\n**7. Type guards & assertion**\n```ts\nfunction isString(x: unknown): x is string {   // type predicate\n  return typeof x === 'string';\n}\nconst el = document.querySelector('input') as HTMLInputElement;  // assertion\nconst val = data!.value;                       // non-null assertion (cẩn ththận)\n```\n\n### Interview Q&A\n\n**Q1: `interface` vs `type` — khác gì, chọn cái nào?**\n- `interface`: extend được (`extends`), **declaration merging** (khai báo trùng tên thì gộp), hợp cho shape object/class contract.\n- `type`: làm được union/intersection/mapped/conditional, không merge.\n- Rule of thumb: object/class dùng `interface`; union/utility/phức tạp dùng `type`. (Nhiều team chọn `type` cho mọi thứ vì nhất quán.)\n\n**Q2: `any` vs `unknown` vs `never`?**\n- `any`: tắt type check (nguy hiểm, \"thoát\" type system).\n- `unknown`: an toàn — phải narrow/check trước khi dùng.\n- `never`: không có giá trị nào (function throw, hoặc nhánh không thể xảy ra). Dùng cho exhaustiveness check.\n\n**Q3: Generics để làm gì?** Tái dùng logic với nhiều type mà vẫn giữ type safety (không mất type như `any`). Vd `Promise<T>`, `Array<T>`, API client `get<T>(url): Promise<T>`.\n\n**Q4: TS type có tồn tại lúc runtime không?** KHÔNG — bị erase khi compile sang JS. → Không thể `if (x instanceof MyInterface)`. Muốn check runtime phải dùng type guard thủ công hoặc thư viện (zod).\n\n**Q5: `Partial` / `Pick` / `Omit` dùng khi nào?** `Partial` cho update payload (chỉ vài field). `Pick`/`Omit` tạo DTO từ entity lớn (vd `Omit<User, 'password'>` cho response).\n\n### Output-Prediction Quiz\n\n```ts\ntype T = Pick<{ a: number; b: string; c: boolean }, 'a' | 'c'>;\n// T tương đương type gì?\n```\n\n<details><summary>Answer</summary>\n\n`{ a: number; c: boolean }`. `Pick` giữ đúng các key được liệt kê.\n\n</details>\n\n```ts\nconst x: unknown = 'hello';\n// console.log(x.toUpperCase());  // ?\n```\n\n<details><summary>Answer</summary>\n\nCompile error: `'x' is of type 'unknown'`. Phải narrow trước: `if (typeof x === 'string') x.toUpperCase()`.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> Type bị **erased** lúc runtime. Validate dữ liệu external (API response) phải dùng runtime validator (zod, ajv) — TS type KHÔNG bảo vệ runtime.\n\n> [!GOTCHA]\n> `as` (type assertion) không convert/check gì — chỉ \"ép\" compiler tin. Ép sai → bug runtime mà compiler im lặng.\n\n> [!TIP]\n> Bật `strict: true` trong tsconfig: bắt `null`/`undefined`, `noImplicitAny`... Đây là dấu hiệu codebase chất lượng mà interviewer thích nghe.\n\n---\n\n## P. Coding tasks — bài tập hay gặp\n\n### Nó là gì\n\nVòng coding của interview QA/SDET thường là bài **nhỏ-vừa**: string/array manipulation, đếm tần suất, debounce/throttle, deep clone, implement Promise helper, hoặc viết 1 hàm test utility. Quan trọng: **nói ra cách nghĩ + edge case + độ phức tạp**, không chỉ ra đáp án.\n\n### Bài mẫu + lời giải\n\n**1. Đếm tần suất (frequency map)**\n```ts\nfunction countWords(text: string): Record<string, number> {\n  return text\n    .toLowerCase()\n    .split(/\\s+/)\n    .filter(Boolean)\n    .reduce<Record<string, number>>((acc, w) => {\n      acc[w] = (acc[w] ?? 0) + 1;\n      return acc;\n    }, {});\n}\ncountWords('a b a c b a');  // { a: 3, b: 2, c: 1 }\n```\n\n**2. Reverse / palindrome**\n```ts\nconst reverse = (s: string): string => [...s].reverse().join('');\nconst isPalindrome = (s: string): boolean => {\n  const clean = s.toLowerCase().replace(/[^a-z0-9]/g, '');\n  return clean === [...clean].reverse().join('');\n};\n```\n\n**3. Unique / dedupe**\n```ts\nconst unique = <T>(arr: T[]): T[] => [...new Set(arr)];\n// dedupe theo key của object:\nconst uniqueBy = <T>(arr: T[], key: keyof T) =>\n  [...new Map(arr.map((x) => [x[key], x])).values()];\n```\n\n**4. Group by**\n```ts\nfunction groupBy<T>(arr: T[], keyFn: (x: T) => string): Record<string, T[]> {\n  return arr.reduce<Record<string, T[]>>((acc, item) => {\n    const k = keyFn(item);\n    (acc[k] ??= []).push(item);\n    return acc;\n  }, {});\n}\n```\n\n**5. Debounce & Throttle (rất hay hỏi)**\n```ts\n// Debounce: chỉ chạy SAU khi ngừng gọi 'ms' ms (vd search input)\nfunction debounce<A extends unknown[]>(fn: (...a: A) => void, ms: number) {\n  let timer: ReturnType<typeof setTimeout>;\n  return (...args: A) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), ms);\n  };\n}\n\n// Throttle: chạy tối đa 1 lần mỗi 'ms' (vd scroll handler)\nfunction throttle<A extends unknown[]>(fn: (...a: A) => void, ms: number) {\n  let last = 0;\n  return (...args: A) => {\n    const now = performance.now();\n    if (now - last >= ms) { last = now; fn(...args); }\n  };\n}\n```\n\n**6. Flatten nested array (đệ quy)**\n```ts\nfunction flatten(arr: unknown[]): unknown[] {\n  return arr.reduce<unknown[]>(\n    (acc, x) => acc.concat(Array.isArray(x) ? flatten(x) : x),\n    [],\n  );\n}\n// hoặc built-in: arr.flat(Infinity)\n```\n\n**7. Implement `Promise.all` (test hiểu Promise)**\n```ts\nfunction promiseAll<T>(promises: Promise<T>[]): Promise<T[]> {\n  return new Promise((resolve, reject) => {\n    const results: T[] = [];\n    let done = 0;\n    if (promises.length === 0) return resolve([]);\n    promises.forEach((p, i) => {\n      Promise.resolve(p).then((val) => {\n        results[i] = val;            // giữ đúng thứ tự\n        if (++done === promises.length) resolve(results);\n      }, reject);                    // reject đầu tiên → reject all\n    });\n  });\n}\n```\n\n**8. Sleep / retry (thực dụng cho test)**\n```ts\nconst sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));\n\nasync function retry<T>(fn: () => Promise<T>, max = 3, base = 500): Promise<T> {\n  for (let i = 0; i < max; i++) {\n    try { return await fn(); }\n    catch (e) { if (i === max - 1) throw e; await sleep(base * 2 ** i); }\n  }\n  throw new Error('unreachable');\n}\n```\n\n### Interview cách trình bày\n\n> [!KEY]\n> Quy trình 4 bước khi làm coding task live:\n> 1. **Clarify**: hỏi input/output, edge case (empty? null? duplicate? case-sensitive?).\n> 2. **Approach**: nói cách làm + độ phức tạp trước khi gõ (\"dùng Set → O(n)\").\n> 3. **Code**: gõ, vừa gõ vừa giải thích.\n> 4. **Test**: chạy thử với 1 happy case + 1 edge case.\n\n### Gotcha\n\n> [!GOTCHA]\n> Debounce vs throttle hay bị lẫn: **debounce** = đợi im lặng rồi mới chạy (search). **throttle** = giới hạn tần suất, chạy đều đặn (scroll/resize).\n\n> [!TIP]\n> Khi quên syntax, nói \"tôi sẽ dùng `Set` để dedupe\" — interviewer chấm tư duy, không phải trí nhớ API.\n\n---\n\n## Tổng kết — chiến lược ôn\n\n> [!IMPORTANT]\n> Nhóm phải thuộc lòng cho QA Automation interview:\n> 1. **Async / Promise / `this`** — bug ở automation thường rooted ở đây. Promise methods (K) + event loop (L) là câu hỏi tủ.\n> 2. **Closures + Hoisting + Function forms (N)** — output-prediction trap kinh điển.\n> 3. **OOP + POM + Design Patterns/SOLID** — kiến trúc framework xoay quanh (xem thêm category *Design Patterns*).\n> 4. **Deep/shallow copy (M) + TypeScript syntax (O)** — gap hay bị hỏi mà dễ trả lời lúng túng.\n> 5. **Coding tasks (P)** — luyện debounce/throttle, dedupe, group-by, implement `Promise.all`.\n\n> [!TIP]\n> Các category bổ trợ cho gap interview: **Design Patterns** (SOLID/DRY/GoF), **Testing Craft** (BDD, stub/mock, contract testing, code quality), **Git Advanced** (rebase, branching strategy, rescue commands).\n\n> [!TIP]\n> Quy trình ôn 1 topic:\n> 1. Đọc mental model (5 phút).\n> 2. Predict output 3-5 quiz (10 phút).\n> 3. Viết code thử (15 phút).\n> 4. 1 tuần sau làm lại quiz để chống quên (spaced repetition).\n\n> [!KEY]\n> Interview tip: khi bị hỏi câu output-prediction, **nói ra suy luận** thay vì đoán đáp án. \"Tôi nghĩ event loop sẽ chạy sync trước, sau đó microtask Promise, cuối cùng setTimeout — output sẽ là...\" → interviewer thấy bạn HIỂU, không chỉ memorize.\n","words":9849},{"id":"design-patterns","title":"Design Patterns","sub":"SOLID, DRY, GoF trong test framework","accent":"#6a9bcc","spec":"patterns.solid","file":"design_patterns.md","idx":8,"content":"# Design Patterns & Principles (for QA Automation / SDET)\n\n> Mục tiêu: trả lời tốt câu \"thiết kế framework\", \"anh dùng design pattern nào\", \"SOLID/DRY là gì\".\n> Format: **Nó là gì → Thành phần → Ví dụ (ưu tiên context Playwright/test) → Q&A → Gotcha**.\n\n---\n\n## A. Nguyên tắc nền tảng (Principles)\n\n### Nó là gì\n\nPrinciples là **quy tắc tư duy** để code dễ đọc, dễ sửa, dễ test. Không phải code cụ thể — là kim chỉ nam. Interviewer hỏi để xem bạn có viết code \"trưởng thành\" hay không.\n\n### Các nguyên tắc cốt lõi\n\n| Viết tắt | Tên đầy đủ | Tinh thần 1 câu |\n|---|---|---|\n| **DRY** | Don't Repeat Yourself | Mỗi mẩu kiến thức/logic chỉ tồn tại **1 nơi**. |\n| **KISS** | Keep It Simple, Stupid | Giải pháp đơn giản nhất chạy được; tránh over-engineer. |\n| **YAGNI** | You Aren't Gonna Need It | Đừng code cho tính năng \"sau này có thể cần\". |\n| **SoC** | Separation of Concerns | Mỗi phần lo 1 việc (UI / logic / data tách nhau). |\n| **Composition over Inheritance** | — | Ưu tiên \"has-a\" hơn \"is-a\"; ghép nhỏ thay vì kế thừa sâu. |\n| **Fail fast** | — | Lỗi thì báo ngay, sớm, rõ — đừng nuốt lỗi. |\n\n### Ví dụ — DRY trong test\n\n```ts\n// ❌ WET (Write Everything Twice) — login lặp ở mọi test\ntest('test 1', async ({ page }) => {\n  await page.goto('/login');\n  await page.fill('#user', 'admin');\n  await page.fill('#pass', 'pw');\n  await page.click('#submit');\n  // ...\n});\n// (lặp y hệt ở test 2, 3, 4...)\n\n// ✅ DRY — gom vào fixture / helper / Page Object\nexport const test = base.extend({\n  authedPage: async ({ page }, use) => {\n    await loginAs(page, 'admin');   // 1 nơi duy nhất\n    await use(page);\n  },\n});\n```\n\n> [!GOTCHA]\n> DRY bị **lạm dụng** = abstraction sai. Hai đoạn code \"trông giống\" nhưng thay đổi vì lý do khác nhau thì KHÔNG nên gộp (gộp xong sửa 1 cái phá cái kia). Quy tắc: trùng lặp về **kiến thức** mới gộp, trùng ngẫu nhiên thì để yên (Rule of Three: lặp 3 lần mới refactor).\n\n### Q&A\n\n**Q: DRY và KISS có khi nào mâu thuẫn?** Có. DRY quá đà tạo abstraction phức tạp (vi phạm KISS). Cân bằng: ưu tiên đọc hiểu; chỉ trừu tượng khi trùng lặp thật sự và ổn định.\n\n**Q: YAGNI áp dụng cho test thế nào?** Đừng xây \"framework siêu linh hoạt\" cho 5 test. Bắt đầu đơn giản, refactor khi pattern lặp lại thật.\n\n---\n\n## B. SOLID — chi tiết từng nguyên tắc\n\n### Nó là gì\n\n5 nguyên tắc thiết kế OOP (Robert C. Martin) giúp code **dễ mở rộng, dễ test, ít coupling**. Đây là câu hỏi gần như chắc chắn ở interview middle+.\n\n### S — Single Responsibility Principle (SRP)\n\n**1 class chỉ nên có 1 lý do để thay đổi.**\n\n```ts\n// ❌ Class làm quá nhiều: locator + API + report\nclass HomePageBad {\n  async search() {}\n  async callSearchApi() {}        // việc của API client\n  writeReportToFile() {}          // việc của reporter\n}\n\n// ✅ Tách trách nhiệm\nclass HomePage { async search() {} }        // chỉ UI interaction\nclass SearchApi { async query() {} }        // chỉ gọi API\nclass Reporter { write() {} }               // chỉ report\n```\n\n### O — Open/Closed Principle (OCP)\n\n**Mở để mở rộng, đóng để sửa đổi.** Thêm hành vi mới bằng cách thêm code, không sửa code cũ (tránh phá thứ đang chạy).\n\n```ts\n// ❌ Mỗi loại mới phải sửa hàm cũ\nfunction pay(method: string) {\n  if (method === 'visa') {}\n  else if (method === 'paypal') {}   // thêm loại = sửa hàm này\n}\n\n// ✅ Mở rộng qua interface\ninterface PaymentMethod { pay(amount: number): Promise<void>; }\nclass Visa implements PaymentMethod { async pay() {} }\nclass Paypal implements PaymentMethod { async pay() {} }\nfunction checkout(m: PaymentMethod, amt: number) { return m.pay(amt); }\n// thêm Momo = tạo class mới, KHÔNG đụng checkout()\n```\n\n### L — Liskov Substitution Principle (LSP)\n\n**Subclass phải thay thế được superclass mà không phá behavior.**\n\n```ts\n// ❌ Vi phạm kinh điển: Square extends Rectangle\nclass Rectangle { setW(w){} setH(h){} }\nclass Square extends Rectangle {\n  setW(w) { this.w = this.h = w; }   // set width đổi cả height → phá expectation\n}\n// Code mong Rectangle: setW(5); setH(4); area===20 → Square trả 16 → SAI\n```\nFix: đừng dùng inheritance ở đây; tách abstraction `Shape` với `area()`.\n\n### I — Interface Segregation Principle (ISP)\n\n**Nhiều interface nhỏ, chuyên biệt > 1 interface to.** Đừng ép class implement method nó không cần.\n\n```ts\n// ❌ Interface béo\ninterface Worker { code(): void; test(): void; deploy(): void; }\n// Tester buộc implement code() và deploy() dù không dùng\n\n// ✅ Tách nhỏ\ninterface Coder { code(): void; }\ninterface Tester { test(): void; }\nclass QA implements Tester { test() {} }   // chỉ những gì cần\n```\n\n### D — Dependency Inversion Principle (DIP)\n\n**Phụ thuộc vào abstraction, không phải concrete.** Module cao cấp không nên phụ thuộc trực tiếp module chi tiết.\n\n```ts\n// ❌ Test phụ thuộc trực tiếp client cụ thể\nclass UserTest { private api = new RealHttpClient(); }  // khó mock\n\n// ✅ Inject abstraction → dễ thay mock khi test\ninterface HttpClient { get(url: string): Promise<unknown>; }\nclass UserTest {\n  constructor(private http: HttpClient) {}   // inject — test truyền mock được\n}\n```\n\n### Q&A\n\n**Q: SOLID nào quan trọng nhất với test automation?** SRP (Page Object chỉ lo 1 page) + DIP (inject dependency → mock dễ) là dùng nhiều nhất. OCP giúp framework mở rộng matcher/reporter không phá code cũ.\n\n**Q: Ví dụ SRP trong Page Object Model?** `LoginPage` chỉ chứa locator + action của trang login. API call tách ra `AuthApi`, assertion tách ra test, data tách ra fixture/factory.\n\n**Q: DIP liên quan gì tới Dependency Injection?** DIP là nguyên tắc (phụ thuộc abstraction); DI là kỹ thuật thực hiện (truyền dependency từ ngoài vào qua constructor/param) — Playwright fixture chính là DI.\n\n> [!KEY]\n> Mẹo trả lời SOLID: với mỗi chữ, nói **1 câu định nghĩa + 1 ví dụ từ chính framework của bạn** (POM, fixture, API client). Interviewer thích ví dụ thật hơn lý thuyết suông.\n\n---\n\n## C. Design Patterns (GoF) — cái hay dùng trong automation\n\n### Nó là gì\n\nDesign pattern = **giải pháp tái sử dụng cho vấn đề thiết kế lặp lại**. 23 pattern GoF chia 3 nhóm: **Creational** (tạo object), **Structural** (ghép object), **Behavioral** (giao tiếp giữa object). Dưới đây là các pattern thực sự xuất hiện trong test framework.\n\n### 1. Page Object Model (biến thể của Facade/Adapter)\n\nĐóng gói locator + action của 1 trang vào 1 class → test đọc như ngôn ngữ nghiệp vụ, locator đổi chỉ sửa 1 nơi.\n\n```ts\nclass LoginPage {\n  constructor(private page: Page) {}\n  async login(u: string, p: string) {\n    await this.page.fill('#user', u);\n    await this.page.fill('#pass', p);\n    await this.page.click('#submit');\n  }\n}\n```\n\n### 2. Factory\n\nTạo object/test-data mà không lộ logic khởi tạo. Dùng nhiều cho **test data builder**.\n\n```ts\n// Factory cho test data — mỗi lần gọi tạo object MỚI (tránh share/mutate)\nfunction makeUser(overrides: Partial<User> = {}): User {\n  return { id: 1, name: 'Default', email: 'd@x.com', role: 'user', ...overrides };\n}\nconst admin = makeUser({ role: 'admin' });\n```\n\n### 3. Builder\n\nDựng object phức tạp từng bước, dễ đọc — hay dùng cho request/test data nhiều field.\n\n```ts\nclass RequestBuilder {\n  private req: Partial<Req> = {};\n  url(u: string) { this.req.url = u; return this; }       // chainable\n  header(k: string, v: string) { (this.req.headers ??= {})[k] = v; return this; }\n  build(): Req { return this.req as Req; }\n}\nconst r = new RequestBuilder().url('/api').header('Auth', 'token').build();\n```\n\n### 4. Singleton\n\n1 instance duy nhất toàn app — vd config, logger, browser pool. Cẩn thận: gây shared state khó test.\n\n```ts\nclass Config {\n  private static instance: Config;\n  static get(): Config { return (this.instance ??= new Config()); }\n}\n```\n\n### 5. Strategy\n\nĐổi thuật toán/hành vi lúc runtime qua interface chung (≈ OCP). Vd chọn cách auth, chọn reporter.\n\n```ts\ninterface WaitStrategy { wait(page: Page): Promise<void>; }\nclass NetworkIdle implements WaitStrategy { async wait(p) { await p.waitForLoadState('networkidle'); } }\nclass Selector implements WaitStrategy { async wait(p) { await p.waitForSelector('.ready'); } }\nasync function open(page: Page, strategy: WaitStrategy) { await strategy.wait(page); }\n```\n\n### 6. Observer / Pub-Sub\n\nObject đăng ký lắng nghe sự kiện. Test reporter của Playwright (`onTestEnd`, `onStepEnd`) chính là observer.\n\n```ts\nclass Reporter {\n  onTestEnd(test, result) { console.log(test.title, result.status); }\n}\n```\n\n### 7. Decorator\n\nBọc thêm hành vi quanh function/object mà không sửa nó. Vd thêm retry/log quanh 1 action.\n\n```ts\nfunction withRetry<A extends unknown[], R>(fn: (...a: A) => Promise<R>, max = 3) {\n  return async (...args: A): Promise<R> => {\n    for (let i = 0; i < max; i++) {\n      try { return await fn(...args); } catch (e) { if (i === max - 1) throw e; }\n    }\n    throw new Error('unreachable');\n  };\n}\nconst safeClick = withRetry(click);\n```\n\n### 8. Adapter\n\nChuyển interface này sang interface khác cho tương thích. Vd bọc 2 HTTP client (axios/fetch) sau 1 interface chung.\n\n### Q&A\n\n**Q: Framework của bạn dùng pattern nào?** POM (Facade), Factory cho test data, Builder cho request, Strategy cho wait/auth, Fixture (DI) cho setup/teardown, Observer cho reporter. Nói kèm \"vì sao\": giảm trùng lặp, dễ bảo trì, dễ mock.\n\n**Q: Singleton có hại gì cho test?** Tạo **global mutable state** → test này ảnh hưởng test kia, khó chạy song song, khó reset. Ưu tiên DI thay vì singleton khi có thể.\n\n**Q: Phân biệt Factory vs Builder?** Factory tạo object trong 1 lời gọi (đơn giản). Builder dựng từng bước, chainable (nhiều field/biến thể, dễ đọc).\n\n> [!GOTCHA]\n> Đừng \"nhồi pattern\" để khoe. Interviewer middle thích thấy bạn dùng đúng pattern cho đúng vấn đề (POM, Factory, Fixture) hơn là kể tên 23 pattern GoF.\n\n> [!TIP]\n> Liên hệ ngược: SRP → POM; OCP/DIP → Strategy + interface; DI → Fixture; DRY → helper/factory. Trả lời theo cặp \"nguyên tắc ↔ pattern ↔ ví dụ thật\" sẽ rất mạnh.\n\n---\n\n## D. Ví dụ THẬT từ framework này (Uniqlo — Playwright + TS)\n\n> Đây là phần \"ăn điểm\" nhất khi phỏng vấn: kể pattern kèm code thật từ project mình từng làm, thay vì lý thuyết suông. Mỗi mục có sẵn **\"Câu nói khi phỏng vấn\"** để dùng ngay.\n\n### 1. Page Object Model — `base.page.ts`, `home.page.ts`, `item.list.page.ts`\n\nMỗi trang = 1 class, chứa locator + action riêng. Test chỉ gọi tên, không đụng locator thô.\n\n```ts\n// home.page.ts — locator gói trong class, đổi UI chỉ sửa 1 nơi\nexport class HomePage extends BasePage {\n  btnMen    = this._page.getByRole('tab', { name: 'men', exact: true });\n  btnSearch = this._page.getByRole('button', { name: this.t.Search });\n  txbSearch = this._page.getByRole('searchbox', { name: this.t.Search });\n}\n```\n\n> **Câu nói khi phỏng vấn:** *\"Em áp dụng Page Object Model — mỗi trang là một class chứa locator và hành động của trang đó. Test không chứa CSS/XPath thô, nên khi UI đổi em chỉ sửa trong page class, không phải sờ vào test.\"*\n\n**Principle liên quan:** SRP (mỗi page lo 1 trang), DRY (locator định nghĩa 1 nơi).\n\n### 2. Inheritance + Base class (Template-ish) — `base.page.ts`\n\n`BasePage` giữ thứ **chung cho mọi trang**: `_page`, locale `t`, và `acceptCookiesIfShown()`. Mọi page `extends` nó.\n\n```ts\nexport class BasePage {\n  readonly _page: Page;\n  readonly t: LocaleStrings;\n  constructor(page: Page) {\n    this._page = page;\n    this.t = Locales[getLocale()];   // mọi page tự có bộ chuỗi đúng ngôn ngữ\n  }\n  async acceptCookiesIfShown(timeout = 3000) { /* logic chung, viết 1 lần */ }\n}\nexport class HomePage extends BasePage { constructor(page: Page) { super(page); } }\n```\n\n> **Câu nói khi phỏng vấn:** *\"Em có một `BasePage` chứa những thứ dùng chung như cookie banner và bộ chuỗi locale, các page kế thừa nó — đúng tinh thần DRY. Em có cân nhắc composition thay vì inheritance, nhưng ở đây tất cả page thật sự 'is-a' page và cùng chia sẻ cùng một `Page` context nên inheritance 1 tầng là hợp lý, chưa cần phức tạp hóa (KISS).\"*\n\n> [!GOTCHA]\n> Interviewer có thể \"gài\": *\"Sao không dùng composition over inheritance?\"* → Trả lời: inheritance **1 tầng, nông** cho thứ thật sự chung thì ổn; điều cần tránh là kế thừa **sâu nhiều tầng**. Nếu sau này logic phình to (auth, API, cookie...) thì tách helper và **compose** vào page sẽ tốt hơn kế thừa thêm tầng.\n\n### 3. Dependency Injection qua Fixture — `fixture.ts`\n\nPlaywright fixture = DI thực thụ. `appPage` lo sẵn goto + đợi load + accept cookie, rồi **inject** page đã sẵn sàng vào test.\n\n```ts\nexport const test = baseTest.extend<Fixtures>({\n  appPage: async ({ page }, use) => {\n    await page.goto(AppUrl.Default);\n    await page.waitForLoadState('domcontentloaded');\n    await new BasePage(page).acceptCookiesIfShown();\n    await use(page);            // test nhận page đã sẵn sàng — setup nằm 1 nơi\n  },\n});\n// test chỉ cần: test('...', async ({ appPage }) => { ... })\n```\n\n> **Câu nói khi phỏng vấn:** *\"Setup lặp lại (mở trang, đợi load, tắt cookie banner) em gom vào một Playwright fixture tên `appPage`. Đây chính là Dependency Injection: test không tự dựng state mà nhận sẵn từ ngoài — vừa DRY, vừa giúp mỗi test độc lập nên chạy song song an toàn.\"*\n\n**Principle liên quan:** DIP (test phụ thuộc \"một page đã sẵn sàng\", không quan tâm cách dựng), DRY, SRP.\n\n### 4. Strategy / Lookup cho i18n + OCP — `locales.ts` + `constant.enum.ts` ⭐\n\nĐây là ví dụ **thiết kế xịn nhất** trong repo. `getLocale()` đọc URL → chọn bộ chuỗi (`us`/`uk`/`vn`). Page dùng `this.t.Search` mà **không cần biết** đang ở locale nào.\n\n```ts\n// constant.enum.ts — chọn \"strategy\" ngôn ngữ theo runtime (từ BASE_URL)\nexport function getLocale(): Locale {\n  if (pathname.endsWith('/vn/en/')) return 'vn';\n  if (pathname.endsWith('/uk/en/')) return 'uk';\n  return 'us';\n}\n// locales.ts — mỗi locale là 1 bộ chuỗi (1 \"strategy\")\nexport const Locales = {\n  us: { Search: 'Search', /* ... */ },\n  uk: { Search: 'What are you looking for?', /* ... */ },\n  vn: { Search: 'What are you looking for?', /* ... */ },\n} as const;\n// home.page.ts — dùng chung, không rẽ nhánh if/else theo nước\nbtnSearch = this._page.getByRole('button', { name: this.t.Search });\n```\n\n> **Câu nói khi phỏng vấn:** *\"Uniqlo chạy nhiều thị trường nên chuỗi UI khác nhau. Thay vì rải `if country === 'uk'` khắp test, em tách bảng locale: `getLocale()` chọn bộ chuỗi theo URL, page chỉ tham chiếu `this.t.Search`. Muốn thêm thị trường mới em chỉ thêm một key vào `Locales`, không sửa một dòng page hay test nào — đúng Open/Closed Principle.\"*\n\n> [!KEY]\n> Đây là chỗ thể hiện **OCP** rõ nhất: *mở để mở rộng* (thêm locale = thêm data), *đóng để sửa đổi* (không đụng code page/test). Nêu được điều này ở interview là điểm cộng lớn — nó chứng minh bạn hiểu principle qua hành động thật, không chỉ định nghĩa.\n\n### 5. Centralized Config (kiểu Singleton/module) — `constant.enum.ts`\n\n`AppUrl` là nguồn config **duy nhất**, đọc từ env với default an toàn. Module TS được cache → hiệu ứng như singleton, nhưng không có class Singleton mutable rối rắm.\n\n```ts\nexport const AppUrl = {\n  Default: process.env.BASE_URL ?? DEFAULT_BASE_URL,   // 1 nguồn sự thật cho URL\n} as const;\n```\n\n> **Câu nói khi phỏng vấn:** *\"Config như base URL em để một chỗ duy nhất, đọc từ biến môi trường với default. Em dùng module const thay vì class Singleton để tránh global mutable state — vẫn 'một nguồn sự thật' nhưng không gây trạng thái chia sẻ khó test.\"*\n\n### 6. Graceful degradation (bàn về Fail-fast) — `acceptCookiesIfShown()`\n\nCookie banner **có khi hiện có khi không**. Hàm này cố tình **nuốt lỗi timeout** — đây là ngoại lệ có chủ đích của \"fail fast\".\n\n```ts\ntry {\n  await acceptBtn.waitFor({ state: 'visible', timeout });\n  await acceptBtn.click();\n} catch {\n  // Banner không hiện trong timeout — bỏ qua có chủ đích, KHÔNG fail test\n}\n```\n\n> **Câu nói khi phỏng vấn:** *\"Nguyên tắc chung là fail-fast, nhưng cookie banner là thứ optional — không phải điều em đang test. Nên em xử lý mềm: có thì tắt, không có thì bỏ qua. Cái em cẩn thận là chỉ nuốt lỗi ở đúng chỗ optional này, còn assertion nghiệp vụ thì vẫn phải fail rõ ràng.\"*\n\n### 7. Cái CHƯA có — và vì sao (YAGNI) — Factory / Builder\n\nRepo **chưa** có Factory/Builder vì test hiện chủ yếu là UI navigation, chưa cần dựng test data phức tạp.\n\n> **Câu nói khi phỏng vấn:** *\"Framework này em chưa dùng Factory hay Builder vì test hiện tại chưa cần dựng data phức tạp — thêm vào lúc này là over-engineer (YAGNI). Khi nào có phần API tạo user/order với nhiều field, em sẽ thêm Builder cho request và Factory cho test data — đó là lúc chúng thật sự trả lại giá trị.\"*\n\n> [!KEY]\n> Biết **khi nào KHÔNG dùng pattern** cũng quan trọng như biết dùng. Câu trả lời này biến \"framework còn thiếu\" thành \"em thiết kế có chủ đích, thêm đúng lúc\".\n\n### Bảng tra nhanh: file ↔ pattern ↔ principle (để ôn trước phỏng vấn)\n\n| File | Pattern | Principle | 1 câu chốt |\n|---|---|---|---|\n| `home/item.list.page.ts` | Page Object | SRP, DRY | Mỗi trang 1 class, locator gói kín |\n| `base.page.ts` | Inheritance/Template | DRY, KISS | Thứ chung viết 1 lần cho mọi page |\n| `fixture.ts` | Fixture = DI | DIP, SRP | Inject page đã setup sẵn, test độc lập |\n| `locales.ts` + `getLocale()` | Strategy/Lookup | **OCP** | Thêm thị trường = thêm data, không sửa code |\n| `constant.enum.ts` | Config module | Single source | 1 nguồn config, tránh global mutable |\n| `acceptCookiesIfShown` | Graceful degrade | Fail-fast (có ngoại lệ) | Nuốt lỗi đúng chỗ optional |\n","words":3024},{"id":"ai-orchestrator","title":"AI QA Orchestrator","sub":"Multi-agent pipeline — Agent SDK","accent":"#788c5d","spec":"ai.orchestrator","file":"ai_orchestrator.md","idx":9,"content":"# AI QA Orchestrator — Multi-agent pipeline cho QA\n\n> Mục tiêu: hiểu & trình bày dự án `ai-orchestrator/` — một **multi-agent QA pipeline** biến requirement tiếng Anh thành Playwright test + báo cáo triage, xây trên **Claude Agent SDK**. Dùng cho phỏng vấn SDET/AI-in-QA.\n> Nguồn code: `ai-orchestrator/pipeline.ts`, `run.ts`, `tools.ts`, `html.ts`, `README.md`.\n> **Format: Nó là gì → Khái niệm nền → Kiến trúc → Quyết định thiết kế → So sánh → Q&A → Gotcha**.\n\n---\n\n## 1. Một câu là gì?\n\nMột **pipeline QA đa tầng, chạy tuần tự và tất định (deterministic)**, xây trên Claude Agent SDK. Mỗi tầng là một **AI agent riêng biệt** (một lời gọi `query()` có system prompt + toolset + model riêng); đầu ra tầng trước là đầu vào tầng sau. Nó tự động hoá chuỗi:\n\n> *đọc requirement → khám phá UI thật → viết manual test case → sinh code Playwright → chạy test → báo cáo triage.*\n\n**Điểm cốt lõi:** thứ tự các tầng do **code điều phối** (`runPipeline()`), KHÔNG để LLM tự quyết — vì mỗi tầng phụ thuộc chặt vào artifact của tầng trước (analysis → manual → script).\n\n---\n\n## 2. Khái niệm nền — 3 trục độc lập (hay bị nhầm)\n\nTrước khi vào kiến trúc, phải tách rõ 3 khái niệm hay bị gộp thành \"AI tự làm hết theo trigger\":\n\n| Trục | Nó trả lời câu hỏi | Của pipeline này |\n|---|---|---|\n| **Workflow / Orchestration** | *Ai quyết thứ tự các bước?* → code, tất định | ✅ Có (điều phối bằng code) |\n| **Trigger / Schedule** | *Cái gì kích hoạt nó chạy?* → tay / cron / event | Chạy tay (chưa có trigger tự động) |\n| **Human-in-the-loop** | *Có chèn người giữa các bước không?* | ✅ Có, mạnh (dừng mỗi tầng) |\n\n3 trục **rời nhau**. Thêm cron vào không \"biến nó thành workflow\" — nó **đã là** workflow rồi (vì điều phối nhiều bước bằng code); cron chỉ đổi trục \"trigger\".\n\n> [!KEY]\n> **Workflow ≠ \"không có người\".** Workflow chỉ nói về *cách điều phối tất định bằng code*. Một workflow có thể có hoặc không có human gate, có hoặc không có trigger. Pipeline này = **workflow (✅) + chạy tay + có human gate mạnh**.\n\n### \"Workflow\" là 2 nghĩa khác nhau\n\n- **workflow (khái niệm chung)** — bất kỳ quy trình nhiều bước điều phối tất định. `ai-orchestrator` là **một** trong số đó.\n- **`Workflow` (tool của Claude Code)** — công cụ Anthropic dựng sẵn với `pipeline()`/`parallel()`. Cũng là **một** hiện thực của khái niệm workflow.\n\n→ Quan hệ phân tầng: `workflow` (loại) → `pipeline` (một kiểu workflow tuần tự) → `ai-orchestrator` (dự án cụ thể của tôi). Giống \"phương tiện → xe 1 làn → chiếc xe biển số X\".\n\n---\n\n## 3. Kiến trúc — 6 tầng\n\n<style>\n.aio-diagram { --aio-bg:#141033; --aio-panel:#1d1642; --aio-panel2:#251c52; --aio-line:#3a2e6e; --aio-ink:#ECEAFB; --aio-mute:#A79FD0; --aio-faint:#7C74A8; --aio-teal:#72D6C9; --aio-lav:#A78BFA; --aio-gold:#E8C275; --aio-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; background:radial-gradient(900px 460px at 10% -8%,rgba(114,214,201,.10),transparent 60%),radial-gradient(820px 480px at 98% 0%,rgba(167,139,250,.10),transparent 55%),var(--aio-bg); border:1px solid var(--aio-line); border-radius:16px; padding:26px 24px 22px; margin:6px 0 8px; color:var(--aio-ink); font-family:'IBM Plex Sans',system-ui,sans-serif; }\n.aio-diagram * { box-sizing:border-box; }\n.aio-diagram .aio-eyebrow { font-family:var(--aio-mono); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--aio-faint); margin:0 0 16px; }\n.aio-diagram .aio-src { display:inline-flex; align-items:center; gap:9px; font-family:var(--aio-mono); font-size:13px; color:var(--aio-teal); background:rgba(114,214,201,.08); border:1px solid rgba(114,214,201,.32); border-radius:999px; padding:7px 15px; margin-bottom:4px; }\n.aio-diagram .aio-arrow { color:var(--aio-faint); text-align:center; font-size:15px; line-height:1; margin:6px 0; }\n.aio-diagram .aio-gate { display:flex; align-items:center; gap:8px; justify-content:center; margin:5px 0; }\n.aio-diagram .aio-gate span { font-family:var(--aio-mono); font-size:11px; color:var(--aio-gold); background:rgba(232,194,117,.09); border:1px dashed rgba(232,194,117,.4); border-radius:999px; padding:3px 11px; }\n.aio-diagram .aio-stage { display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:stretch; background:linear-gradient(180deg,var(--aio-panel),var(--aio-panel2)); border:1px solid var(--aio-line); border-radius:13px; padding:13px 15px; position:relative; }\n.aio-diagram .aio-stage.browser { border-color:rgba(114,214,201,.45); box-shadow:0 0 0 1px rgba(114,214,201,.12) inset; }\n.aio-diagram .aio-num { font-family:var(--aio-mono); font-weight:600; font-size:19px; color:var(--aio-bg); background:var(--aio-lav); border-radius:10px; display:flex; align-items:center; justify-content:center; }\n.aio-diagram .aio-stage.browser .aio-num { background:var(--aio-teal); }\n.aio-diagram .aio-body { min-width:0; }\n.aio-diagram .aio-title { font-family:var(--aio-mono); font-weight:600; font-size:14.5px; color:var(--aio-ink); margin:1px 0 3px; }\n.aio-diagram .aio-desc { font-size:12.5px; color:var(--aio-mute); line-height:1.5; margin:0 0 8px; }\n.aio-diagram .aio-chips { display:flex; flex-wrap:wrap; gap:6px; }\n.aio-diagram .aio-chip { font-family:var(--aio-mono); font-size:10.5px; padding:3px 9px; border-radius:6px; border:1px solid var(--aio-line); color:var(--aio-mute); background:rgba(255,255,255,.02); }\n.aio-diagram .aio-chip.out { color:var(--aio-teal); border-color:rgba(114,214,201,.3); }\n.aio-diagram .aio-chip.opus { color:var(--aio-gold); border-color:rgba(232,194,117,.4); }\n.aio-diagram .aio-chip.sonnet { color:var(--aio-lav); border-color:rgba(167,139,250,.4); }\n.aio-diagram .aio-chip.haiku { color:var(--aio-teal); border-color:rgba(114,214,201,.4); }\n.aio-diagram .aio-chip.loop { color:var(--aio-gold); border-color:rgba(232,194,117,.4); background:rgba(232,194,117,.06); }\n.aio-diagram .aio-chip.br { color:var(--aio-teal); border-color:rgba(114,214,201,.5); background:rgba(114,214,201,.08); }\n.aio-diagram .aio-legend { display:flex; flex-wrap:wrap; gap:9px 18px; margin-top:16px; padding-top:14px; border-top:1px solid var(--aio-line); font-size:11.5px; color:var(--aio-faint); font-family:var(--aio-mono); }\n.aio-diagram .aio-legend b { color:var(--aio-mute); font-weight:500; }\n</style>\n<div class=\"aio-diagram\">\n<div class=\"aio-eyebrow\">Deterministic pipeline · điều phối bằng code (runPipeline)</div>\n<div class=\"aio-src\">📄 requirements/*.md</div>\n<div class=\"aio-arrow\">▼</div>\n<div class=\"aio-stage\"><div class=\"aio-num\">1</div><div class=\"aio-body\"><div class=\"aio-title\">Analyze requirement</div><div class=\"aio-desc\">Phân tích requirement → tách acceptance criteria (AC), traceability, verification level.</div><div class=\"aio-chips\"><span class=\"aio-chip sonnet\">Sonnet</span><span class=\"aio-chip loop\">↻ review→rework ×2</span><span class=\"aio-chip out\">→ 01-analysis.md</span></div></div></div>\n<div class=\"aio-gate\"><span>⏸ human gate · sửa .md = 0 token</span></div>\n<div class=\"aio-stage browser\"><div class=\"aio-num\">2</div><div class=\"aio-body\"><div class=\"aio-title\">Explore UI &nbsp;<span style=\"color:var(--aio-teal)\">[browser]</span></div><div class=\"aio-desc\">Mở browser THẬT (Playwright MCP) dò UI live — label/role/flow thật, không đoán.</div><div class=\"aio-chips\"><span class=\"aio-chip sonnet\">Sonnet</span><span class=\"aio-chip br\">🌐 browser chỉ bật ở tầng này</span><span class=\"aio-chip out\">→ 02-ui-exploration.md</span></div></div></div>\n<div class=\"aio-gate\"><span>⏸ human gate</span></div>\n<div class=\"aio-stage\"><div class=\"aio-num\">3</div><div class=\"aio-body\"><div class=\"aio-title\">Write manual test cases</div><div class=\"aio-desc\">Viết manual test case bám UI thật + truy vết về AC.</div><div class=\"aio-chips\"><span class=\"aio-chip sonnet\">Sonnet</span><span class=\"aio-chip loop\">↻ review→rework ×2</span><span class=\"aio-chip out\">→ 03-manual-testcases.md</span></div></div></div>\n<div class=\"aio-gate\"><span>⏸ human gate</span></div>\n<div class=\"aio-stage\"><div class=\"aio-num\">4</div><div class=\"aio-body\"><div class=\"aio-title\">Write Playwright script</div><div class=\"aio-desc\">Sinh spec dùng POM + fixture sẵn có; thêm locator còn thiếu vào page object.</div><div class=\"aio-chips\"><span class=\"aio-chip opus\">Opus · việc khó nhất</span><span class=\"aio-chip out\">→ tests/e2e/ai-generated/*.spec.ts</span></div></div></div>\n<div class=\"aio-gate\"><span>⏸ human gate</span></div>\n<div class=\"aio-stage\"><div class=\"aio-num\">5</div><div class=\"aio-body\"><div class=\"aio-title\">Run tests</div><div class=\"aio-desc\">Chạy suite; tool tự ghi JSON. Fail phía test → tự chữa; fail nghi bug → để nguyên.</div><div class=\"aio-chips\"><span class=\"aio-chip haiku\">Haiku · cơ học, rẻ nhất</span><span class=\"aio-chip loop\">🔧 heal ×2 (fix+re-run)</span><span class=\"aio-chip out\">→ 05-results.json</span></div></div></div>\n<div class=\"aio-gate\"><span>⏸ human gate</span></div>\n<div class=\"aio-stage\"><div class=\"aio-num\">6</div><div class=\"aio-body\"><div class=\"aio-title\">Analyze results (triage)</div><div class=\"aio-desc\">Phân loại mỗi fail: product bug / test issue / flaky + coverage gap + next actions.</div><div class=\"aio-chips\"><span class=\"aio-chip sonnet\">Sonnet</span><span class=\"aio-chip out\">→ 06-report.md</span></div></div></div>\n<div class=\"aio-legend\"><span><b>Model:</b> Sonnet = suy luận vừa · <span style=\"color:var(--aio-gold)\">Opus = sinh code</span> · <span style=\"color:var(--aio-teal)\">Haiku = cơ học</span></span><span><b>↻ / 🔧</b> = self-heal loop</span><span><b>⏸</b> = dừng chờ người (bỏ qua với --auto)</span></div>\n</div>\n\nMỗi tầng khai báo **4 field** trong mảng `stages` (`pipeline.ts`) — muốn chỉnh tầng chỉ sửa 4 field này, không viết lại prompt:\n\n| Field | Ý nghĩa |\n|---|---|\n| `skill` | Agent là ai + method/rule phải theo (→ system prompt) |\n| `inputs` | Các file (relative repo root) agent đọc trước |\n| `output` | Đúng **1 file** tầng phải ghi |\n| `task` | Chỉ dẫn cụ thể + format output |\n\n`runStage()` tự ghép prompt từ `inputs`/`task`/`output`.\n\n### Vì sao tầng ② Explore quan trọng\n\nTầng Explore lái **browser thật** vào site live (Playwright MCP) để **dò UI thực tế** — label, role, flow, control type, default state — thay vì đoán từ chữ trong requirement. Nhờ đó manual case (③) và script (④) **bám UI thật**, không bịa. Nó được phép click/type/select/submit nhưng **cấm** login, nhập dữ liệu cá nhân, checkout/payment.\n\n---\n\n## 4. Các quyết định kiến trúc (phần interviewer đào sâu)\n\n### 4.1 Model routing — model rẻ cho việc cơ học, model mạnh cho suy luận\n\n`MODELS` trong `pipeline.ts`:\n\n| Tầng | Model | Vì sao |\n|---|---|---|\n| Analyze / Explore / Manual / Report | `claude-sonnet-4-6` | Suy luận vừa, cân bằng chi phí |\n| **Script** (viết code) | `claude-opus-4-8` | Việc khó nhất — sinh code đúng cú pháp + đúng POM |\n| **Run** (chạy test) | `claude-haiku-4-5` | Thuần cơ học, chỉ gọi 1 tool → model rẻ nhất |\n| **Review** (phản biện artifact) | `claude-sonnet-4-6` | KHÔNG dùng model yếu — critic yếu sẽ \"đóng dấu\" bừa thứ nó không hiểu |\n\n→ **Tối ưu chi phí theo độ khó từng tầng**, không \"một model cho tất cả\".\n\n### 4.2 Human-in-the-loop gate — sửa artifact tốn 0 token\n\nMặc định pipeline **dừng sau mỗi tầng** (`checkpoint()` dùng `readline`): bạn đọc, **sửa tay file `.md`**, rồi approve. Vì tầng sau **đọc lại input tươi từ đĩa**, nên sửa artifact + approve **tốn 0 token** — cách fix rẻ nhất.\n\n| Bạn chọn | Điều xảy ra | Token |\n|---|---|---|\n| Sửa file rồi `[Enter]` | Tầng sau đọc file bạn đã sửa | **0** — rẻ nhất |\n| `r` (re-run) | Chạy lại tầng từ đầu (sau khi bạn sửa `skill`/`task` trong code) | tốn token tầng đó |\n| `q` (quit) | Dừng + in lệnh resume để tiếp tục sau | 0 |\n\n> [!GOTCHA]\n> Gate dùng **terminal tương tác** (`readline`). Nếu chạy stdin không tương tác (piped, hoặc qua prefix `!` của Claude), prompt không nhận input được → phải dùng `--from/--to` (mỗi lần 1 tầng) hoặc `--auto`.\n\n### 4.3 Sandboxing — blast radius rõ ràng\n\n`tools.ts` chỉ expose **4 tool tự viết** qua `createSdkMcpServer`: `read_file`, `list_dir`, `write_file`, `run_playwright`. **Không** raw shell, **không** network. `safeResolve()` chặn path traversal ra ngoài repo và chặn vào `node_modules`/`.git`. → Agent chỉ đụng được file trong repo và chạy Playwright.\n\n> [!IMPORTANT]\n> `options.tools: []` tắt **toàn bộ** built-in tool của Claude Code (Bash, Read, Edit...). Chỉ đặt `allowedTools` là CHƯA đủ — model vẫn *thấy* built-in và đốt turn budget loay hoay với `cp`/`tee`/`base64` thay vì gọi `mcp__qa__write_file`. `tools: []` mới xoá chúng khỏi context; MCP tool đến từ `mcpServers` nên không bị ảnh hưởng.\n\n### 4.4 Per-stage permission gate — least privilege\n\n`gate`/`canUseTool`: **browser tool (Playwright MCP) chỉ bật ở tầng Explore**; mọi tầng khác gọi browser đều bị **deny**. Browser là quyền mạnh nhất (chạm site thật) nên chỉ mở đúng tầng cần → thu nhỏ blast radius.\n\n### 4.5 Markdown canonical thay vì JSON\n\nArtifact chính là **Markdown** (tự render `.html` sibling qua `html.ts` để người đọc — theme Catppuccin Mocha). Vì: (1) LLM parse Markdown **rẻ & ổn định hơn** JSON; (2) người **sửa tay giữa các tầng** dễ. `.html` là view sinh ra, ghi đè mỗi lần chạy/approve — sửa `.md` mới đổi input tầng sau. Có `npm run render` để dựng lại HTML mà **không tốn token**.\n\n### 4.6 Self-heal — 2 vòng độc lập\n\n- **Rework loop** (`--max-rework`, mặc định 2): sau tầng có `review: true`, một **reviewer agent phản biện** (adversarial, grounded vào source) chấm PASS/FAIL. Nếu FAIL → gửi findings ngược cho **chính tác giả tầng** điều tra & fix cái *thật sự* sai → review lại, tới PASS hoặc hết số vòng. Reviewer **chỉ báo, không sửa** — người vẫn là chốt cuối.\n- **Heal loop** (`--max-heal`, mặc định 2): sau tầng Run, nếu test fail → **healer agent** (model đã viết spec) phân loại rồi chỉ fix **nguyên nhân phía test** (locator/action/wait sai) trong page object & spec → chạy lại, tới xanh hoặc hết vòng.\n\n> [!WARNING]\n> Nguy cơ self-heal: agent \"chữa\" bằng cách **nới lỏng assertion** cho pass giả. Chặn bằng: (1) giới hạn số vòng; (2) HEALER_SKILL cấm weaken/xoá assertion, cấm `sleep` vô điều kiện — phải fix **nguyên nhân, không phải triệu chứng**; (3) fail nghi là **product bug** để **nguyên** cho tầng triage phân loại, không tự sửa cho xanh.\n\n### 4.7 Resilience — retry & resume\n\n- `withRetry` bọc mỗi tầng: retry lỗi **tạm thời** (Cloudflare 5xx, 429/503, 529 overloaded, socket reset) với exponential backoff + tôn trọng `retry_after`. Lỗi 4xx (bug/auth của mình) **fail fast**, không retry. Artifact chỉ ghi khi thành công → chạy lại từ đầu tầng là an toàn.\n- Chạm **turn cap** thì KHÔNG retry (sẽ đụng tường y hệt); nếu output đã ghi 1 phần thì cứu lấy và đi tiếp, nếu chưa thì báo lỗi kèm hướng dẫn.\n- `--from <n>` / `--to <n>`: bỏ qua tầng cũ, **tái dùng artifact trên đĩa** (gồm cả chỗ bạn sửa tay). Khi `q`, tool in sẵn lệnh resume để dán.\n\n---\n\n## 5. Mapping sang khái niệm Agent SDK\n\n| Khái niệm SDK | Ở đâu trong dự án |\n|---|---|\n| Orchestrator | `runPipeline()` — điều phối thứ tự tầng |\n| Agent / sub-agent | mỗi `runStage()` = 1 `query()` có system prompt riêng |\n| Tools (in-process) | `tools.ts` — 4 tool qua `createSdkMcpServer` |\n| External MCP | `PLAYWRIGHT_SERVER` — Microsoft Playwright MCP (stdio), gắn RIÊNG tầng Explore |\n| Permission control | `gate`/`canUseTool` per-stage |\n| Model routing | `MODELS` — Haiku (run) ↔ Opus (script) ↔ Sonnet (còn lại) |\n| Retry / resilience | `withRetry` bọc mỗi tầng |\n| Resume | `--from/--to`, artifact đọc lại từ đĩa |\n\n---\n\n## 6. So sánh với Workflow của Claude Code\n\nCùng triết lý (điều phối tất định bằng code, agent riêng mỗi tầng, model routing, self-heal, resume). Khác ở tầng hiện thực & vận hành:\n\n| Tiêu chí | **Workflow (Claude Code)** | **ai-orchestrator (dự án này)** |\n|---|---|---|\n| Xây trên gì | Công cụ Anthropic dựng sẵn — viết 1 script JS với `agent()`/`pipeline()`/`parallel()` | Tự xây **trực tiếp trên Agent SDK** — tự dựng MCP tool, permission gate, readline |\n| Tầng kiểm soát | Cao — trừu tượng sẵn, viết ít | Thấp — cầm tay từng thứ (nhiều quyền hơn, nhiều code hơn) |\n| Human-in-the-loop | **Không** dừng giữa run — người review *giữa các* workflow | **Có, mạnh** — dừng sau **mỗi tầng** để sửa `.md` (0 token) |\n| Truyền data giữa bước | Trong bộ nhớ — return value / object theo schema | **Ghi Markdown ra đĩa** — người sửa tay được |\n| Song song (parallel) | **Có sẵn** — `parallel()`/`pipeline()` fan-out | **Chưa** — thuần tuần tự (nằm trong roadmap) |\n| Nơi chạy | Trong session Claude Code, chạy nền | Chương trình Node/tsx **độc lập**, chạy từ terminal |\n| Tool / sandbox | Chạm mọi MCP tool của session qua ToolSearch | Bó còn **4 tool** + Playwright MCP, gate theo tầng |\n\n> [!TIP]\n> **Câu chốt phỏng vấn:** *\"Cùng triết lý — điều phối tất định, agent riêng mỗi tầng, model routing, self-heal, resume. Khác ở 3 điểm: (1) em xây trực tiếp trên Agent SDK nên kiểm soát tầng thấp hơn; (2) human-in-the-loop mạnh hơn — dừng mỗi tầng, sửa artifact 0 token, hợp bản chất QA; (3) dùng Markdown trên đĩa để người chỉnh được thay vì chuyền object trong RAM. Workflow của Claude mạnh hơn ở parallel fan-out sẵn có — đúng là hướng em muốn mở rộng.\"*\n\n---\n\n## 7. Cách chạy (CLI)\n\n```bash\ncd ai-orchestrator\nnpm install && npx playwright install chromium     # lần đầu\n\n# Auth — chọn 1:\nclaude setup-token && export CLAUDE_CODE_OAUTH_TOKEN=<token>   # dùng subscription (thường rẻ hơn)\n# hoặc: export ANTHROPIC_API_KEY=sk-ant-...                    # trả theo token\n\nnpm run orchestrate                                 # dùng requirement mẫu\n```\n\n| Arg / flag | Tác dụng |\n|---|---|\n| `<requirementPath>` | Positional 1 — requirement cần test |\n| `[specPath]` | Positional 2 — nơi ghi spec (default `tests/e2e/ai-generated/<name>.spec.ts`) |\n| `--from <n>` | Bắt đầu từ tầng *n* (resume, tái dùng artifact) |\n| `--to <n>` | Dừng sau tầng *n* |\n| `--auto`, `-y` | Chạy thẳng, **không** review gate |\n| `--headed` | Explore mở browser **thấy được** |\n| `--max-rework <n>` | Cap self-heal review (default 2) |\n| `--max-heal <n>` | Cap heal test script (default 2; 0 = tắt) |\n\n> [!GOTCHA]\n> Khi truyền `--from/--to`, chạy `npx tsx run.ts …` chứ **đừng** `npm run orchestrate -- …` — `npm` nuốt mất flag `--from/--to` trước khi tới script. Path luôn tính từ **repo root** (vì tool sandbox vào `REPO_ROOT`), nên truyền `ai-orchestrator/requirements/...` dù shell đang ở trong `ai-orchestrator/`.\n\n---\n\n## 8. Q&A phỏng vấn\n\n### Vì sao điều phối bằng code mà không để 1 agent tự quyết gọi tầng nào?\n\nVì mỗi tầng phụ thuộc chặt output tầng trước (analysis → manual → script). Điều phối bằng code cho **tất định, dễ debug, dễ resume**; để LLM tự quyết sẽ khó tái lập và dễ nhảy sai thứ tự.\n\n### Human-in-the-loop chống được gì?\n\nLLM có xu hướng viết test *cho pass*. Gate cho phép người kiểm chứng artifact ở từng bước, sửa lỗi **sớm (rẻ)** trước khi lỗi lan xuống tầng tốn token hơn. Sửa Markdown + approve = 0 token.\n\n### Vì sao chỉ tầng Explore được dùng browser?\n\n**Least privilege.** Browser là quyền mạnh nhất (chạm site thật); các tầng khác chỉ cần đọc/ghi file nên bị chặn browser để thu nhỏ blast radius.\n\n### Self-heal có nguy cơ gì? Vì sao giới hạn số vòng?\n\nNguy cơ agent \"chữa\" bằng cách nới lỏng assertion để pass giả. Vì vậy: (1) giới hạn số vòng (`--max-heal`/`--max-rework`); (2) skill cấm weaken assertion; (3) fail nghi product bug **để nguyên** cho tầng triage phân loại — không tự sửa cho xanh.\n\n### Vì sao reviewer dùng model mạnh (Sonnet) chứ không phải Haiku rẻ?\n\nReviewer làm **phản biện ngữ nghĩa** artifact của một AI khác — không phải check cơ học. Model yếu sẽ \"đóng dấu\" thứ nó không đủ sức hiểu (rubber-stamp), làm vòng review vô nghĩa.\n\n### Vì sao Markdown làm canonical mà không phải JSON?\n\nLLM parse Markdown rẻ & ổn định hơn, và người **sửa tay giữa các tầng** dễ hơn nhiều so với JSON. Đây là trade-off có chủ đích: ưu tiên khả năng chỉnh sửa + chi phí, đổi lại chưa có schema validate chặt (đó là hướng harden tiếp).\n\n### Điểm yếu / hướng harden tiếp?\n\n1. **Adversarial verifier** riêng: một agent kiểm \"test này có thật sự cover đúng AC không\".\n2. **Structured JSON output** có validate để máy hand-off (thay vì chỉ Markdown).\n3. **Parallel fan-out**: chia manual case thành batch, viết spec song song (chính là thứ Workflow của Claude có sẵn).\n\n---\n\n## 9. Pitch 90 giây (học thuộc ý)\n\n> \"Em xây một **AI QA orchestrator** trên Claude Agent SDK. Nó nhận requirement tiếng Anh và chạy qua **6 tầng tuần tự**: phân tích → **khám phá UI thật bằng browser** qua Playwright MCP → viết manual test case → **sinh code Playwright dùng đúng Page Object và fixture của dự án** → chạy test → báo cáo triage.\n>\n> Điểm em tâm đắc là các **quyết định kiến trúc**: thứ tự tầng do code điều phối chứ không để LLM tự quyết, vì mỗi tầng phụ thuộc artifact tầng trước. Em **route model theo độ khó** — Haiku cho tầng chạy test, Opus cho tầng sinh code — để tối ưu chi phí. Có **human-in-the-loop gate**: sửa tay artifact Markdown giữa các tầng với chi phí 0 token. Toolset bị **sandbox** còn 4 tool, browser chỉ bật đúng tầng Explore (least privilege). Và có **2 vòng self-heal**: một vòng review→fix cho artifact, một vòng fix→chạy-lại cho test script — đều có chốt chặn để không làm pass giả.\n>\n> Nó chứng minh em không chỉ viết test, mà hiểu cách **dựng một hệ thống agent tất định, an toàn, tối ưu chi phí** — đúng hướng các framework orchestration lớn đang đi.\"\n","words":3173},{"id":"testing-craft","title":"Testing Craft","sub":"BDD, test doubles, contract testing","accent":"#d97757","spec":"testing.craft","file":"testing_craft.md","idx":10,"content":"# Testing Craft — BDD, Test Doubles, Contract Testing, Code Quality\n\n> Bù đúng feedback: **BDD, stubbing, contract testing, tích hợp code quality tool**.\n> Format: **Nó là gì → Thành phần → Ví dụ → Q&A → Gotcha**.\n\n---\n\n## A. BDD — Behavior-Driven Development\n\n### Nó là gì\n\nBDD là cách viết test mô tả **hành vi nghiệp vụ** bằng ngôn ngữ tự nhiên (business-readable), để **dev + QA + PO** cùng đọc hiểu. Mở rộng từ TDD nhưng tập trung vào \"behavior\" thay vì \"unit\". Ngôn ngữ phổ biến: **Gherkin** (Given/When/Then).\n\n### Thành phần\n\n| Thành phần | Vai trò |\n|---|---|\n| **Feature file** (`.feature`) | Mô tả nghiệp vụ bằng Gherkin — business đọc được |\n| **Scenario** | 1 tình huống cụ thể |\n| **Given** | Bối cảnh / tiền điều kiện (setup) |\n| **When** | Hành động kích hoạt |\n| **Then** | Kết quả mong đợi (assertion) |\n| **And / But** | Nối thêm bước |\n| **Step definition** | Code thực thi từng bước Gherkin (glue code) |\n| **Scenario Outline + Examples** | Data-driven: 1 scenario chạy nhiều bộ data |\n| **Background** | Bước chung chạy trước mọi scenario |\n| **Tags** (`@smoke`) | Lọc/nhóm scenario khi chạy |\n\n#
