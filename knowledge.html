## Ví dụ\n\n```gherkin\n# login.feature\nFeature: User login\n\n  Background:\n    Given the user is on the login page\n\n  @smoke\n  Scenario: Successful login\n    When the user logs in with \"admin\" and \"correct-pw\"\n    Then the dashboard should be visible\n\n  Scenario Outline: Invalid login shows error\n    When the user logs in with \"<user>\" and \"<pass>\"\n    Then an error \"<message>\" should appear\n\n    Examples:\n      | user  | pass    | message              |\n      | admin | wrong   | Invalid credentials  |\n      |       | pw      | Username required    |\n```\n\n```ts\n// steps/login.steps.ts (Cucumber.js + Playwright)\nimport { Given, When, Then } from '@cucumber/cucumber';\n\nGiven('the user is on the login page', async function () {\n  await this.page.goto('/login');\n});\nWhen('the user logs in with {string} and {string}', async function (user, pass) {\n  await this.loginPage.login(user, pass);\n});\nThen('the dashboard should be visible', async function () {\n  await expect(this.page.locator('#dashboard')).toBeVisible();\n});\n```\n\n### Q&A\n\n**Q: BDD vs TDD?** TDD: viết test trước code, góc nhìn developer (unit). BDD: viết behavior trước, ngôn ngữ chung cho cả non-tech, tập trung \"hệ thống cư xử thế nào\". BDD thường nằm ở tầng acceptance/E2E.\n\n**Q: Khi nào KHÔNG nên dùng BDD?** Khi business **không thực sự đọc** feature file → Gherkin chỉ là lớp overhead (thêm step definition, khó debug). Nếu chỉ team kỹ thuật đọc, viết test code trực tiếp gọn hơn.\n\n**Q: 3 amigos là gì?** Buổi họp PO + Dev + QA cùng định nghĩa acceptance criteria/scenario trước khi code → đó là tinh thần thật của BDD (collaboration), không chỉ là cú pháp Gherkin.\n\n> [!GOTCHA]\n> BDD ≠ Cucumber. BDD là **phương pháp** (collaboration + ví dụ cụ thể); Cucumber/Gherkin chỉ là **công cụ**. Có thể làm BDD mà không cần Gherkin.\n\n> [!GOTCHA]\n> Playwright KHÔNG tích hợp Cucumber native → phải tự ghép `@cucumber/cucumber` + custom World (giữ `page`, `context`). Cân nhắc chi phí maintain.\n\n---\n\n## B. Test Doubles — Stub, Mock, Spy, Fake, Dummy\n\n### Nó là gì\n\n**Test double** = object \"đóng thế\" cho dependency thật khi test, để **cô lập** unit đang test (không gọi DB/network thật, kiểm soát được kết quả). \"Mock\" hay bị dùng chung chung, nhưng đúng kỹ thuật có 5 loại (Gerard Meszaros / Martin Fowler).\n\n### Thành phần / 5 loại\n\n| Loại | Mục đích | Kiểm tra điều gì |\n|---|---|---|\n| **Dummy** | Chỉ để lấp tham số, không dùng | — |\n| **Stub** | Trả về **giá trị cố định** đã định trước | State (kết quả) |\n| **Spy** | Stub + **ghi lại** cách nó được gọi | Đã gọi mấy lần / với arg gì |\n| **Mock** | Object có **expectation** định trước, fail nếu gọi sai | Behavior (interaction) |\n| **Fake** | Implement thật nhưng đơn giản (in-memory DB) | State, dùng được như thật |\n\n**Quy tắc phân biệt nhanh:**\n- **Stub** = \"khi gọi `getUser()`, **trả về** `{id:1}`\" → quan tâm **OUTPUT**.\n- **Mock** = \"tôi **mong** `sendEmail()` được gọi **đúng 1 lần** với arg X\" → quan tâm **INTERACTION**.\n- **Spy** = wrap hàm thật/giả để **đếm/ghi** lời gọi, rồi assert sau.\n\n### Ví dụ\n\n```ts\n// === STUB: ép giá trị trả về (Playwright route = network stub) ===\nawait page.route('**/api/products', (route) =>\n  route.fulfill({ status: 200, body: JSON.stringify([{ id: 1, name: 'Stubbed' }]) }),\n);\n// Test FE render đúng với data cố định, không phụ thuộc backend\n\n// Stub lỗi để test error handling\nawait page.route('**/api/checkout', (route) => route.fulfill({ status: 500 }));\n\n// === MOCK (Jest/Vitest): kiểm tra interaction ===\nconst sendEmail = vi.fn();\nnotifyUser(user, sendEmail);\nexpect(sendEmail).toHaveBeenCalledTimes(1);\nexpect(sendEmail).toHaveBeenCalledWith('h@x.com', 'Welcome');\n\n// === SPY: theo dõi hàm thật vẫn chạy ===\nconst spy = vi.spyOn(logger, 'info');\ndoWork();\nexpect(spy).toHaveBeenCalledWith('done');\nspy.mockRestore();\n\n// === FAKE: in-memory implementation ===\nclass FakeUserRepo implements UserRepo {\n  private store = new Map<number, User>();\n  async save(u: User) { this.store.set(u.id, u); }\n  async find(id: number) { return this.store.get(id) ?? null; }\n}\n```\n\n### Q&A\n\n**Q: Stub vs Mock khác gì?** Stub cung cấp **dữ liệu** (quan tâm output/state). Mock đặt **kỳ vọng về cách gọi** và verify interaction (quan tâm behavior). Nói gọn: stub answer queries, mock verify commands.\n\n**Q: Khi nào mock/stub trong test?** Khi dependency: chậm (network/DB), non-deterministic (time, random), khó tạo (3rd-party, payment), hoặc chưa sẵn sàng (service đang dev). Mục đích: cô lập + ổn định + nhanh.\n\n**Q: Rủi ro của mock?** **Mock drift** — mock không còn khớp service thật → test xanh nhưng prod fail. Giảm bằng contract test + một ít integration/E2E test thật.\n\n**Q: Trong Playwright stub network thế nào?** `page.route(pattern, handler)` để intercept → `route.fulfill()` (trả response giả), `route.abort()` (giả lỗi mạng), `route.continue()` (cho qua, có thể sửa request).\n\n> [!GOTCHA]\n> Mock 500 là test **FE xử lý lỗi**, KHÔNG phải test server. Đừng nhầm mục đích.\n\n> [!GOTCHA]\n> Over-mocking = test chỉ kiểm tra mock, không kiểm tra hành vi thật → \"test mình mock\". Mock biên giới (network, DB), không mock logic đang test.\n\n---\n\n## C. Contract Testing\n\n### Nó là gì\n\nContract testing verify rằng **giao kèo (request/response shape)** giữa **consumer** (vd FE / service gọi) và **provider** (vd BE / service bị gọi) khớp nhau — mà không cần dựng cả 2 service cùng lúc. Giải bài toán microservices: integration test thật thì chậm/giòn, mock thì dễ drift.\n\n### Thành phần (Consumer-Driven Contract — Pact)\n\n| Thành phần | Vai trò |\n|---|---|\n| **Consumer** | Bên gọi API; định nghĩa kỳ vọng (mong response thế nào) |\n| **Provider** | Bên cung cấp API; phải thoả contract |\n| **Contract / Pact file** | File JSON ghi lại request mẫu + response mong đợi |\n| **Pact Broker** | Server lưu & chia sẻ pact giữa các team, version, tag |\n| **Consumer test** | Chạy với mock provider → sinh pact file |\n| **Provider verification** | Provider replay pact lên service thật → fail nếu break |\n\n### Luồng\n\n```\n1. Consumer test: gọi mock theo kỳ vọng  → sinh pact file (consumer-provider.json)\n2. Publish pact lên Pact Broker\n3. Provider CI: tải pact → replay request lên service thật → verify response khớp\n4. Nếu provider đổi response phá contract → provider build FAIL (bắt được sớm)\n5. can-i-deploy: hỏi broker \"version này deploy an toàn chưa?\"\n```\n\n### Ví dụ (Pact JS — consumer side)\n\n```ts\nconst provider = new PactV3({ consumer: 'WebApp', provider: 'UserService' });\n\nprovider\n  .given('user 1 exists')\n  .uponReceiving('a request for user 1')\n  .withRequest({ method: 'GET', path: '/users/1' })\n  .willRespondWith({\n    status: 200,\n    body: { id: like(1), name: like('Hai') },   // matcher: khớp KIỂU, không khớp giá trị cứng\n  });\n\nawait provider.executeTest(async (mockServer) => {\n  const res = await getUser(mockServer.url, 1);\n  expect(res.name).toBeDefined();\n});\n// → sinh pact file để provider verify\n```\n\n### Q&A\n\n**Q: Contract test vs integration test?** Integration test dựng nhiều service thật → chậm, giòn, khó cô lập lỗi. Contract test verify giao kèo độc lập từng phía → nhanh, chạy được khi service kia chưa sẵn sàng, bắt được breaking change sớm. Không thay thế hoàn toàn E2E.\n\n**Q: Consumer-driven nghĩa là gì?** Consumer định nghĩa nó **cần gì** từ provider (chỉ phần dùng tới), provider phải đáp ứng tối thiểu đó. → Provider biết đổi gì sẽ phá ai.\n\n**Q: Vì sao dùng matcher (`like`, `eachLike`) thay giá trị cứng?** Để contract kiểm tra **schema/kiểu** thay vì giá trị exact (giá trị thật đổi liên tục). Tránh test giòn.\n\n**Q: Contract test giải quyết mock drift thế nào?** Mock được \"chứng thực\" bởi provider verification — nếu provider đổi response, verification fail → mock (pact) không còn lệch âm thầm.\n\n> [!GOTCHA]\n> Contract test KHÔNG kiểm tra business logic đúng/sai — chỉ kiểm tra **shape giao kèo**. Vẫn cần functional test riêng.\n\n> [!TIP]\n> Tool: **Pact** (consumer-driven, đa ngôn ngữ), **Spring Cloud Contract** (Java). Pact Broker + `can-i-deploy` là phần \"xịn\" để gate deploy.\n\n---\n\n## D. Code Quality Tools — tích hợp pipeline\n\n### Nó là gì\n\nBộ công cụ tự động **chặn code kém chất lượng** trước khi vào main: format nhất quán, bắt lỗi tĩnh, đo coverage, chạy ở pre-commit hook + CI. Đây là dấu hiệu codebase \"trưởng thành\" interviewer hay đào.\n\n### Thành phần (hệ JS/TS)\n\n| Tool | Vai trò | Chạy ở đâu |\n|---|---|---|\n| **ESLint** | Static analysis — bắt bug & code smell (vd `no-floating-promises`) | pre-commit + CI |\n| **Prettier** | Auto-format (style nhất quán) — KHÔNG bắt bug | pre-commit |\n| **TypeScript (`tsc --noEmit`)** | Type check | CI |\n| **Husky** | Quản lý Git hooks (chạy lint/test trước commit/push) | local Git hook |\n| **lint-staged** | Chỉ lint/format file **đã staged** (nhanh) | pre-commit |\n| **commitlint** | Ép format commit message (Conventional Commits) | commit-msg hook |\n| **Jest/Vitest coverage** | Đo % code được test | CI, có thể set threshold |\n| **SonarQube / CodeClimate** | Đo code smell, duplication, coverage, security trên dashboard | CI |\n| **Dependabot / npm audit** | Quét lỗ hổng dependency | CI / scheduled |\n\n### Ví dụ — pre-commit gate\n\n```jsonc\n// package.json\n{\n  \"scripts\": { \"lint\": \"eslint . --max-warnings 0\", \"format\": \"prettier --write .\" },\n  \"lint-staged\": {\n    \"*.{ts,tsx}\": [\"eslint --fix\", \"prettier --write\"]\n  }\n}\n```\n\n```bash\n# .husky/pre-commit — chặn commit nếu lint fail\nnpx lint-staged\n\n# .husky/pre-push — chạy test trước khi push\nnpx playwright test --project=chromium\n```\n\n```yaml\n# CI gate (GitHub Actions) — fail PR nếu vi phạm\n- run: npm run lint\n- run: npx tsc --noEmit\n- run: npx playwright test\n- run: npx playwright test --reporter=html   # artifact\n```\n\n### Q&A\n\n**Q: ESLint vs Prettier khác gì?** ESLint = **chất lượng/logic** (bắt bug, anti-pattern, có thể auto-fix vài rule). Prettier = **format** (dấu cách, xuống dòng) — không quan tâm logic. Dùng chung: Prettier lo style, ESLint lo lỗi; tránh rule format trùng nhau (`eslint-config-prettier` tắt rule xung đột).\n\n**Q: Husky để làm gì?** Cài/quản lý Git hooks dễ dàng (lưu trong repo, share cả team). Thường: `pre-commit` → lint-staged; `commit-msg` → commitlint; `pre-push` → test nhanh.\n\n**Q: Vì sao dùng lint-staged thay vì lint cả repo mỗi commit?** Lint cả repo chậm. lint-staged chỉ xử lý file đang commit → feedback nhanh, dev không bỏ qua hook.\n\n**Q: Quality gate trong CI là gì?** Điều kiện bắt buộc PASS mới được merge: lint sạch, type check pass, test pass, coverage ≥ ngưỡng (vd SonarQube quality gate). Fail thì block merge.\n\n**Q: Coverage 80% có nghĩa code tốt?** Không hẳn. Coverage đo **dòng được chạy**, không đo **assertion có ý nghĩa**. 100% coverage vẫn có thể không test đúng hành vi. Dùng coverage để tìm **vùng chưa test**, không phải mục tiêu tự thân.\n\n> [!GOTCHA]\n> Hook local (Husky) có thể bị bypass bằng `git commit --no-verify`. → Quality gate THẬT phải đặt ở **CI** (server-side), không chỉ tin vào local hook.\n\n> [!TIP]\n> Câu trả lời mạnh: \"Tôi đặt lint/format/type-check ở **cả** pre-commit (feedback nhanh) **và** CI (gate cứng), coverage threshold trong CI, commit theo Conventional Commits để auto-changelog/semver.\"\n","words":2058},{"id":"git-advanced","title":"Git Advanced","sub":"Branching, rebase, rescue commands","accent":"#6a9bcc","spec":"git.advanced","file":"git_advanced.md","idx":11,"content":"# Git — Command-line & Advanced Branching/Merge\n\n> Bù feedback: **thành thạo Git CLI + chiến lược branch/merge nâng cao**.\n> Format: **Nó là gì → Lệnh/Thành phần → Ví dụ → Q&A → Gotcha**.\n\n---\n\n## A. Mental model — Git hoạt động thế nào\n\n### Nó là gì\n\nGit là **distributed version control**: mỗi clone là 1 repo đầy đủ (có toàn bộ history). Git không lưu \"diff\" mà lưu **snapshot** của cây file qua các **commit**; mỗi commit trỏ tới commit cha → tạo thành **DAG** (đồ thị có hướng). Branch chỉ là **con trỏ** (pointer) tới 1 commit. `HEAD` trỏ tới branch/commit hiện tại.\n\n### 3 khu vực (cực quan trọng)\n\n| Khu vực | Là gì | Lệnh đưa vào |\n|---|---|---|\n| **Working directory** | File bạn đang sửa | (edit) |\n| **Staging area (index)** | Khu chuẩn bị cho commit kế | `git add` |\n| **Repository (.git)** | History đã commit | `git commit` |\n\n```\nworking dir  --git add-->  staging  --git commit-->  local repo  --git push-->  remote\n     ^------------- git checkout/restore ------|\n```\n\n---\n\n## B. Lệnh CLI hàng ngày\n\n```bash\n# --- Trạng thái & xem ---\ngit status                      # file nào modified/staged/untracked\ngit status -sb                  # gọn (short + branch)\ngit diff                        # thay đổi CHƯA staged\ngit diff --staged               # thay đổi ĐÃ staged (sắp commit)\ngit log --oneline --graph --all # history dạng đồ thị\ngit log --oneline -5            # 5 commit gần nhất\ngit show <commit>               # chi tiết 1 commit\ngit blame <file>                # ai sửa dòng nào\n\n# --- Staging & commit ---\ngit add <file>                  # stage 1 file\ngit add -p                      # stage TỪNG HUNK (chọn lọc thay đổi) ⭐\ngit commit -m \"feat: add login\"\ngit commit --amend              # sửa commit gần nhất (message/nội dung)\ngit restore --staged <file>     # bỏ stage (giữ thay đổi)\ngit restore <file>              # vứt thay đổi working dir (NGUY HIỂM)\n\n# --- Branch ---\ngit branch                      # list local\ngit branch -a                   # list cả remote\ngit switch <branch>             # đổi branch (mới, rõ nghĩa hơn checkout)\ngit switch -c feature/login     # tạo + chuyển\ngit branch -d <branch>          # xoá (an toàn, đã merge)\ngit branch -D <branch>          # xoá ép (chưa merge)\ngit branch -m old new           # đổi tên\n\n# --- Remote ---\ngit fetch                       # tải về, KHÔNG merge\ngit pull                        # = fetch + merge (hoặc rebase nếu config)\ngit pull --rebase               # fetch + rebase (history phẳng)\ngit push -u origin feature/x    # push lần đầu, set upstream\ngit push --force-with-lease     # force AN TOÀN (không đè người khác) ⭐\ngit remote -v                   # xem remote\n```\n\n> [!TIP]\n> `git add -p` và `git push --force-with-lease` là 2 lệnh phân biệt người \"biết Git\" với người \"thuộc lệnh\". Nhắc tới chúng trong interview ghi điểm.\n\n---\n\n## C. Merge vs Rebase — câu hỏi kinh điển\n\n### Nó là gì\n\nCả hai gộp thay đổi từ branch này sang branch khác, nhưng khác về **history**:\n\n| | `git merge` | `git rebase` |\n|---|---|---|\n| Cách làm | Tạo **merge commit** nối 2 nhánh | **Replay** commit của bạn lên trên đỉnh nhánh đích |\n| History | Giữ nguyên, có nhánh rẽ (non-linear) | **Phẳng** (linear), như thể làm tuần tự |\n| Commit hash | Giữ nguyên | **Thay đổi** (commit được tạo lại) |\n| An toàn trên shared branch? | ✅ | ❌ (đừng rebase branch người khác đang dùng) |\n| Khi nào | Tích hợp feature vào main, giữ context | Dọn history local trước khi push/PR |\n\n```bash\n# MERGE — tạo merge commit\ngit switch main\ngit merge feature/login          # tạo commit gộp\ngit merge --no-ff feature/login  # luôn tạo merge commit (giữ dấu vết feature)\ngit merge --squash feature/login # gộp mọi commit thành 1, tự commit\n\n# REBASE — replay commit lên main mới nhất\ngit switch feature/login\ngit rebase main                  # đưa feature lên đỉnh main hiện tại\n# (xử lý conflict nếu có) → git add ... → git rebase --continue\ngit rebase --abort               # huỷ, quay lại trạng thái trước\n\n# INTERACTIVE REBASE — dọn history (squash/reorder/sửa message)\ngit rebase -i HEAD~3             # chỉnh 3 commit gần nhất\n# pick / squash / fixup / reword / drop / edit\n```\n\n### Quy tắc vàng\n\n> [!IMPORTANT]\n> **Golden rule of rebase:** KHÔNG rebase commit đã push lên branch chung (người khác dùng). Rebase đổi hash → người khác bị \"history phân kỳ\", phải force push gây loạn. Rebase chỉ trên commit **local/chưa share**.\n\n### Q&A\n\n**Q: Merge hay rebase, chọn khi nào?** Rebase **feature branch local** lên main mới nhất để history phẳng + giải quyết conflict sớm, TRƯỚC khi mở PR. Merge khi đưa feature vào main (đặc biệt `--no-ff` để giữ dấu vết). Nguyên tắc: \"rebase riêng tư, merge công khai\".\n\n**Q: `git pull` mặc định làm gì? Vì sao nhiều team set `pull --rebase`?** `pull` = `fetch` + `merge` → sinh merge commit \"Merge branch...\" rác. `pull --rebase` replay commit local lên trên → history sạch, không merge commit thừa.\n\n**Q: Squash merge là gì, lợi/hại?** Gộp tất cả commit của feature thành **1 commit** trên main → history main gọn, mỗi PR = 1 commit. Hại: mất commit chi tiết của feature (chấp nhận được vì PR đã review).\n\n**Q: Fast-forward merge là gì?** Khi main không có commit mới kể từ lúc tách nhánh, Git chỉ \"dời con trỏ\" main tới đỉnh feature → không tạo merge commit. `--no-ff` ép tạo merge commit dù có thể fast-forward.\n\n---\n\n## D. Branching strategies\n\n### Nó là gì\n\nQuy ước tổ chức branch để team phối hợp + release ổn định. Chọn theo nhịp release và quy mô team.\n\n| Strategy | Branch chính | Hợp với |\n|---|---|---|\n| **GitHub Flow** | `main` + feature branch ngắn, deploy liên tục | CI/CD, team nhỏ-vừa, SaaS |\n| **Git Flow** | `main` + `develop` + `feature/*` + `release/*` + `hotfix/*` | Release theo phiên bản, app cài đặt |\n| **Trunk-Based** | 1 `trunk`/`main`, commit nhỏ + feature flag | Team lớn, CI mạnh, deploy nhiều lần/ngày |\n| **Release branching** | `release/x.y` tách ra để stabilize | Sản phẩm cần hỗ trợ nhiều version |\n\n```bash\n# GitHub Flow (phổ biến nhất hiện nay)\ngit switch -c feature/JIRA-123-add-cart main\n# ...code, commit...\ngit push -u origin feature/JIRA-123-add-cart\n# mở PR → CI chạy → review → squash merge vào main → deploy\n\n# Git Flow hotfix\ngit switch -c hotfix/1.2.1 main\n# fix → merge vào CẢ main VÀ develop\n```\n\n### Q&A\n\n**Q: GitHub Flow vs Git Flow?** GitHub Flow đơn giản: chỉ `main` + feature branch, merge là deploy được — hợp CI/CD liên tục. Git Flow phức tạp hơn với `develop`/`release`/`hotfix` — hợp release theo version (mobile, desktop). Xu hướng hiện đại nghiêng GitHub Flow/Trunk-based.\n\n**Q: Feature flag liên quan branching thế nào?** Trunk-based merge code chưa hoàn thiện vào main nhưng **tắt bằng flag** → tránh long-lived branch (giảm merge hell), bật tính năng khi sẵn sàng.\n\n**Q: Tại sao branch nên ngắn (short-lived)?** Branch sống lâu → diverge xa main → merge conflict lớn + tích hợp muộn (phát hiện lỗi trễ). Branch ngắn = tích hợp liên tục, conflict nhỏ.\n\n---\n\n## E. Conflict, undo, và lệnh cứu nguy\n\n```bash\n# --- Resolve conflict ---\ngit merge feature        # báo CONFLICT\n# sửa file (giữ <<<<<<< ======= >>>>>>> markers) → chọn nội dung đúng\ngit add <file>           # đánh dấu đã resolve\ngit merge --continue     # (hoặc git commit)\ngit merge --abort        # huỷ, quay lại trước merge\n\n# --- Undo an toàn ---\ngit revert <commit>      # tạo commit ĐẢO NGƯỢC (an toàn cho shared history) ⭐\ngit reset --soft HEAD~1  # bỏ commit, GIỮ thay đổi ở staging\ngit reset --mixed HEAD~1 # bỏ commit, giữ thay đổi ở working dir (default)\ngit reset --hard HEAD~1  # bỏ commit + XOÁ thay đổi (NGUY HIỂM)\n\n# --- Tạm cất ---\ngit stash                # cất thay đổi đang dở\ngit stash pop            # lấy lại (và xoá khỏi stash)\ngit stash list\n\n# --- Cherry-pick: lấy 1 commit cụ thể từ branch khác ---\ngit cherry-pick <commit> # áp commit đó lên branch hiện tại\n\n# --- Cứu nguy: reflog (lịch sử mọi nơi HEAD từng tới) ---\ngit reflog               # tìm commit \"đã mất\" sau reset/rebase hỏng\ngit reset --hard <hash từ reflog>   # khôi phục\n\n# --- Bisect: tìm commit gây bug bằng binary search ---\ngit bisect start\ngit bisect bad           # commit hiện tại lỗi\ngit bisect good <hash>   # commit cũ tốt\n# Git checkout giữa → test → git bisect good/bad → lặp đến khi tìm ra\ngit bisect reset\n```\n\n### Q&A\n\n**Q: `revert` vs `reset` khác gì?** `revert` tạo **commit mới đảo ngược** → an toàn cho history đã push (không viết lại lịch sử). `reset` **di chuyển con trỏ về sau** (viết lại history) → chỉ dùng trên commit local chưa share.\n\n**Q: `reset --soft / --mixed / --hard`?** `soft`: bỏ commit, giữ thay đổi ở **staging**. `mixed` (default): giữ ở **working dir** (unstaged). `hard`: **xoá luôn** thay đổi (mất data nếu chưa commit).\n\n**Q: Lỡ `reset --hard` mất commit, cứu thế nào?** `git reflog` để tìm hash cũ → `git reset --hard <hash>` hoặc `git cherry-pick`. Reflog giữ lịch sử HEAD ~90 ngày → hầu như luôn cứu được.\n\n**Q: `git bisect` dùng khi nào?** Tìm commit gây regression khi không biết nó ở đâu — binary search qua history (log₂N bước thay vì N). Cực mạnh khi bug \"tự nhiên xuất hiện\".\n\n**Q: Cherry-pick dùng khi nào?** Lấy 1 commit cụ thể (vd hotfix) áp sang branch khác mà không merge cả nhánh. Cẩn thận tạo commit trùng nội dung khác hash.\n\n> [!GOTCHA]\n> `git reset --hard` và `git checkout -- <file>`/`git restore` **xoá vĩnh viễn** thay đổi chưa commit. Không có reflog cho working dir. Cân nhắc `git stash` trước.\n\n> [!GOTCHA]\n> `git push --force` đè lên remote, có thể xoá commit người khác. Luôn dùng `--force-with-lease` (chỉ force nếu remote chưa thay đổi so với bản bạn biết).\n\n> [!KEY]\n> Bộ \"cứu nguy\" đáng nhớ: `reflog` (tìm lại commit mất), `revert` (undo an toàn đã push), `bisect` (truy commit gây bug), `stash` (cất tạm), `cherry-pick` (lấy lẻ commit).\n","words":1741},{"id":"kafka","title":"Kafka Knowledge","sub":"Event streaming cho QA — delivery semantics","accent":"#788c5d","spec":"kafka.streaming","file":"kafka_knowledge.md","idx":12,"content":"# Kafka cho Senior QA Automation\n\n> [!NOTE]\n> File này là **bản đồ kiến thức (overview)** — liệt kê các item cần biết, mối liên kết, điểm mạnh/yếu, và đặc biệt là **góc nhìn QA automation**: cái gì cần test, test thế nào, bug hay gặp ở đâu. Từ map này bạn đào sâu từng nhánh.\n\n---\n\n## 0. Vì sao QA cần hiểu Kafka\n\nKhi dự án dùng Kafka, **logic nghiệp vụ không còn nằm trong 1 request-response HTTP** mà chảy qua nhiều service nối với nhau bằng message bất đồng bộ (async). Hậu quả với QA:\n\n- Không thể test bằng cách \"gọi API → assert response\" thuần túy nữa. Action và effect **tách rời theo thời gian**.\n- Phải biết verify **side-effect** (message được produce ra topic, được consume đúng, DB cập nhật sau cùng).\n- Bug đặc thù event-driven: mất message, trùng message (duplicate), sai thứ tự (ordering), consumer lag, message \"kẹt\" (poison pill / DLQ).\n- Test trở nên **eventually consistent** → phải dùng polling/await thay vì assert tức thì.\n\n> [!IMPORTANT]\n> Tư duy cốt lõi: Kafka biến hệ thống thành **asynchronous + distributed**. Mọi khó khăn khi test đều quy về 2 chữ này. Nắm chắc *delivery semantics* và *ordering guarantees* là quan trọng nhất cho QA.\n\n---\n\n## 1. Khái niệm nền tảng (Core Concepts)\n\n### 1.1 Kafka là gì\nMột **distributed event streaming platform** — về bản chất là một **commit log** phân tán, bền vững (durable), có thể replay. Không phải message queue truyền thống: message **không bị xóa sau khi đọc**, nó nằm lại trong log theo retention policy.\n\n| Đặc điểm | Message Queue cũ (RabbitMQ, ActiveMQ) | Kafka |\n|---|---|---|\n| Sau khi consume | Message bị xóa | Message **giữ lại** (replay được) |\n| Mô hình | Push tới consumer | Consumer **pull** |\n| Vị trí đọc | Broker quản lý | **Consumer tự quản** bằng offset |\n| Thông lượng | Vừa | **Rất cao** (triệu msg/s) |\n\n### 1.2 Các thành phần (đi kèm nhau, học theo cụm)\n\n- **Broker** — 1 server Kafka. Nhiều broker = **Cluster**. Liên kết → *replication*, *partition leadership*.\n- **Topic** — kênh logic chứa message (vd `orders`, `payments`). Liên kết → *partition*.\n- **Partition** — topic chia thành nhiều partition để scale & song song. **Đơn vị của parallelism và ordering**. Liên kết → *offset*, *consumer group*, *ordering*.\n- **Offset** — số thứ tự tăng dần của message *trong 1 partition*. Liên kết → *consumer*, *commit*, *replay*.\n- **Producer** — bên ghi message. Liên kết → *partitioner*, *acks*, *idempotence*.\n- **Consumer** — bên đọc message. Liên kết → *consumer group*, *offset commit*, *rebalance*.\n- **Consumer Group** — nhóm consumer cùng `group.id` chia nhau partition. Liên kết → *rebalance*, *parallelism*, *lag*.\n- **Replication / ISR** — mỗi partition có 1 *leader* + N *follower*. **ISR** (In-Sync Replicas) = các replica bắt kịp leader. Liên kết → *acks*, *durability*, *min.insync.replicas*.\n- **Coordinator: ZooKeeper → KRaft** — quản lý metadata, bầu leader. Kafka mới (3.x+) bỏ ZooKeeper, dùng **KRaft** (Raft nội bộ).\n\n> [!TIP]\n> Một câu nắm cả cụm: *\"Producer ghi message vào 1 partition của topic; broker lưu & replicate; consumer trong 1 group đọc theo offset; offset được commit để biết đã đọc tới đâu.\"*\n\n### 1.3 Cấu trúc 1 Message (Record)\nLiên kết trực tiếp tới việc QA assert cái gì:\n\n- **Key** — quyết định message vào partition nào (cùng key → cùng partition → **giữ thứ tự**). Rất quan trọng để test ordering.\n- **Value** — payload (thường JSON/Avro/Protobuf).\n- **Headers** — metadata (vd `correlation-id`, `trace-id` để truy vết).\n- **Timestamp** — thời điểm tạo/append.\n- **Offset + Partition** — vị trí, do broker gán.\n\n> [!GOTCHA]\n> Ordering **chỉ được đảm bảo trong 1 partition**, KHÔNG trên toàn topic. Nếu test yêu cầu thứ tự (vd event của cùng 1 order), producer phải set **key** giống nhau. Đây là bug ordering kinh điển QA cần soi.\n\n---\n\n## 2. Delivery Semantics (QUAN TRỌNG NHẤT với QA)\n\nQuy định \"message được giao bao nhiêu lần\". Quyết định bạn phải test duplicate hay test mất mát.\n\n| Semantic | Nghĩa | Rủi ro cần test | Cấu hình liên quan |\n|---|---|---|---|\n| **At-most-once** | ≤ 1 lần | **Mất message** | commit offset *trước* khi xử lý; `acks=0` |\n| **At-least-once** | ≥ 1 lần (mặc định phổ biến) | **Trùng message (duplicate)** | commit *sau* khi xử lý; `acks=all` |\n| **Exactly-once (EOS)** | đúng 1 lần | Phức tạp, có thể hiểu sai phạm vi | `enable.idempotence=true`, transactions, `isolation.level=read_committed` |\n\n> [!IMPORTANT]\n> Đa số hệ thống chạy **at-least-once** → nghĩa là **duplicate là chuyện bình thường**. Câu hỏi QA phải đặt cho dev: *\"Consumer có idempotent không?\"* Nếu xử lý cùng 1 message 2 lần mà tạo 2 order → **đó là bug**, và bạn phải có test case cho nó.\n\nKhái niệm đi kèm:\n- **Idempotent producer** (`enable.idempotence`) — chống duplicate do producer retry.\n- **Idempotent consumer** — logic phía consumer tự khử trùng (dedup bằng key/event-id).\n- **Transactions** — ghi nhiều partition/topic atomically (all-or-nothing).\n\n---\n\n## 3. Producer — những gì ảnh hưởng tới test\n\n- **`acks`** — `0` (fire & forget, có thể mất), `1` (leader xác nhận), `all`/`-1` (toàn bộ ISR xác nhận → bền nhất). → liên kết *durability* / *min.insync.replicas*.\n- **Partitioner** — quyết định partition: theo key (hash), round-robin, hoặc custom. → liên kết *ordering*.\n- **Retries + idempotence** — retry có thể tạo duplicate nếu không bật idempotence.\n- **Batching / linger.ms / compression** — gom message để tăng throughput; ảnh hưởng độ trễ → test performance/latency.\n\n> [!GOTCHA]\n> `acks=all` mà `min.insync.replicas` không đủ → producer **báo lỗi thay vì ghi**. Khi test resilience (kill broker), đây là điểm dễ \"tưởng bug\" nhưng thực ra là cấu hình đúng.\n\n---\n\n## 4. Consumer — nơi sinh nhiều bug nhất\n\n### 4.1 Offset & Commit\n- **Committed offset** = \"đã xử lý xong tới đâu\". Restart consumer sẽ đọc tiếp từ đây.\n- **Auto-commit** (`enable.auto.commit=true`) tiện nhưng nguy hiểm: commit theo interval, có thể commit message **chưa xử lý xong** → mất message khi crash.\n- **Manual commit** (sync/async) → kiểm soát chính xác, dùng cho at-least-once đúng nghĩa.\n- **`auto.offset.reset`** — `earliest` (đọc từ đầu) vs `latest` (chỉ message mới) khi không có offset. **Cực kỳ quan trọng khi viết test consumer** — sai cái này test sẽ \"không thấy message nào\".\n\n### 4.2 Consumer Group & Rebalance\n- Mỗi partition chỉ được **1 consumer trong group** đọc tại 1 thời điểm.\n- Số consumer > số partition → consumer thừa **ngồi không**. → giới hạn parallelism = số partition.\n- **Rebalance** — khi consumer join/leave, partition được chia lại. Trong lúc rebalance, consume **tạm dừng** → ảnh hưởng độ trễ, có thể gây duplicate.\n\n> [!GOTCHA]\n> Rebalance storm (rebalance liên tục do `session.timeout`/`max.poll.interval` sai) là bug production phổ biến. Triệu chứng QA thấy: lag tăng vọt, throughput tụt. Liên kết → *consumer lag monitoring*.\n\n### 4.3 Consumer Lag (chỉ số vàng của QA)\n**Lag = log-end-offset − committed-offset** = số message chưa được consume. Đây là **metric quan trọng nhất** để biết hệ thống có theo kịp không.\n- Lag tăng đều → consumer chậm / chết / rebalance.\n- Test performance/soak: monitor lag để biết throughput đủ chưa.\n- Công cụ: `kafka-consumer-groups.sh --describe`, Burrow, Kafka Lag Exporter, Prometheus.\n\n---\n\n## 5. Lưu trữ & Dữ liệu\n\n- **Retention** — theo *time* (`retention.ms`) hoặc *size* (`retention.bytes`). Hết hạn → xóa. → ảnh hưởng *replay* và test: dữ liệu test có thể \"biến mất\".\n- **Log Compaction** — giữ lại **message mới nhất cho mỗi key** (vd snapshot trạng thái). Khác với delete retention. → dùng cho topic kiểu \"current state\".\n- **Tombstone** — message value = null, báo \"xóa key này\" trong compacted topic.\n- **Replication factor** — số bản sao của partition (vd RF=3). RF + `min.insync.replicas` quyết định chịu được mất bao nhiêu broker.\n\n> [!TIP]\n> Khi test môi trường shared, retention ngắn có thể làm message test bị dọn trước khi assert. Dùng topic riêng cho test hoặc set retention phù hợp.\n\n---\n\n## 6. Hệ sinh thái (Ecosystem) — biết để định vị test scope\n\n- **Schema Registry** — quản lý schema (Avro/Protobuf/JSON Schema) + **compatibility rules** (BACKWARD/FORWARD/FULL). → nền tảng cho **contract testing**. Liên kết → *serialization*, *schema evolution*.\n- **Kafka Connect** — sink/source connector (DB ↔ Kafka) không cần code. → test: CDC (Debezium), data integrity.\n- **Kafka Streams** — thư viện xử lý stream (join, aggregate, windowing) trong app Java. → test bằng `TopologyTestDriver`.\n- **ksqlDB** — SQL trên stream.\n- **Mirror Maker** — replicate giữa các cluster (multi-DC, DR).\n\n> [!IMPORTANT]\n> **Schema evolution** là nguồn bug tích hợp số 1 trong hệ Kafka: producer đổi schema, consumer cũ vỡ. QA nên đẩy việc này vào CI bằng **contract test + schema compatibility check** thay vì phát hiện ở production.\n\n---\n\n## 7. Điểm mạnh / điểm yếu\n\n### Điểm mạnh\n- **Throughput cực cao** + horizontal scale (thêm partition/broker).\n- **Durable & replayable** — message lưu trên đĩa, replay được → tốt cho event sourcing, audit, reprocess.\n- **Decoupling** producer/consumer → nhiều consumer độc lập đọc cùng data.\n- **Ordering theo partition** + delivery guarantees linh hoạt.\n\n### Điểm yếu / chi phí\n- **Phức tạp vận hành** (cluster, ZK/KRaft, tuning) → khó dựng môi trường test.\n- **Không phải hàng đợi tác vụ** truyền thống: không có per-message ack/priority/TTL như RabbitMQ; làm DLQ/retry phải tự build.\n- **Ordering toàn cục không có** — chỉ trong partition.\n- **Eventually consistent** → test khó, dễ flaky nếu assert sai thời điểm.\n- **Không query được như DB** — muốn tìm 1 message phải scan/consume.\n\n---\n\n## 8. GÓC NHÌN QA AUTOMATION — Test cái gì & Test thế nào\n\n### 8.1 Các tầng test\n1. **Component test (1 service)** — service đọc/ghi Kafka đúng không? Dùng **embedded/Testcontainers Kafka**.\n2. **Contract test** — schema producer ↔ consumer tương thích (Schema Registry compatibility, hoặc Pact for async).\n3. **Integration / E2E** — chuỗi nhiều service: produce ở đầu → assert side-effect ở cuối (DB, topic khác, API).\n4. **Non-functional** — throughput, latency, **consumer lag dưới tải**, resilience (kill broker, network partition).\n\n### 8.2 Test harness điển hình (automation)\n- **Produce test message** vào topic input bằng client (kafkajs / confluent-kafka / Spring Kafka test).\n- **Consume & assert** ở topic output — dùng **awaitility / polling** (KHÔNG dùng sleep cứng).\n- **Verify side-effect**: poll DB/API tới khi đạt trạng thái mong đợi hoặc timeout.\n\n> [!IMPORTANT]\n> Vì Kafka async → **mọi assertion phải là \"await until / poll with timeout\"**, không assert tức thì. `sleep(3000)` là anti-pattern: vừa flaky vừa chậm. Dùng retry-until-condition (Awaitility, `expect.poll`, vitest `vi.waitFor`).\n\n### 8.3 Công cụ thường dùng\n- **Testcontainers** (`KafkaContainer`) — dựng Kafka thật trong Docker cho test, dọn sạch sau test. Tốt nhất cho integration.\n- **Embedded Kafka** (Spring `@EmbeddedKafka`) — nhanh, in-process, cho unit/component (JVM).\n- **`TopologyTestDriver`** — test Kafka Streams không cần broker.\n- **CLI**: `kafka-console-producer/consumer`, `kafka-consumer-groups`, `kcat` (kafkacat) — debug & verify thủ công.\n- **UI**: AKHQ, Conduktor, Kafka UI, Redpanda Console — quan sát topic/lag/message.\n- **Client lib**: kafkajs (Node), confluent-kafka-python, Spring Kafka.\n\n### 8.4 Checklist test case đặc thù Kafka\n- ✅ **Happy path**: produce → consume → side-effect đúng.\n- ✅ **Duplicate**: gửi cùng message 2 lần → hệ thống idempotent (không tạo 2 record).\n- ✅ **Ordering**: nhiều event cùng key → xử lý đúng thứ tự.\n- ✅ **Out-of-order / late event**: event đến trễ → xử lý ra sao.\n- ✅ **Poison pill**: message lỗi schema/parse → vào **DLQ**, không kẹt cả partition.\n- ✅ **Consumer restart**: kill giữa chừng → resume từ offset đúng, không mất/không trùng.\n- ✅ **Rebalance**: scale consumer up/down → không mất message.\n- ✅ **Schema evolution**: thêm field optional → consumer cũ vẫn chạy.\n- ✅ **Lag dưới tải**: bơm N msg/s → lag không tăng vô hạn.\n- ✅ **Broker failure**: kill 1 broker (RF≥2) → không mất message.\n\n> [!GOTCHA]\n> **Flaky test** là kẻ thù lớn nhất khi test Kafka. Nguyên nhân hay gặp: (1) assert quá sớm (chưa consume xong), (2) `auto.offset.reset` sai nên không thấy message, (3) consumer group dùng lại `group.id` cũ → đọc nhầm offset, (4) topic chưa được dọn giữa các test → dữ liệu rò rỉ. Mỗi test nên có **group.id / topic độc lập** hoặc dọn sạch.\n\n### 8.5 DLQ & Error handling (rất hay bị bỏ sót)\n- **Dead Letter Queue** — message xử lý fail nhiều lần → đẩy sang topic DLQ để không chặn partition.\n- **Retry topic** — pattern retry có backoff (Spring Kafka `@RetryableTopic`).\n- QA cần test: message lỗi **có vào DLQ không**, partition **không bị kẹt**, và **alert** có bắn không.\n\n---\n\n## 9. Bản đồ liên kết nhanh (mind-map dạng text)\n\n```\nTopic ──split──> Partition ──ordered by──> Offset\n                    │                         │\n              parallelism                committed by\n                    │                         │\n              Consumer Group <──reads── Consumer ──manages──> Offset commit\n                    │                                              │\n                rebalance                                   auto vs manual\n                    │\nProducer ──key──> Partitioner ──> Partition (ordering!)\n   │\n  acks ──> ISR / min.insync.replicas ──> Durability\n   │\n idempotence + transactions ──> Exactly-once\n\nDelivery semantics ─┬─ at-most-once  (mất msg)\n                    ├─ at-least-once (duplicate ← QA test idempotency)\n                    └─ exactly-once  (transactions)\n\nSchema Registry ──> compatibility ──> Contract test / Schema evolution\nKafka Connect / Streams / ksqlDB ──> ecosystem (định vị scope test)\nRetention / Compaction ──> ảnh hưởng replay & data trong test\nConsumer Lag ──> metric vàng để đánh giá throughput & sức khỏe\n```\n\n---\n\n## 10. Gợi ý các hướng đào sâu tiếp (để bạn hỏi)\n\n1. **Delivery semantics & idempotency** — cách thiết kế test case duplicate, exactly-once thực sự nghĩa là gì.\n2. **Testcontainers Kafka** — viết integration test thực tế (Node/kafkajs hoặc Java/Spring).\n3. **Contract testing** với Schema Registry — đưa schema compatibility vào CI.\n4. **Consumer lag & performance test** — đo lag dưới tải, soak test.\n5. **Resilience testing** — kill broker, rebalance, poison pill, DLQ.\n6. **Chiến lược chống flaky** — polling/awaitility, isolation topic & group.id.\n7. **Observability** — trace-id qua headers, end-to-end tracing trong hệ event-driven.\n\n> [!TIP]\n> Lộ trình đề xuất cho senior QA: **(2) Delivery semantics → (8.4) Checklist test case → Testcontainers harness → Lag/Resilience → Contract test**. Đây là thứ tự từ \"hiểu để test đúng\" đến \"tự động hóa & đưa vào CI\".\n\n---\n\n## 11. Phỏng vấn — Q&A bám dự án thực tế (MDaaS)\n\n> [!NOTE]\n> Phần này build trên một dự án có thật: hệ scan file **event-driven qua Kafka**. Producer dùng **`request_id` làm partition key**. Test produce 1 scan request → một consumer riêng (`node index.js -a consume`) gom result message theo `request_id` vào file datalog → Playwright test **poll datalog tới khi gặp terminal event `progress_percentage == 100`** → verify payload bản ghi cuối (như verify response body API). Có assert ordering: chuỗi `progress_percentage` của 1 request phải **tăng dần đơn điệu**.\n\n### 11.1 \"Elevator pitch\" — mô tả dự án trong 30 giây\n> \"Hệ thống là pipeline scan file bất đồng bộ. Test produce một request kèm `request_id` (dùng làm **partition key**) vào topic `scan`. Engine xử lý và phát các result message lên topic `scan-result-*`. Một consumer riêng gom message theo `request_id`, test **poll cho tới khi gặp terminal event `progress_percentage == 100`**, rồi verify payload — tương tự verify response body, nhưng async nên dùng **poll-until** thay vì assert tức thì. Tôi cũng assert ordering ở mức nghiệp vụ: `progress_percentage` phải tăng dần đơn điệu.\"\n\n---\n\n### NHÓM A — Hiểu nền tảng\n\n**Q: Vì sao test Kafka khác test REST API?**\n> Action và effect **tách rời theo thời gian** (async). Không thể \"gọi → assert response\" ngay. Phải verify **side-effect** (message lên topic, datalog cập nhật) và assert theo kiểu **eventually consistent**: poll-until-condition với timeout, không assert tức thì, không `sleep` cứng.\n\n> [!GOTCHA]\n> Bẫy theo sau: *\"sleep cứng có được không?\"* → Không. Vừa flaky vừa chậm. Đúng là **poll tới điều kiện** (gặp `progress_percentage == 100`) hoặc timeout — đúng như `getKafkaObjectById_allResult` đang làm.\n\n**Q: Topic, partition, offset, consumer group — giải thích nhanh.**\n> Topic = kênh logic; chia thành partition (đơn vị song song + thứ tự); offset = số thứ tự message trong 1 partition; consumer group = nhóm chia nhau partition, mỗi partition chỉ 1 consumer trong group đọc.\n\n---\n\n### NHÓM B — Ordering (điểm mạnh của bạn, hay bị hỏi xoáy)\n\n**Q: Bạn đảm bảo ordering bằng cách nào?**\n> Producer set **key = `request_id`** → mọi message cùng request rơi vào **cùng partition** → Kafka giữ thứ tự trong partition theo offset. Một consumer đọc partition đó tuần tự nên giữ nguyên thứ tự. Tôi assert ở mức nghiệp vụ: `progress_percentage` phải **monotonic non-decreasing** (`verifyItemOfArray_IsSorted`).\n\n**Q (xoáy): Ordering của Kafka là toàn topic hay chỉ trong partition?**\n> **Chỉ trong partition.** Toàn topic KHÔNG có. Đó chính là lý do phải dùng key — để gom các message cần thứ tự về cùng partition.\n\n**Q (xoáy): Consumer của bạn merge nhiều partition/nhiều topic vào 1 datalog. Vậy thứ tự trong file có đáng tin không?**\n> Thứ tự **toàn cục** trong file không đáng tin (merge nhiều partition). Nhưng tôi **chỉ assert ordering trong phạm vi 1 `request_id`**, mà các message đó cùng 1 partition → thứ tự được giữ. Tôi không bao giờ dựa vào thứ tự giữa các request khác nhau.\n\n**Q (xoáy chí mạng): Điều gì có thể làm vỡ ordering dù đã set key đúng?**\n> Ba chỗ: (1) **Producer** — `max.in.flight > 1` + retry mà KHÔNG bật `enable.idempotence` → retry có thể ghi sai thứ tự; (2) **Reshard** — đổi số partition làm `hash(key)%N` đổi, cùng key sang partition khác; (3) **Consumer** — nếu xử lý đa luồng/async thì đọc đúng thứ tự nhưng side-effect ra sai thứ tự.\n\n> [!IMPORTANT]\n> Trong consumer dự án này `maxInFlightRequests: 5` + có retry. Với **consumer** thì in-flight không phá ordering đọc (đọc tuần tự theo offset trong partition). Nhưng đây là kiến thức để bạn nói về **phía producer** — nơi `max.in.flight` + retry mới thực sự gây reorder, và cần `enable.idempotence` để vá.\n\n---\n\n### NHÓM C — Delivery semantics & duplicate\n\n**Q: Hệ thống của bạn at-least-once hay exactly-once?**\n> Mặc định Kafka phổ biến là **at-least-once** → **duplicate là chuyện bình thường**. Câu hỏi đúng phải đặt: consumer có **idempotent** không?\n\n**Q (xoáy): Nếu nhận trùng terminal event (`progress_percentage == 100`) hai lần thì test/hệ thống có sai không?**\n> Phải kiểm tra. Nếu logic verify chỉ đọc bản ghi cuối theo `request_id` thì duplicate terminal event **không làm sai assertion** (vẫn cùng payload). Nhưng nếu phía hệ thống tạo **2 kết quả** cho cùng request → đó là bug idempotency. Hiện tôi **chưa có test case chủ động cho duplicate** — đó là khoảng trống tôi muốn bổ sung (replay 1 message và verify không nhân đôi kết quả).\n\n**Q: Phân biệt at-most-once vs at-least-once theo thời điểm commit offset.**\n> Commit **trước** khi xử lý → crash giữa chừng → mất message = at-most-once. Xử lý xong **rồi** commit → crash trước commit → đọc lại → trùng = at-least-once.\n\n---\n\n### NHÓM D — Consumer / offset / test isolation\n\n**Q: Consumer của bạn dùng `group.id` thế nào? Vì sao?**\n> Mỗi lần chạy tạo **`group.id` random** (`file-scan-result-msg-auto-kafka-${makeid(3)}`). Lý do: tránh dùng lại offset cũ của lần chạy trước → mỗi lần test bắt đầu sạch, không bị \"đã commit nên không đọc lại\". Đây là **test isolation** ở tầng consumer group.\n\n**Q (xoáy): `auto.offset.reset` ảnh hưởng gì tới test của bạn?**\n> Group mới chưa có offset → giá trị `auto.offset.reset` quyết định đọc từ đầu (`earliest`) hay chỉ message mới (`latest`). Vì consumer của tôi **chạy trước rồi mới produce**, message cần đọc là message mới → hoạt động đúng. Nếu cấu hình sai (`latest` nhưng produce trước khi consumer kịp join) → test \"không thấy message nào\", một nguồn flaky kinh điển.\n\n**Q: Vì sao tách consumer (`index.js`) ra process riêng, ghi datalog file, rồi test mới poll file — thay vì consume trực tiếp trong test?**\n> **Decoupling**: consumer chạy dài, gom liên tục; test chỉ là bên đọc, đơn giản và ổn định hơn. Đổi lại có **race condition file I/O** giữa ghi và đọc — nên code có **batch-write theo interval** để giảm tranh chấp. Trade-off: thêm độ trễ và một điểm phức tạp; nếu làm lại tôi cân nhắc consume in-test bằng Testcontainers cho test cô lập.\n\n---\n\n### NHÓM E — Chiến lược test & chống flaky\n\n**Q: Bạn xác định \"request đã xong\" bằng cách nào?**\n> Terminal event: main file đạt `progress_percentage == 100`, **cộng** đối chiếu đủ child file (`files_in_archive`) và sanitized file (theo `original_id`), **cộng** cửa sổ chờ 10s cho **late arrival** (file sanitize trả sau). Chỉ khi đủ mới coi là complete rồi mới verify.\n\n**Q (xoáy): Vì sao cần cửa sổ chờ 10s sau khi thấy 100%?**\n> Vì các message phụ (sanitized/child) có thể **đến sau** terminal event của main file. Nếu assert ngay lúc thấy 100% sẽ **thiếu dữ liệu** → false negative. Đây là xử lý **out-of-order / late event** ở mức ứng dụng.\n\n**Q: Các nguồn flaky khi test Kafka và cách bạn chặn?**\n> (1) Assert quá sớm → dùng poll-until; (2) `auto.offset.reset` sai → consumer chạy trước produce; (3) dùng lại `group.id` → random group mỗi lần; (4) datalog rò rỉ giữa các test / race file I/O → batch-write + lọc chặt theo `request_id` random; (5) late arrival → cửa sổ chờ.\n\n---\n\n### NHÓM F — Giới hạn & hướng mở rộng (tín hiệu SENIOR)\n\n**Q: Hệ thống test của bạn CHƯA cover gì? Sẽ thêm gì?**\n> Trung thực liệt kê:\n> - **Duplicate / idempotency** — replay message, verify không tạo kết quả nhân đôi.\n> - **Consumer lag dưới tải** — bơm N request/s, đo lag không tăng vô hạn (`kafka-consumer-groups --describe`).\n> - **Resilience** — kill broker (RF≥2), verify không mất message; rebalance khi scale consumer.\n> - **DLQ / poison pill** — message lỗi schema có vào DLQ không, partition có bị kẹt không.\n> - **Schema evolution / contract test** — đẩy compatibility check vào CI để producer đổi schema không làm vỡ consumer.\n\n> [!TIP]\n> Công thức trả lời \"senior\": **(1) việc thật đang làm → (2) ánh xạ đúng khái niệm Kafka → (3) chủ động nêu giới hạn + cái sẽ thêm.** Người chỉ nói \"consume rồi verify\" dừng ở (1); bạn đi tới (3).\n\n**Q (cạm bẫy): Bạn nói có test ordering — vậy bạn có test idempotent producer / reorder-on-retry không?**\n> **Không** — tôi là **consumer-only**, không điều khiển producer config. Tôi assert ordering **mức nghiệp vụ** (progress monotonic), dựa trên đảm bảo Kafka rằng cùng key → cùng partition → giữ thứ tự. Việc verify `enable.idempotence` / hành vi reorder-on-retry phía producer nằm ngoài phạm vi hiện tại.\n\n> [!IMPORTANT]\n> Đừng overclaim. Nói đúng \"ordering mức nghiệp vụ\" thay vì \"test ordering guarantee của Kafka\" là khác biệt giữa ứng viên trung thực-có-chiều-sâu và ứng viên bị bắt bài.\n\n---\n\n### 11.2 Bảng ánh xạ: việc bạn làm ↔ khái niệm Kafka (học thuộc để trả lời nhanh)\n\n| Việc trong dự án | Khái niệm Kafka / QA |\n|---|---|\n| Lọc message theo `request_id` | Correlation ID; key = partition key → ordering per request |\n| Poll datalog tới khi thấy `progress_percentage == 100` | Eventually-consistent assertion; terminal event; poll-until |\n| Cửa sổ chờ 10s sau 100% | Xử lý late arrival / out-of-order |\n| `group.id` random mỗi lần chạy | Test isolation ở consumer group; tránh offset cũ |\n| Consumer chạy trước, produce sau | Liên quan `auto.offset.reset` (latest) |\n| `verifyItemOfArray_IsSorted(progress_percentage)` | Assert ordering trong 1 partition |\n| Verify payload bản ghi cuối | Output contract verification (như response body) |\n| Batch-write datalog | Giảm race condition I/O; trade-off độ trễ |\n| Consume nhiều topic priority (low/normal/high) | Partition/topic routing theo độ ưu tiên |\n","words":4047}]</script>
<script>
const DOCS = JSON.parse(document.getElementById('docs-data').textContent);
const $ = (id) => document.getElementById(id);
const QA_COUNT = 198;

/* ---- marked + GitHub-alert callouts ---- */
const ALERTS = {
  TIP:{i:'💡',l:'Tip',c:'tip'}, NOTE:{i:'📝',l:'Note',c:'note'}, INFO:{i:'ℹ️',l:'Info',c:'note'},
  WARNING:{i:'⚠️',l:'Warning',c:'warn'}, GOTCHA:{i:'⚠️',l:'Gotcha',c:'warn'}, CAUTION:{i:'🚨',l:'Caution',c:'danger'},
  DANGER:{i:'🚨',l:'Danger',c:'danger'}, IMPORTANT:{i:'⭐',l:'Important',c:'imp'}, KEY:{i:'🔑',l:'Key',c:'imp'}
};
const rnd = new marked.Renderer();
const origBq = rnd.blockquote.bind(rnd);
rnd.blockquote = function(q) {
  const m = q.match(/^\s*<p>\s*\[!(\w+)\]\s*([\s\S]*?)<\/p>([\s\S]*)/);
  if (m) { const t = ALERTS[m[1].toUpperCase()]; if (t) {
    const body = (m[2].trim() ? '<p>' + m[2].trim() + '</p>' : '') + m[3];
    return '<div class="callout c-' + t.c + '"><div class="callout-h"><span>' + t.i + '</span><span>' + t.l + '</span></div><div class="callout-b">' + body + '</div></div>';
  }}
  return origBq(q);
};
marked.setOptions({ gfm: true, breaks: false, renderer: rnd, highlight: (code, lang) => {
  if (lang && hljs.getLanguage(lang)) { try { return hljs.highlight(code, { language: lang }).value; } catch (e) {} }
  return hljs.highlightAuto(code).value;
}});

function slug(t) { return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^\w\s\-]/g,'').trim().replace(/\s+/g,'-').slice(0,60); }
function pad(n) { return String(n).padStart(2, '0'); }
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- tabs ---- */
function renderTabs() {
  const t = $('tabs'); t.innerHTML = '';
  DOCS.forEach(d => {
    const b = document.createElement('button');
    b.className = 'tab'; b.dataset.id = d.id; b.style.setProperty('--cat', d.accent);
    const label = d.id === 'home' ? 'index' : d.spec;
    b.innerHTML = (d.id === 'home' ? '' : '<span class="tick">✓</span>') + '<span>' + label + '</span>';
    b.addEventListener('click', () => navigate(d.id));
    t.appendChild(b);
  });
}

/* ---- home / run summary ---- */
function renderHome() {
  const p = $('sheet');
  const totalWords = DOCS.reduce((s, d) => s + (d.words || 0), 0);
  const specCount = DOCS.length - 1;
  document.documentElement.style.setProperty('--accent', 'var(--clay)');
  let cards = '';
  DOCS.filter(d => d.id !== 'home').forEach(d => {
    const ms = d.rawHtml ? 'diagram' : (d.words ? d.words.toLocaleString() + 'w' : '');
    cards += '<button class="spec" data-id="' + d.id + '" style="--cat:' + d.accent + '">'
      + '<div class="row1"><span class="tick">✓</span><span class="path">' + d.spec + '</span><span class="ms">' + ms + '</span></div>'
      + '<h3>' + d.title + '</h3><p>' + d.sub + '</p></button>';
  });
  p.innerHTML = '<section class="home-head">'
    + '<div class="kicker">QA Automation · Knowledge Runner</div>'
    + '<h1>Mọi spec đang <span class="dim">passing.</span></h1>'
    + '<p class="lede">Sổ tay kỹ thuật của một QA Automation — Playwright, CI/CD, Kafka, JavaScript, design patterns và bộ câu hỏi phỏng vấn. Chạy như một test suite: mở từng spec để đọc, ⌘K để nhảy nhanh.</p>'
    + '</section>'
    + '<div class="terminal"><div class="bar"><i></i><i></i><i></i><span>qa-suite — run --all</span></div><div class="screen" id="termScreen"></div></div>'
    + '<div class="stats">'
    + '<div class="stat"><b>' + specCount + '</b><span>spec files</span></div>'
    + '<div class="stat"><b>' + totalWords.toLocaleString() + '</b><span>words</span></div>'
    + '<div class="stat"><b>' + QA_COUNT + '</b><span>Q&A</span></div>'
    + '<div class="stat pass"><b>PASS</b><span>suite status</span></div>'
    + '</div>'
    + '<div class="section-label">spec files · ' + specCount + '</div>'
    + '<div class="specs">' + cards + '</div>';
  p.querySelectorAll('.spec').forEach(c => c.addEventListener('click', () => navigate(c.dataset.id)));
  $('toc').style.display = 'none';
  runTerminal(totalWords, specCount);
}

/* ---- terminal streaming (the signature moment) ---- */
let termTimers = [];
function clearTerminal() { termTimers.forEach(clearTimeout); termTimers = []; }
function runTerminal(totalWords, specCount) {
  clearTerminal();
  const screen = $('termScreen'); if (!screen) return;
  const specs = DOCS.filter(d => d.id !== 'home');
  const lines = [];
  lines.push({ t: 'cmd', s: '$ qa-suite run --all' });
  lines.push({ t: 'dim', s: 'Loading ' + specCount + ' spec files…' });
  specs.forEach(d => {
    const ms = d.rawHtml ? 'diagram' : (d.words ? d.words.toLocaleString() + 'w' : '0w');
    lines.push({ t: 'ok', s: '  ✓ ' + d.spec.padEnd(20, ' ') + '  ' + ms });
  });
  lines.push({ t: 'sum', s: '' });
  lines.push({ t: 'sum', s: '✓ ' + specCount + ' passed · 0 failed · ' + totalWords.toLocaleString() + ' words indexed' });
  lines.push({ t: 'dim', s: 'Ready. Chọn một spec ở dưới, hoặc ⌘K.' });

  const paint = (upto, withCursor) => {
    screen.innerHTML = lines.slice(0, upto).map(l =>
      '<div class="ln ' + l.t + '">' + (l.s === '' ? '&nbsp;' : escapeHtml(l.s)) + '</div>'
    ).join('') + (withCursor ? '<span class="cursor"></span>' : '');
    screen.scrollTop = screen.scrollHeight;
  };
  if (reduceMotion) { paint(lines.length, false); return; }
  let i = 0;
  const step = () => {
    i++; paint(i, i < lines.length);
    if (i < lines.length) termTimers.push(setTimeout(step, i <= 2 ? 260 : 90));
  };
  step();
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---- doc ---- */
function renderDoc(d) {
  clearTerminal();
  const p = $('sheet');
  const ms = d.rawHtml ? 'interactive diagram' : (d.words ? d.words.toLocaleString() + ' words' : '');
  p.innerHTML = '<div class="filehead" style="--cat:' + d.accent + '">'
    + '<div class="path"><span class="tick">✓</span> <b>' + d.spec + '</b> · N°' + pad(d.idx) + '</div>'
    + '<h1>' + d.title + '</h1><div class="sub">' + d.sub + '</div>'
    + '<div class="metaline"><span><b>status</b> passing</span><span><b>size</b> ' + ms + '</span><span><b>index</b> ' + pad(d.idx) + ' / ' + pad(DOCS.length - 1) + '</span></div>'
    + '</div><div class="md" id="mdBody"></div>';
  if (d.rawHtml) { $('mdBody').innerHTML = d.content || ''; $('toc').style.display = 'none'; window.scrollTo(0, 0); return; }
  $('mdBody').innerHTML = marked.parse(d.content || '*(empty)*');
  if (d.id === 'interview-answers') setupAnswers();
  buildTOC();
  document.querySelectorAll('#mdBody pre code').forEach(el => { try { hljs.highlightElement(el); } catch (e) {} });
  window.scrollTo(0, 0);
}

/* ---- collapsible answers (revision runner) ---- */
function setupAnswers() {
  const body = $('mdBody'); const wraps = [];
  Array.from(body.children).forEach(node => {
    if (node.tagName !== 'H3' || !/^\s*\d+\./.test(node.textContent)) return;
    const ans = []; let sib = node.nextElementSibling;
    while (sib && sib.tagName !== 'H3' && sib.tagName !== 'H2') { ans.push(sib); sib = sib.nextElementSibling; }
    if (!ans.length) return;
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-line answer-toggle';
    const wrap = document.createElement('div'); wrap.className = 'answer-wrap';
    node.insertAdjacentElement('afterend', btn); btn.insertAdjacentElement('afterend', wrap);
    ans.forEach(n => wrap.appendChild(n));
    btn.addEventListener('click', () => { const o = wrap.classList.toggle('open'); btn.classList.toggle('open', o); });
    wraps.push({ btn, wrap });
  });
  if (!wraps.length) return;
  const bar = document.createElement('div'); bar.className = 'answer-bar';
  const all = document.createElement('button'); all.type = 'button'; all.className = 'btn-line'; all.textContent = 'Run all';
  const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = wraps.length + ' câu — đáp án ẩn (▶ run để hiện) để ôn tập.';
  bar.appendChild(all); bar.appendChild(hint); body.insertBefore(bar, body.firstChild);
  all.addEventListener('click', () => {
    const show = !wraps.every(w => w.wrap.classList.contains('open'));
    wraps.forEach(({ btn, wrap }) => { wrap.classList.toggle('open', show); btn.classList.toggle('open', show); });
    all.textContent = show ? 'Hide all' : 'Run all';
  });
}

/* ---- mini-map + scrollspy ---- */
let spy = null;
function buildTOC() {
  const hs = document.querySelectorAll('#mdBody h2, #mdBody h3');
  const list = $('tocList'); list.innerHTML = '';
  if (hs.length < 2) { $('toc').style.display = 'none'; return; }
  $('toc').style.display = '';
  hs.forEach((h, i) => {
    const id = 'h-' + i + '-' + slug(h.textContent); h.id = id;
    const li = document.createElement('li'); const a = document.createElement('a');
    a.href = '#' + id; a.textContent = h.textContent; a.className = 'lv-' + h.tagName.charAt(1);
    a.addEventListener('click', (e) => { e.preventDefault(); document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    li.appendChild(a); list.appendChild(li);
  });
  if (spy) spy.disconnect();
  const links = Array.from(list.querySelectorAll('a'));
  spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-20% 0px -70% 0px' });
  hs.forEach(h => spy.observe(h));
}

/* ---- routing ---- */
function setActive(id) {
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const d = DOCS.find(x => x.id === id);
  if (d) {
    document.documentElement.style.setProperty('--accent', d.accent);
    document.documentElement.style.setProperty('--accent-soft', hexA(d.accent, .14));
    $('crumb').textContent = d.id === 'home' ? 'index' : d.spec;
    const at = document.querySelector('.tab.active');
    if (at) at.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }
}
function hexA(h, a) { const x = h.replace('#',''); return 'rgba(' + parseInt(x.slice(0,2),16) + ',' + parseInt(x.slice(2,4),16) + ',' + parseInt(x.slice(4,6),16) + ',' + a + ')'; }
function navigate(id) {
  const d = DOCS.find(x => x.id === id) || DOCS[0];
  history.replaceState(null, '', '#' + d.id); setActive(d.id);
  if (d.id === 'home') renderHome(); else renderDoc(d);
  updateProgress();
}
$('brand').addEventListener('click', () => navigate('home'));

/* ---- reading progress ---- */
function updateProgress() {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const pct = max > 0 ? Math.min(100, (h.scrollTop || document.body.scrollTop) / max * 100) : 0;
  $('progressBar').style.width = pct + '%';
}
window.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress);

/* ---- command palette ---- */
let cmdItems = [], cmdSel = 0;
function buildCmdIndex() {
  const items = DOCS.map(d => ({ kind: 'spec', id: d.id, title: d.title, sub: d.id === 'home' ? 'index' : d.spec, num: d.id === 'home' ? '◆' : pad(d.idx), accent: d.accent }));
  document.querySelectorAll('#mdBody h2, #mdBody h3').forEach(h => items.push({ kind: 'heading', anchor: h.id, title: h.textContent, sub: $('crumb').textContent, num: '#', accent: 'var(--accent)' }));
  return items;
}
function openCmd() { $('cmdk').classList.add('show'); $('cmdInput').value = ''; filterCmd(''); $('cmdInput').focus(); }
function closeCmd() { $('cmdk').classList.remove('show'); }
function filterCmd(q) {
  const all = buildCmdIndex(); const s = q.trim().toLowerCase();
  cmdItems = s ? all.filter(it => (it.title + ' ' + it.sub).toLowerCase().includes(s)) : all;
  cmdSel = 0; renderCmd();
}
function renderCmd() {
  const list = $('cmdList');
  if (!cmdItems.length) { list.innerHTML = '<div class="cmdk-empty">Không có kết quả</div>'; return; }
  list.innerHTML = cmdItems.map((it, i) => '<div class="cmdk-row' + (i === cmdSel ? ' sel' : '') + '" data-i="' + i + '" style="--cat:' + it.accent + '">'
    + '<span class="num">' + it.num + '</span><span class="lbl"><b>' + it.title + '</b><s>' + it.sub + '</s></span><span class="kind">' + it.kind + '</span></div>').join('');
  list.querySelectorAll('.cmdk-row').forEach(r => { r.addEventListener('click', () => runCmd(cmdItems[+r.dataset.i])); r.addEventListener('mousemove', () => { cmdSel = +r.dataset.i; markSel(); }); });
}
function markSel() { $('cmdList').querySelectorAll('.cmdk-row').forEach((r, i) => r.classList.toggle('sel', i === cmdSel)); }
function runCmd(it) {
  closeCmd();
  if (it.kind === 'spec') navigate(it.id);
  else { const el = document.getElementById(it.anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
$('cmdHint').addEventListener('click', openCmd);
$('cmdInput').addEventListener('input', e => filterCmd(e.target.value));
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('cmdk').classList.contains('show') ? closeCmd() : openCmd(); return; }
  if (!$('cmdk').classList.contains('show')) return;
  if (e.key === 'Escape') closeCmd();
  else if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdItems.length - 1); markSel(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); markSel(); }
  else if (e.key === 'Enter' && cmdItems[cmdSel]) { e.preventDefault(); runCmd(cmdItems[cmdSel]); }
});
$('cmdk').addEventListener('click', e => { if (e.target.id === 'cmdk') closeCmd(); });

/* ---- theme ---- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  $('hljs-dark').disabled = t !== 'dark'; $('hljs-light').disabled = t === 'dark';
  localStorage.setItem('suite-theme', t);
}
$('themeBtn').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ---- init ---- */
(function () {
  applyTheme(localStorage.getItem('suite-theme') || 'dark');
  renderTabs();
  const start = (location.hash || '#home').slice(1);
  navigate(DOCS.find(d => d.id === start) ? start : 'home');
})();
</script>
</body>
