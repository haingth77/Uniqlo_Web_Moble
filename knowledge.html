làm gì?\n196. \"Support dev team\" nghĩa là gì với bạn (ngoài việc report bug)?\n197. Bạn đang và sẽ ứng dụng AI vào testing như thế nào?\n198. Vì sao bạn muốn gia nhập team/công ty này? Bạn có câu hỏi gì cho manager?\n","words":1960},{"id":"playwright-note","title":"Playwright Notes","sub":"Ghi chú thực hành Playwright","accent":"#788c5d","spec":"playwright.notes","file":"Playwright_note.md","idx":3,"content":"Playwright Notes\r\n\r\n## Issue 01: getByRole resolves to input but click is blocked by span overlay\r\n\r\n### Bối cảnh\r\n\r\n- Trường hợp thực tế:\r\n  - Label có 2 thẻ con: một `input` và một `span` custom radio.\r\n  - Locator như `getByLabel('Individual Employee').locator('..').getByRole('radio')` hoặc `getByText(...).locator('..').getByRole('radio')` trả về `input`.\r\n\r\n### Triệu chứng\r\n\r\n- Playwright log:\r\n  - `resolved to <input type=\"radio\"...>`\r\n  - `span ... intercepts pointer events`\r\n- Test bị timeout dù `input` đã visible, enabled và stable.\r\n\r\n### Nguyên nhân\r\n\r\n- `getByRole('radio')`/`getByLabel` tìm tới `input` vì đó là form control có role hợp lệ.\r\n- Trong UI custom (ví dụ OrangeHRM), phần tử nhận pointer thường là span/icon wrapper (`.oxd-radio-input`) chứ không phải input gốc.\r\n- Input vẫn là node đúng cho accessibility, nhưng không phải node tốt nhất để `click()` trong trường hợp này.\r\n\r\n### Cách khắc phục (khuyến nghị)\r\n\r\n1. Click trực tiếp vào span radio trong label: dùng Xpath or CSS để locate thẳng vào label.\r\n\r\n```ts\r\n// Ví dụ trực tiếp vào label span\r\nawait this.getPage\r\n  .locator('label:has-text(\"Individual Employee\") .oxd-radio-input')\r\n  .click();\r\n```\r\n\r\n2. Hoặc dùng `force: true` khi đã chắc selector đúng nhưng bị pointer overlay chặn.\r\n\r\n```ts\r\n// Dùng ElementWrapper\r\nawait leavePage.optIndividualEmployee.getElement().click({ force: true });\r\n\r\n// Hoặc gọi wrapper method bạn đã có\r\nawait leavePage.optIndividualEmployee.click(true);\r\n```\r\n\r\n### Quy tắc nhớ nhanh\r\n\r\n- `getByLabel` hay `getByRole` thường tốt để nhận diện control theo accessibility.\r\n- Khi click bị `pointer events` / overlay chặn, kiểm tra lại xem visual control có phải là sibling/span không.\r\n- Ưu tiên selector theo phần tử thật sự nhận sự kiện click (thường là label/span), không chỉ control gốc.\r\n\r\n## Issue 02: getByText sai ý đồ khi element text không phải target action\r\n\r\n### Bối cảnh\r\n\r\n- Dùng `getByText()` để \"tìm row\", rồi đi xuống con có thể không luôn trúng đúng control cần tương tác.\r\n- Nếu text chỉ nằm ở `label/span`, còn action gắn ở icon/input khác, `getByText` chỉ giúp locate text node, chưa đảm bảo trúng element cần click/input.\r\n\r\n### Ví dụ hay gặp\r\n\r\n```ts\r\n// Có text trong label, nhưng control nhận event là button icon cùng row\r\nconst row = page.getByText('Individual Employee');\r\nawait row.locator('..').locator('input').click();\r\n```\r\n\r\nLỗi: locator vẫn có thể resolve vào node trung gian và click fail do event target không đúng.\r\n\r\n### Cách nên làm\r\n\r\n1. Bám theo role/form control luôn khi có thể:\r\n\r\n```ts\r\n// Stable hơn: lấy theo accessible name\r\nawait page.getByRole('radio', { name: 'Individual Employee' }).click();\r\n```\r\n\r\n2. Hoặc xác định rõ container rồi bám đến control con đúng:\r\n\r\n```ts\r\nconst row = page.locator('label:has-text(\"Individual Employee\")');\r\nawait row.locator('.oxd-radio-input').click();\r\n```\r\n\r\n3. Khi cần text + action: ưu tiên `locator(...).filter({ hasText: ... })` để thu hẹp phạm vi.\r\n\r\n```ts\r\nconst row = page.locator('form').filter({ hasText: 'Add Entitlements' });\r\nawait row.locator('label:has-text(\"Individual Employee\") .oxd-radio-input').click();\r\n```\r\n\r\n### Quy tắc nhớ nhanh\r\n\r\n- Dùng `getByText` cho thao tác đọc/khớp text.\r\n- Với action click/fill thì ưu tiên locator tới control thực tế (`input`, `button`, `span` click target), không chỉ node chứa text.\r\n\r\n## Issue 03: waitForPageLoad không thay cho wait cho data/render\r\n\r\n### Bối cảnh\r\n\r\n- `waitForPageLoad(state)` chỉ đợi load state của page/chromium event, không đợi dropdown/input mới render xong theo UI.\r\n- Trong nhiều app có call API nền hoặc animation, `waitForPageLoad` có thể chưa đủ để actionable.\r\n\r\n### Cách khuyến nghị\r\n\r\n1. Giữ `waitForPageLoad` ở mức `domcontentloaded` (an toàn hơn cho app có polling).\r\n2. Sau đó wait theo element cần thao tác:\r\n\r\n```ts\r\nawait leavePage.tabEntitlements.click();\r\nawait expect(leavePage.optAddEntitlement.getElement()).toBeVisible();\r\nawait leavePage.optAddEntitlement.click();\r\n\r\nawait expect(leavePage.tbxEmployeeName.getElement()).toBeVisible();\r\n```\r\n\r\n3. Tránh chờ `networkidle` nếu app có interval API.\r\n\r\n### Quy tắc nhớ nhanh\r\n\r\n- `domcontentloaded` = đủ để bắt đầu tương tác.\r\n- \"Stable test\" đến từ assertion theo phần tử nghiệp vụ: `toBeVisible`, `toBeEnabled`, `toContainText`.\r\n\r\n## Issue 04: Phân biệt page wait và element wait, khi nào dùng `page.waitForSelector`\r\n\r\n### 1) Page wait (đợi trạng thái cấp trang)\r\n\r\nPage wait là đợi các event của toàn trang, không trỏ tới một element cụ thể.\r\n\r\nCác API chính:\r\n\r\n```ts\r\n// Đợi mức độ tải trang\r\nawait page.waitForLoadState('domcontentloaded');\r\nawait page.waitForLoadState('load');\r\n\r\n// Đợi navigation hoặc URL thay đổi\r\nawait page.waitForURL('**/Leave/List');\r\n\r\n// Chờ response navigation\r\nawait page.waitForNavigation();\r\n```\r\n\r\nKhi dùng:\r\n- Tạo ranh giới bước lớn như chuyển route/nội dung trang mới.\r\n- Kết hợp trước các hành động trên một màn hình mới.\r\n- Tránh dùng như chờ cho một input cụ thể.\r\n\r\n### 2) Element/locator wait (đợi trạng thái của 1 phần tử)\r\n\r\nElement wait bám vào đúng đối tượng cần tác động/verify.\r\n\r\n```ts\r\nawait expect(leavePage.optAddEntitlement.getElement()).toBeVisible();\r\nawait expect(tbxEmployeeName.getElement()).toBeEnabled();\r\nawait page.getByRole('row', { name: '...' }).waitFor({ state: 'visible' });\r\n```\r\n\r\n`locator.waitFor` hoặc `expect(...).toBeVisible()` đã auto-wait rất tốt cho action và assertion.\r\nĐây là cách ưu tiên cho test ổn định:\r\n- tránh flake vì chờ đúng trạng thái nghiệp vụ\r\n- không chờ chung chung\r\n\r\n### 3) Khi nào dùng `page.waitForSelector`\r\n\r\n`page.waitForSelector(selector, ...)` KHÁC với `page.waitForLoadState`:\r\n- vẫn cần `selector` cụ thể.\r\n- dùng để chờ phần tử theo selector xuất hiện/ẩn/được gắn vào DOM (attached/visible) hoặc biến mất (hidden/detached).\r\n\r\nVí dụ:\r\n\r\n```ts\r\nawait page.waitForSelector('.oxd-loading-spinner', { state: 'hidden' });\r\nawait page.waitForSelector('.toast-success', { state: 'detached' });\r\n```\r\n\r\nKhi nên dùng:\r\n- Có logic cần chờ theo selector trước khi branch test.\r\n- Môi trường code cũ đang dùng selector trực tiếp.\r\n- Muốn chờ `hidden`/`detached` trước khi thao tác phần tử kế tiếp.\r\n\r\nKhi không nên dùng:\r\n- Dùng thay cho `click()`/`fill()` tự có auto-wait.\r\n- Dùng thay vì chọn đúng locator nghiệp vụ trong POM.\r\n\r\n### Quy tắc chọn nhanh\r\n\r\n1. Dùng **page wait** cho event cấp trang (`domcontentloaded`, navigation).\r\n2. Dùng **element wait** cho nghiệp vụ UI (`visible`, `enabled`, `hidden`, `detached`).\r\n3. Dùng `page.waitForSelector` khi cần chờ theo selector dạng legacy hoặc cần `hidden/detached` rõ ràng.\r\n\r\n## Issue 05: Multi-element locator vs single element action (Strict mode)\r\n\r\n### Bối cảnh\r\n\r\n- Trong table, `row.getByRole('cell')` trả về nhiều phần tử (nhiều cell trong cùng 1 row).\r\n- Trong case thực tế `Entitlement`, khi dùng\r\n  `const row = page.getByRole('row').filter({ hasText: 'CAN - Vacation' })` và\r\n  `const cells = row.getByRole('cell')`,\r\n  locator `cells` là list (ví dụ 7 cell).\r\n\r\n### Vấn đề gặp\r\n\r\n- Playwright báo lỗi strict mode khi action/assertion single-element được dùng trên locator có nhiều node.\r\n- Error mẫu:\r\n  - `... resolved to 7 elements ...`\r\n\r\n### Vì sao xảy ra\r\n\r\n- Playwright `Locator` được thiết kế là lazy query có thể match 1 hoặc nhiều element.\r\n- Sai khi nhầm tưởng như Selenium `findElement` chỉ trả đúng 1.\r\n- Những API như `click`, `fill`, `textContent`, `inputValue`, `getAttribute` cần context là 1 element.\r\n\r\n### Cách giải quyết (theo case thực tế)\r\n\r\n1. Bắt 1 row trước khi verify.\r\n\r\n```ts\r\nconst rows = leavePage.getPage.getByRole('row').filter({ hasText: 'CAN - Vacation' });\r\nawait expect(rows).toHaveCount(1); // tránh trùng row\r\n\r\nconst row = rows.first(); // hoặc .nth(0)\r\nconst cells = row.getByRole('cell');\r\n```\r\n\r\n`toHaveCount(1)` sẽ fail ngay nếu:\r\n- match = 0 (không tìm thấy row)\r\n- match > 1 (trùng row theo text)\r\n\r\n`row = rows.first()` được giữ lại để chuyển ý đồ từ `rows` (list) sang `row` (single) trước khi thao tác tiếp, giúp code dễ đọc khi cần mở rộng điều kiện.\r\n- Phòng khi refactor: sau này ai đó đổi expectation, vẫn an toàn.\r\n- Khóa ranh giới giữa bước “đếm đúng 1 row” và bước “xử lý row”.\r\n\r\n### Thêm nhiều điều kiện khi match row\r\n\r\nKhi chỉ `hasText: 'CAN - Vacation'` chưa đủ, có thể ghép thêm điều kiện theo chain:\r\n\r\n```ts\r\nconst rows = leavePage.getPage\r\n  .getByRole('row')\r\n  .filter({ hasText: 'CAN - Vacation' })\r\n  .filter({ hasText: 'Added' })\r\n  .filter({ hasText: '-01-01' })\r\n  .filter({ hasText: '77' });\r\n\r\nawait expect(rows).toHaveCount(1);\r\nconst row = rows.first();\r\nconst cells = row.getByRole('cell');\r\n```\r\n\r\nHoặc dùng locator kết hợp scope theo table cụ thể để tránh match nhầm:\r\n\r\n```ts\r\nconst table = leavePage.getPage.getByRole('table', { name: 'Entitlements' });\r\nconst row = table\r\n  .getByRole('row')\r\n  .filter({ hasText: 'CAN - Vacation' })\r\n  .filter({ hasText: 'Added' })\r\n  .filter({ hasText: '77' })\r\n  .first();\r\n```\r\n\r\n2. Khi cần kiểm tra nhanh nội dung cả row:\r\n\r\n```ts\r\nawait expect(cells).toHaveText(['CAN - Vacation', 'Added', '-01-01', '-08-24', '77']);\r\n```\r\n\r\n3. Khi cần kiểm tra theo cột:\r\n\r\n```ts\r\nawait expect(cells.nth(0)).toHaveText('CAN - Vacation');\r\nawait expect(cells.nth(1)).toHaveText('Added');\r\nawait expect(cells.nth(4)).toHaveText('77');\r\n```\r\n\r\n4. Nếu cần so sánh text động và chỉ đọc toàn bộ, dùng:\r\n\r\n```ts\r\nconst cellValues = await cells.allTextContents();\r\n```\r\n\r\n5. Nếu table không dùng `<td>`, đừng dùng `locator('td')`; kiểm tra bằng role `cell` hoặc cấu trúc thực tế (`div role=\"cell\"`).\r\n\r\n### Multi-element action nào dùng được trực tiếp\r\n\r\n- Dùng được:\r\n  - `count()`\r\n  - `all()`\r\n  - `allTextContents()`\r\n  - `allInnerTexts()`\r\n  - `evaluateAll()`\r\n  - `toHaveCount()`\r\n  - `toHaveText([...])` / `toContainText([...])` cho nhiều expected values\r\n  - `filter(...)`\r\n  - `first()`, `last()`, `nth(i)` để chuyển về single element\r\n\r\n- Nên tránh trực tiếp trên multi locator:\r\n  - `click()`\r\n  - `fill()`, `type()`\r\n  - `check()`, `uncheck()`\r\n  - `inputValue()`, `textContent()`, `innerText()`, `getAttribute()`\r\n  - `scrollIntoViewIfNeeded()` khi còn multi\r\n\r\n### Rule nhớ nhanh\r\n\r\n- Locator có thể là list => trước action single, luôn chọn `.first()`/`.nth(i)`.\r\n- Multi-locator dùng để kiểm kê (count/allText), rồi verify.\r\n- Với table custom (OrangeHRM), nên dựa vào `role=\"row\"`/`role=\"cell\"` thay vì cứng `td` khi DOM là div-based.\r\n\r\n## Issue 06: try/catch cho UI optional — khi locator có thể có hoặc không tuỳ scenario\r\n\r\n### Bối cảnh\r\n\r\n- Một số element trên trang xuất hiện không deterministic, có hoặc không tuỳ scenario:\r\n  - Banner cookie / GDPR (chỉ hiện ở context mới hoặc theo region).\r\n  - Popup khuyến mãi, modal \"Bạn có muốn nhận noti?\", interstitial ad.\r\n  - Tooltip onboarding cho user lần đầu.\r\n- Nếu hardcode `click()` cho element này → test fail khi element không hiện.\r\n- Nếu bỏ qua hoàn toàn → test fail khi element hiện và che các control khác (banner overlay block click).\r\n- Cần pattern \"click nếu có, skip nếu không\" mà không làm test flaky.\r\n\r\n### Ví dụ thực tế\r\n\r\n- Banner cookie Uniqlo:\r\n  - Mỗi Playwright context mới → cookie chưa được set → banner hiện.\r\n  - Khi `headless` chạy nhanh, banner có thể render chậm vài trăm ms sau `domcontentloaded`.\r\n  - Cần auto-dismiss trước khi chạy bất kỳ step nghiệp vụ nào, vì banner overlay che các tab Men/Women/Kids.\r\n\r\n### Cách khuyến nghị\r\n\r\n1. Wrap `waitFor` + `click` trong try/catch với timeout ngắn (1-3s):\r\n\r\n```ts\r\n// base.page.ts\r\nasync acceptCookiesIfShown(timeout = 3000): Promise<void> {\r\n  const acceptBtn = this._page.getByRole('button', { name: 'accept all' });\r\n  try {\r\n    await acceptBtn.waitFor({ state: 'visible', timeout });\r\n    await acceptBtn.click();\r\n  } catch {\r\n    // Banner không hiện trong timeout → skip silent, test đi tiếp.\r\n  }\r\n}\r\n```\r\n\r\n2. Gọi trong fixture sau navigate để tự áp dụng cho mọi test, không cần lặp code ở từng spec:\r\n\r\n```ts\r\n// fixture.ts\r\nappPage: async ({ page }, use) => {\r\n  await page.goto(AppUrl.Default);\r\n  await page.waitForLoadState('domcontentloaded');\r\n  await new BasePage(page).acceptCookiesIfShown();\r\n  await use(page);\r\n},\r\n```\r\n\r\n3. Khi DOM đã ổn định và không cần chờ thêm, có thể thay try/catch bằng API non-throwing:\r\n\r\n```ts\r\n// count() — trả về số lượng, không throw\r\nif (await acceptBtn.count() > 0) {\r\n  await acceptBtn.click();\r\n}\r\n\r\n// isVisible() — trả về boolean ngay, không chờ\r\nif (await acceptBtn.isVisible()) {\r\n  await acceptBtn.click();\r\n}\r\n```\r\n\r\nSo sánh nhanh:\r\n\r\n| Pattern | Có chờ? | Phù hợp khi |\r\n|---|---|---|\r\n| `try/catch` quanh `waitFor` | Có (timeout) | Element render chậm, lazy load, animation |\r\n| `if (await el.isVisible())` | Không | DOM đã ổn định, check tức thì |\r\n| `if (await el.count() > 0)` | Không | Cần biết tồn tại trong DOM (kể cả hidden) |\r\n\r\n### Anti-pattern (KHÔNG dùng try/catch để)\r\n\r\n1. Che lỗi assertion thật → test luôn pass dù feature hỏng:\r\n\r\n```ts\r\n// ❌ SAI\r\ntry {\r\n  await expect(homePage.btnMen).toBeVisible();\r\n} catch {}\r\n```\r\n\r\n2. \"Retry\" element flaky → nên fix bằng `waitFor` đúng state, không nuốt lỗi:\r\n\r\n```ts\r\n// ❌ SAI — che bug timing\r\ntry { await btn.click(); } catch { await btn.click(); }\r\n```\r\n\r\n3. Thay cho việc chọn locator đúng → khi selector sai mà banner vẫn hiện thật, test sẽ fail ở step sau với lỗi khó hiểu kiểu `element is intercepted by another element` hoặc `timeout waiting for click`. Lỗi xa nguồn gốc → khó debug.\r\n\r\n### Mẹo phòng thủ khi selector có thể đổi\r\n\r\n- Log nhẹ trong catch để debug nhanh khi selector lỗi thời:\r\n\r\n```ts\r\n} catch {\r\n  console.log('[cookie] banner not dismissed (not shown OR selector outdated)');\r\n}\r\n```\r\n\r\n- Dùng regex để chịu được nhiều biến thể text:\r\n\r\n```ts\r\nconst acceptBtn = this._page\r\n  .getByRole('button', { name: /accept all|agree|got it/i })\r\n  .first();\r\n```\r\n\r\n- Verify selector lần đầu bằng `npx playwright codegen <url>` rồi mới đưa vào code.\r\n\r\n### Quy tắc nhớ nhanh\r\n\r\n- try/catch chỉ dùng cho **UI optional** (xuất hiện không deterministic).\r\n- Câu hỏi tự kiểm tra mỗi khi định viết try/catch:\r\n  > \"Nếu element này KHÔNG có, test có nên pass không?\"\r\n  - Có → try/catch hoặc `isVisible()` / `count()` check.\r\n  - Không → để nó throw, đừng catch.\r\n- Selector phải đúng ngay từ đầu — try/catch không cứu được khi selector sai mà element vẫn tồn tại trên DOM.\r\n- Khi nuốt lỗi, để lại log/comment giải thích lý do để người sau không tưởng đây là bug bị che.\r\n","words":2162},{"id":"playwright-locator","title":"Playwright Locators","sub":"Locator strategy & best practices","accent":"#d97757","spec":"locators.strategy","file":"PLAYWRIGHT_LOCATOR.md","idx":4,"content":"### 1. getByRole:\r\n\r\nDưới đây là danh sách các role ARIA thường gặp khi test bằng `getByRole()` trong Playwright.  \r\nSắp xếp theo mức phổ biến *tham khảo* (ước lượng theo thực tế project, không phải thứ tự chuẩn ARIA).\r\n\r\n| Độ phổ biến | Role        | Mô tả ngắn gọn                      | Tag HTML (Implicit) / Ghi chú             |\r\n| ----------- | ----------- | ---------------------------------- | ----------------------------------------- |\r\n| 1           | button      | Nút nhấn                            | `<button>`, `<input type=\"button|submit|reset|image\">` |\r\n| 2           | link        | Liên kết điều hướng                  | `<a href>`, `<area href>`                |\r\n| 3           | textbox     | Ô nhập văn bản                       | `<input type=\"text|password|email|...\">`, `<textarea>` |\r\n| 4           | checkbox    | Hộp kiểm bật/tắt                     | `<input type=\"checkbox\">`                 |\r\n| 5           | heading     | Tiêu đề (h1-h6)                     | `<h1>`-`<h6>`                            |\r\n| 6           | img         | Hình ảnh có alt text                 | `<img>`                                  |\r\n| 7           | radio       | Nút radio                            | `<input type=\"radio\">`                    |\r\n| 8           | listbox     | Danh sách chọn                       | `<select>`, explicit `role=\"listbox\"`      |\r\n| 9           | option      | Tùy chọn trong listbox/combobox      | `<option>`, explicit `role=\"option\"`       |\r\n| 10          | list        | Danh sách                            | `<ul>`, `<ol>`                            |\r\n| 11          | listitem    | Mục trong danh sách                  | `<li>`                                    |\r\n| 12          | table       | Bảng                                 | `<table>`                                 |\r\n| 13          | row         | Hàng trong bảng                      | `<tr>`                                    |\r\n| 14          | cell        | Ô trong bảng                         | `<td>`, `<th>`                            |\r\n| 15          | combobox    | Input mở dropdown/list liên quan       | explicit `role=\"combobox\"`                |\r\n| 16          | progressbar | Thanh tiến trình                      | `<progress>`                              |\r\n| 17          | slider      | Thanh trượt                          | `<input type=\"range\">`                    |\r\n| 18          | spinbutton  | Nút xoay số (nhập số)               | `<input type=\"number\">`                   |\r\n| 19          | dialog      | Hộp thoại (modal/non-modal)          | `<dialog>`, explicit `role=\"dialog\"`      |\r\n| 20          | alert       | Thông báo cảnh báo/thời điểm khẩn cấp | explicit `role=\"alert\"`                   |\r\n| 21          | separator   | Dấu phân cách                        | `<hr>`                                    |\r\n| 22          | menu        | Menu điều hướng/phụ lệnh             | explicit `role=\"menu\"`                    |\r\n| 23          | menuitem    | Mục trong menu                       | explicit `role=\"menuitem\"`                |\r\n| 24          | tablist     | Danh sách nhóm tab                   | explicit `role=\"tablist\"`                 |\r\n| 25          | tab         | Tab trong tablist                    | explicit `role=\"tab\"`                     |\r\n| 26          | tabpanel    | Nội dung của một tab                 | explicit `role=\"tabpanel\"`                |\r\n\r\n**Lưu ý**:\r\n\r\n- Danh sách này không đầy đủ (ARIA có nhiều role hơn), đây là nhóm thường gặp nhất khi test UI.\r\n- Bạn có thể kiểm tra đầy đủ tại [ARIA Roles](https://www.w3.org/TR/wai-aria-1.1/#roles).\r\n- Độ phổ biến là tương đối theo thực tế, dự án của bạn có thể khác.\r\n- Nếu role không có implicit tag, phải gán explicit như `role=\"button\"`.\r\n- Cú pháp cơ bản: `page.getByRole('button', { name: 'Submit' })`. Có thể thêm `exact: true`, `checked`, `disabled`, `expanded`...\r\n\r\n### 2. getByText:\r\n\r\nTìm phần tử dựa trên văn bản hiển thị (visible text) trên trang. Phù hợp cho các phần tử không có role rõ ràng nhưng có text.\r\n\r\n- **Ví dụ**: `page.getByText('Submit')` – Tìm phần tử có text \"Submit\".\r\n- **Lưu ý**: Có thể thêm `exact: true` để khớp chính xác.\r\n- Có thể lọc text trong một locator cha bằng `filter({ hasText: 'Submit' })`.\r\n\r\n### 3. getByLabel:\r\n\r\nTìm phần tử form dựa trên text của label liên kết (thông qua `<label>` hoặc `aria-labelledby`).\r\n\r\n- **Ví dụ**: `page.getByLabel('Username')` – Tìm input có label \"Username\".\r\n- **Lưu ý**: Phù hợp cho accessibility, tự động liên kết với input.\r\n\r\n### 4. getByPlaceholder:\r\n\r\nTìm phần tử input dựa trên placeholder text.\r\n\r\n- **Ví dụ**: `page.getByPlaceholder('Enter your name')` – Tìm input có placeholder \"Enter your name\".\r\n- **Lưu ý**: Chỉ áp dụng cho phần tử có attribute `placeholder`, thường là `<input>`/`<textarea>`.\r\n\r\n### 5. getByAltText:\r\n\r\nTìm phần tử hình ảnh dựa trên alt text (cho accessibility).\r\n\r\n- **Ví dụ**: `page.getByAltText('Company Logo')` – Tìm `<img alt=\"Company Logo\">`.\r\n- **Lưu ý**: Chủ yếu dùng cho `<img>`, `<area>`, `<input type=\"image\">` hoặc phần tử có alt text tương đương.\r\n\r\n### 6. getByTitle:\r\n\r\nTìm phần tử dựa trên title attribute (tooltip text).\r\n\r\n- **Ví dụ**: `page.getByTitle('Close')` – Tìm element có `title=\"Close\"`.\r\n- **Lưu ý**: Ít phổ biến, nhưng hữu ích cho tooltips.\r\n\r\n### 7. getByTestId:\r\n\r\nTìm phần tử dựa trên custom data attribute, thường là `data-testid` (khuyến nghị cho testing).\r\n\r\n- **Ví dụ**: `page.getByTestId('submit-button')` – Tìm element có `data-testid=\"submit-button\"`.\r\n- **Lưu ý**: Thường ổn định hơn khi UI/layout hay text thay đổi.\r\n\r\n### 8. Bảng detect nhanh cho các getBy còn lại\r\n\r\n| Locator     | Dấu hiệu nhận diện | Khi nên dùng | Ví dụ |\r\n| ----------- | ------------------ | ------------ | ----- |\r\n| getByText   | Có text hiển thị trên màn hình | Phần tử không có role rõ ràng, hoặc nhanh nhất để đọc được nội dung | `page.getByText('Dashboard')` |\r\n| getByLabel  | Có `<label>` gán cho control | Input/select/textarea theo chuẩn form accessibly | `page.getByLabel('Password')` |\r\n| getByPlaceholder | Có `placeholder` text ổn định | Dùng khi chưa có id/testid ổn định | `page.getByPlaceholder('Search users')` |\r\n| getByAltText | Có alt text rõ ràng | Hình ảnh, icon hoặc media | `page.getByAltText('Company Logo')` |\r\n| getByTitle | Có `title` attribute | Tooltip hoặc text hover được đặt bằng title | `page.getByTitle('Close')` |\r\n| getByTestId | Có `data-testid` hoặc custom attribute | Thành phần thay đổi text/DOM, muốn selector bền vững | `page.getByTestId('login-submit')` |\r\n","words":893},{"id":"jenkins","title":"CI/CD Jenkins","sub":"Pipeline, Docker, agent setup","accent":"#6a9bcc","spec":"cicd.pipeline","file":"CICD_Jenkins_knowledge.md","idx":5,"content":"# CI/CD with Jenkins - Knowledge Base\n\n## General\n\n### What is CI/CD for Automation Testing?\n\nCI/CD (Continuous Integration / Continuous Delivery) for automation testing means tests are triggered automatically through a pipeline instead of being run manually on a developer's machine. Jenkins acts as the orchestrator — it watches for triggers, pulls code, and executes tests in a controlled environment.\n\n### Flow\n\n```\nTester triggers job on Jenkins\n        ↓\nJenkins pulls latest code from GitHub\n        ↓\nJenkins reads Jenkinsfile (pipeline definition)\n        ↓\nJenkins spins up Docker container (Playwright image)\n        ↓\nTests run inside container against target environment\n        ↓\nResults published as HTML report in Jenkins UI\n        ↓\nContainer cleaned up\n```\n\n### Promotion Flow (QA → Staging)\n\nTests are not automatically promoted. The tester manually controls the flow:\n\n1. Trigger job → select **QA** environment → tests pass\n2. Trigger job again → select **Staging** environment → tests pass\n3. Only then is the build considered ready for production\n\nThis is a **manual promotion flow** — simple and appropriate for teams starting out with CI/CD.\n\n### Key Files (2 layers)\n\n| Layer | File | Role |\n|---|---|---|\n| **Jenkins server** | `docker_ci_cd/Dockerfile` | Custom Jenkins image + Docker CLI + Compose plugin |\n| **Jenkins server** | `docker_ci_cd/docker-compose.yaml` | Run Jenkins container, persist data, mount Docker socket |\n| **Test repo (root)** | `Jenkinsfile` | Pipeline definition — stages, parameters, post actions |\n| **Test repo (root)** | `docker-compose.yml` | Spin up Playwright container, pass env vars, run tests |\n| **Test repo (root)** | `playwright.config.ts` | Reads `BASE_URL` from env; browser selected via CLI `--project` |\n| **Test repo (root)** | `package.json` + `package-lock.json` | Dependencies; `npm ci` in container requires lock file |\n| **Test repo (root)** | `.dockerignore` | Exclude `node_modules`, reports from Docker context (if build) |\n\n---\n\n## Jenkinsfile — giải thích từng block (file: `Jenkinsfile`)\n\n```\npipeline { ... }          ← Khai báo Declarative Pipeline\nagent any                 ← Chạy trên bất kỳ Jenkins agent nào (có Docker CLI)\nparameters { ... }        ← Build with Parameters: ENVIRONMENT, BROWSER\nenvironment { ... }       ← Map param → BASE_URL, BROWSER env vars\noptions { ... }           ← Timeout 30 phút, giữ 20 build log, timestamps\nstages { ... }            ← Các bước chính\npost { ... }              ← Luôn chạy cleanup sau toàn pipeline\n```\n\n### Stage 1: `Checkout`\n\n```groovy\ncheckout scm\n```\n\n- Jenkins clone/pull **Git repo** (repo chứa `Jenkinsfile` này) vào workspace.\n- Job phải cấu hình **Pipeline from SCM** trỏ đúng branch + path `Jenkinsfile`.\n\n### Stage 2: `Run Tests`\n\n```groovy\nsh 'docker compose up --abort-on-container-exit --exit-code-from playwright-tests'\n```\n\n| Flag | Ý nghĩa |\n|---|---|\n| `docker compose up` | Đọc `docker-compose.yml` ở workspace root |\n| `--abort-on-container-exit` | Container test xong → dừng các service còn lại |\n| `--exit-code-from playwright-tests` | Exit code của pipeline = exit code test container (pass/fail) |\n\n**Post (always)** trong stage này:\n\n- `publishHTML` → hiển thị `playwright-report/index.html` trên Jenkins UI (cần plugin **HTML Publisher**).\n- `archiveArtifacts` → lưu report + `test-results/` (screenshot, trace, video on failure).\n\n### Post pipeline (always)\n\n```groovy\nsh 'docker compose down --volumes'\n```\n\n- Dọn container + anonymous volumes sau mỗi build (tránh rác Docker trên agent).\n\n---\n\n## Jenkins Job — cấu hình cần thiết (1 lần trên UI)\n\n1. **New Item** → **Pipeline**\n2. **Pipeline** → Definition: **Pipeline script from SCM**\n3. **SCM**: Git → URL repo → credentials → branch (`main` / `master`)\n4. **Script Path**: `Jenkinsfile`\n5. **Bỏ chọn** *Lightweight checkout* (tránh lỗi `not in a git directory`)\n6. Cài plugin: **HTML Publisher**, **Pipeline**, **Git**\n7. Build lần 1 (default params) → từ build 2 dùng **Build with Parameters**\n\n---\n\n## Luồng end-to-end (dùng file trong repo này)\n\n```\n[1] docker_ci_cd/\n    docker compose up -d --build     → Jenkins server chạy :8080\n\n[2] Jenkins UI → tạo Pipeline job → trỏ Git repo test\n\n[3] Build with Parameters\n    ENVIRONMENT=QA, BROWSER=chromium\n\n[4] Jenkinsfile:\n    Checkout → set BASE_URL → docker compose up (test repo)\n\n[5] docker-compose.yml:\n    playwright-tests container → npm ci → npx playwright test\n\n[6] playwright-report/ → publishHTML + archiveArtifacts\n\n[7] post: docker compose down --volumes\n```\n\n### How Parameters Work\n\n```groovy\nparameters {\n    choice(name: 'ENVIRONMENT', choices: ['QA', 'Staging'])\n    choice(name: 'BROWSER', choices: ['chromium', 'firefox', 'webkit'])\n}\n```\n\n- First build: runs automatically with default values (no prompt)\n- From build 2 onward: Jenkins shows \"Build with Parameters\" dialog\n\n### How ENV Vars Flow from Jenkins → Docker → Playwright\n\n```\nJenkinsfile (environment block)\n    BASE_URL = QA ? 'https://...' : 'https://...'\n        ↓\nJenkins exports to shell environment\n        ↓\ndocker-compose.yml picks up via ${BASE_URL:-default}\n        ↓\nContainer receives BASE_URL as environment variable\n        ↓\nplaywright.config.ts reads process.env.BASE_URL\n```\n\n### Docker Socket Mount (local only)\n\nJenkins runs inside a Docker container but needs to run `docker compose` to spin up Playwright. The solution is to mount the host's Docker socket into the Jenkins container:\n\n```yaml\nvolumes:\n  - /var/run/docker.sock:/var/run/docker.sock\n```\n\nThis lets Jenkins talk to the host Docker daemon — containers Jenkins spawns appear on the host, not nested inside Jenkins container. This is a **local-only workaround**. On a real VM, Jenkins is installed directly on the OS and Docker CLI is available natively.\n\n---\n\n## Errors Encountered\n\n### 1. `fatal: not in a git directory` (Lightweight Checkout)\n\n**When**: First attempt to run pipeline after creating job.\n\n**Cause**: Jenkins uses \"Lightweight checkout\" by default — tries to read the Jenkinsfile without fully cloning the repo first. In a fresh workspace with no git repo initialized, this fails.\n\n**Fix**: Uncheck **Lightweight checkout** in job configuration → Pipeline section.\n\n---\n\n### 2. `fatal: detected dubious ownership in repository`\n\n**When**: After disabling Lightweight checkout, on Windows with Jenkins in Docker.\n\n**Cause**: Git 2.35+ security feature rejects running in directories owned by a different user. On Windows, files mounted into Docker containers via WSL2 report mismatched ownership.\n\n**Fix**: Set `safe.directory = *` via Git environment variables in `docker-compose.yml`:\n\n```yaml\nenvironment:\n  - GIT_CONFIG_COUNT=1\n  - GIT_CONFIG_KEY_0=safe.directory\n  - GIT_CONFIG_VALUE_0=*\n```\n\nThis is persistent across container restarts. Running `git config --global` inside the container is lost on restart.\n\n**Note**: This issue only occurs on local Windows + Docker setup. On a Linux VM, ownership is consistent and this error never appears.\n\n---\n\n### 3. `docker: not found`\n\n**When**: Pipeline reached the `docker compose up` step.\n\n**Cause**: The official `jenkins/jenkins:lts-jdk21` image does not include Docker CLI. Jenkins container cannot run `docker compose` without it.\n\n**Fix**: Create a custom Dockerfile that installs Docker CLI on top of the Jenkins base image:\n\n```dockerfile\nFROM jenkins/jenkins:lts-jdk21\n\nUSER root\n\nRUN apt-get update && \\\n    apt-get install -y docker.io curl && \\\n    mkdir -p /usr/local/lib/docker/cli-plugins && \\\n    curl -SL \"https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64\" \\\n         -o /usr/local/lib/docker/cli-plugins/docker-compose && \\\n    chmod +x /usr/local/lib/docker/cli-plugins/docker-compose && \\\n    rm -rf /var/lib/apt/lists/*\n\nUSER jenkins\n```\n\nUpdate `docker-compose.yml` to use `build: .` instead of `image: jenkins/jenkins:lts-jdk21`.\n\nBuild with: `docker compose up -d --build` (only needed when Dockerfile changes).\n\n**Note**: On a real Jenkins VM, Docker CLI is installed directly on the OS — no Dockerfile needed.\n\n---\n\n### 4. `E: Unable to locate package docker-compose-plugin`\n\n**When**: Building the custom Dockerfile.\n\n**Cause**: `docker-compose-plugin` is published by Docker Inc in their own apt repository, not in Debian's default repos. The Jenkins base image uses Debian trixie which does not include this package.\n\n**Fix**: Download the Docker Compose v2 binary directly from GitHub releases instead of using apt:\n\n```dockerfile\ncurl -SL \"https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64\" \\\n     -o /usr/local/lib/docker/cli-plugins/docker-compose\nchmod +x /usr/local/lib/docker/cli-plugins/docker-compose\n```\n\n**Why the binary approach**: `docker compose` (space, v2) runs as a Docker CLI plugin. The binary must be placed in `/usr/local/lib/docker/cli-plugins/`. The Jenkinsfile uses `docker compose` syntax (v2), so v1 `docker-compose` (hyphen) is not a valid substitute without changing the Jenkinsfile.\n\n---\n\n### 5. `No such DSL method 'publishHTML'`\n\n**When**: Post stage tried to publish the Playwright HTML report.\n\n**Cause**: `publishHTML(...)` is provided by the **HTML Publisher** plugin, which is not installed by default in Jenkins.\n\n**Fix**: Manage Jenkins → Plugins → Available plugins → search **HTML Publisher** → Install → Restart Jenkins.\n\n---\n\n### 6. Invalid username or password after container restart\n\n**When**: After `docker compose down && docker compose up -d` to apply new config.\n\n**Cause**: Previously, Jenkins data (users, jobs, config) was stored inside the container's internal filesystem — not in the bind-mounted volume. When `docker compose down` removed the container, all data was lost. The new container started as a fresh Jenkins instance.\n\n**Fix (recovery)**: Temporarily disable security by editing `config.xml` on the host:\n\n```bash\nsed -i 's/<useSecurity>true<\\/useSecurity>/<useSecurity>false<\\/useSecurity>/' \\\n  ./volumes/master/config.xml\ndocker restart docker_ci_cd-jenkins-1\n# Then go to Jenkins UI → Manage Jenkins → Security → re-enable and set new password\n```\n\n**Prevention**: Ensure `./volumes/master:/var/jenkins_home` is mounted before the first Jenkins setup. All data written after that point is persisted on the host and survives container recreation.\n\n---\n\n## Setup review (repo hiện tại)\n\n### Đúng / đã có\n\n| Item | Status |\n|---|---|\n| `Jenkinsfile` declarative pipeline với parameters | OK |\n| Env flow: Jenkins → `BASE_URL`/`BROWSER` → docker-compose → Playwright | OK |\n| Playwright official image `v1.59.1-jammy` khớp `@playwright/test` | OK |\n| `npm ci` + `package-lock.json` | OK |\n| Report publish + archive artifacts | OK |\n| Jenkins Dockerfile cài Docker CLI + Compose v2 plugin | OK |\n| Git `safe.directory` trong Jenkins compose | OK |\n| `.dockerignore` loại trừ report/node_modules | OK |\n\n### Đã sửa\n\n| Item | Fix |\n|---|---|\n| `docker_ci_cd/docker-compose.yaml` volume | Đổi thành `./volumes/master:/var/jenkins_home` (persist Jenkins data trên host) |\n\n### Cần lưu ý / có thể bổ sung sau\n\n| Item | Ghi chú |\n|---|---|\n| `tests/auth/auth.setup.ts` đang comment hết | E2E projects phụ thuộc `setup` + `storageState` — CI có thể fail hoặc chạy như guest; cần bật lại setup + Jenkins credentials `UNIQLO_USER`/`UNIQLO_PASS` |\n| `tests/auth/.auth/user.json` = `{}` | Storage state rỗng cho đến khi auth setup chạy thành công |\n| `user: root` trong Jenkins compose | Chạy được với docker.sock; production nên dùng group `docker` + user `jenkins` |\n| Plugin **HTML Publisher** | Phải cài thủ công trên Jenkins UI |\n| `BROWSER=all` | Chạy mọi project kể cả `api` — nếu chỉ muốn UI: đổi command thành `--project=chromium --project=firefox --project=webkit` |\n| Secrets | Thêm Jenkins Credentials cho login/env nhạy cảm thay vì hardcode trong Jenkinsfile |\n","words":1704},{"id":"ci-flows","title":"CI Flows Diagram","sub":"Docker build + Jenkinsfile — sơ đồ từng bước","accent":"#788c5d","spec":"ci.flows.diagram","file":"CI_FLOWS.html","rawHtml":true,"idx":6,"content":"<style>\n.ci-flows {\n  --ground: #0d141c;\n  --panel: #141d28;\n  --panel-2: #0a1017;\n  --ink: #e6edf3;\n  --muted: #8fa3b5;\n  --faint: #63768a;\n  --hair: #26333f;\n  --a: #4aa8ff;\n  --a-soft: rgba(74,168,255,.13);\n  --b: #ff6b4a;\n  --b-soft: rgba(255,107,74,.13);\n  --good: #56d364;\n  --cf-mono: ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace;\n  --cf-sans: system-ui, -apple-system, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n\n  background:\n    radial-gradient(1000px 500px at 12% -5%, rgba(74,168,255,.07), transparent 60%),\n    radial-gradient(900px 520px at 96% 0%, rgba(255,107,74,.06), transparent 55%),\n    var(--ground);\n  color: var(--ink);\n  font-family: var(--cf-sans);\n  line-height: 1.6;\n  border: 1px solid var(--hair);\n  border-radius: 16px;\n  padding: 32px 30px 38px;\n  margin: 4px 0;\n}\n.ci-flows * { box-sizing: border-box; }\n\n.ci-flows .cf-eyebrow {\n  font-family: var(--cf-mono);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--faint);\n  margin: 0 0 12px;\n}\n.ci-flows .cf-lede {\n  color: var(--muted);\n  font-size: 16px;\n  max-width: 68ch;\n  margin: 0 0 24px;\n}\n.ci-flows .cf-lede b { color: var(--ink); font-weight: 600; }\n\n/* relationship strip */\n.ci-flows .bridge {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 12px;\n  padding: 15px 18px;\n  background: var(--panel);\n  border: 1px solid var(--hair);\n  border-radius: 14px;\n  margin-bottom: 34px;\n}\n.ci-flows .bridge .chip { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); }\n.ci-flows .bridge .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }\n.ci-flows .bridge .dot.a { background: var(--a); box-shadow: 0 0 0 4px var(--a-soft); }\n.ci-flows .bridge .dot.b { background: var(--b); box-shadow: 0 0 0 4px var(--b-soft); }\n.ci-flows .bridge .arrow { color: var(--faint); font-family: var(--cf-mono); }\n.ci-flows .bridge .key {\n  margin-left: auto;\n  font-family: var(--cf-mono);\n  font-size: 12.5px;\n  color: var(--muted);\n  background: var(--panel-2);\n  border: 1px solid var(--hair);\n  padding: 8px 12px;\n  border-radius: 8px;\n  line-height: 1.5;\n}\n.ci-flows .bridge .key b { color: var(--good); font-weight: 600; }\n\n/* flow section */\n.ci-flows .flow { margin-bottom: 26px; }\n.ci-flows .flow--a { --accent: var(--a); --accent-soft: var(--a-soft); }\n.ci-flows .flow--b { --accent: var(--b); --accent-soft: var(--b-soft); }\n\n.ci-flows .flow__head {\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  padding: 18px 20px;\n  background: var(--panel);\n  border: 1px solid var(--hair);\n  border-left: 3px solid var(--accent);\n  border-radius: 14px 14px 0 0;\n  border-bottom: none;\n}\n.ci-flows .flow__badge {\n  width: 46px; height: 46px; flex: none;\n  display: grid; place-items: center;\n  border-radius: 12px;\n  background: var(--accent-soft);\n  border: 1.5px solid var(--accent);\n  color: var(--accent);\n  font-family: var(--cf-mono);\n  font-weight: 700;\n  font-size: 22px;\n}\n.ci-flows .flow__t { min-width: 0; }\n.ci-flows .flow__t .name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }\n.ci-flows .flow__t .goal { margin-top: 3px; color: var(--muted); font-size: 14px; }\n.ci-flows .flow__src { margin-left: auto; display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }\n.ci-flows .flow__src .f {\n  font-family: var(--cf-mono);\n  font-size: 12px;\n  color: var(--ink);\n  background: var(--panel-2);\n  border: 1px solid var(--hair);\n  padding: 5px 9px;\n  border-radius: 7px;\n  white-space: nowrap;\n}\n\n.ci-flows .flow__body {\n  background: var(--panel);\n  border: 1px solid var(--hair);\n  border-top: none;\n  border-radius: 0 0 14px 14px;\n  padding: 24px 22px 28px;\n}\n\n/* steps */\n.ci-flows .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }\n.ci-flows .step { display: grid; grid-template-columns: 52px 1fr; gap: 20px; margin: 0; }\n.ci-flows .lane { position: relative; display: flex; justify-content: center; }\n.ci-flows .node {\n  width: 40px; height: 40px; flex: none;\n  margin-top: 3px;\n  display: grid; place-items: center;\n  border-radius: 50%;\n  background: var(--accent-soft);\n  border: 2px solid var(--accent);\n  color: var(--accent);\n  font-family: var(--cf-mono);\n  font-weight: 700;\n  font-size: 15px;\n  z-index: 1;\n}\n.ci-flows .step:not(:last-child) .lane::after {\n  content: \"\";\n  position: absolute;\n  top: 47px; bottom: -16px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 2px;\n  background: linear-gradient(180deg, var(--accent), var(--hair) 85%);\n  opacity: .5;\n}\n\n.ci-flows .card { min-width: 0; }\n.ci-flows .card__head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }\n.ci-flows .card__head .h { font-size: 16.5px; font-weight: 650; letter-spacing: -.005em; color: var(--ink); }\n.ci-flows .card p { margin: 0; color: var(--muted); font-size: 14.5px; }\n.ci-flows .card p + p { margin-top: 8px; }\n.ci-flows .card p b { color: var(--ink); font-weight: 600; }\n.ci-flows .card .why { color: var(--faint); }\n.ci-flows .card .why::before { content: \"→ \"; color: var(--accent); }\n\n/* code snippet (real source) */\n.ci-flows .snip {\n  margin: 12px 0 0;\n  background: var(--panel-2);\n  border: 1px solid var(--hair);\n  border-radius: 9px;\n  overflow: hidden;\n}\n.ci-flows .snip__file {\n  font-family: var(--cf-mono);\n  font-size: 11px;\n  letter-spacing: .03em;\n  color: var(--accent);\n  padding: 7px 13px;\n  border-bottom: 1px solid var(--hair);\n  background: var(--accent-soft);\n}\n.ci-flows .snip pre { margin: 0; padding: 12px 14px; overflow-x: auto; }\n.ci-flows .snip code {\n  font-family: var(--cf-mono);\n  font-size: 12.5px;\n  line-height: 1.7;\n  color: #ccd6e0;\n  white-space: pre;\n  display: block;\n  background: none; border: none; padding: 0;\n}\n.ci-flows .snip .kw { color: var(--accent); }\n.ci-flows .snip .cm { color: var(--faint); }\n\n/* terminal command */\n.ci-flows .term {\n  margin: 12px 0 0;\n  background: var(--panel-2);\n  border: 1px solid var(--hair);\n  border-radius: 9px;\n  padding: 11px 14px;\n  overflow-x: auto;\n}\n.ci-flows .term code {\n  font-family: var(--cf-mono);\n  font-size: 13px;\n  color: #d7e3ef;\n  white-space: pre;\n  display: block;\n  background: none; padding: 0; border: none;\n}\n.ci-flows .term .p { color: var(--accent); user-select: none; }\n\n.ci-flows .cf-foot {\n  margin-top: 28px;\n  padding-top: 18px;\n  border-top: 1px solid var(--hair);\n  color: var(--faint);\n  font-size: 12.5px;\n  font-family: var(--cf-mono);\n}\n\n@media (max-width: 720px) {\n  .ci-flows { padding: 22px 16px 26px; }\n  .ci-flows .flow__head { flex-wrap: wrap; }\n  .ci-flows .flow__src { margin-left: 0; justify-content: flex-start; width: 100%; }\n  .ci-flows .bridge .key { margin-left: 0; }\n  .ci-flows .step { grid-template-columns: 40px 1fr; gap: 14px; }\n  .ci-flows .node { width: 34px; height: 34px; font-size: 13px; }\n  .ci-flows .step:not(:last-child) .lane::after { top: 40px; }\n}\n</style>\n\n<div class=\"ci-flows\">\n  <p class=\"cf-eyebrow\">Docker · Jenkins · step-by-step</p>\n  <p class=\"cf-lede\">\n    Repo có hai đường CI tách biệt: <b style=\"color:var(--a)\">Flow A</b> dựng chính máy chủ Jenkins bằng Docker,\n    và <b style=\"color:var(--b)\">Flow B</b> là pipeline chạy test mỗi lần có job. Mỗi bước ở cột trái đi kèm đoạn\n    code thật ngay bên phải — không cần mở file nguồn để đối chiếu.\n  </p>\n\n  <div class=\"bridge\">\n    <span class=\"chip\"><span class=\"dot a\"></span> Flow A — Build Jenkins host (image)</span>\n    <span class=\"arrow\">──▶</span>\n    <span class=\"chip\"><span class=\"dot b\"></span> Flow B — Pipeline chạy trên host đó</span>\n    <span class=\"key\">Mấu chốt nối 2 flow: volume <b>/var/run/docker.sock</b> ở A4<br>cho phép lệnh <b>docker&nbsp;compose&nbsp;up</b> ở B5 chạy được.</span>\n  </div>\n\n  <!-- FLOW A -->\n  <section class=\"flow flow--a\">\n    <div class=\"flow__head\">\n      <div class=\"flow__badge\">A</div>\n      <div class=\"flow__t\">\n        <div class=\"name\">Dockerfile → Docker image → Jenkins container</div>\n        <div class=\"goal\">Mục tiêu: một Jenkins controller chạy trong Docker, tự gọi được <code>docker compose</code>.</div>\n      </div>\n      <div class=\"flow__src\">\n        <span class=\"f\">docker_ci_cd/Dockerfile</span>\n        <span class=\"f\">docker_ci_cd/docker-compose.yaml</span>\n      </div>\n    </div>\n    <div class=\"flow__body\">\n      <ol class=\"steps\">\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">1</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Base image</span></div>\n            <p>Lấy image Jenkins LTS kèm sẵn JDK 21 làm nền. Đã có Jenkins server hoàn chỉnh, ta chỉ bổ sung công cụ còn thiếu.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Dockerfile</div><pre><code><span class=\"kw\">FROM</span> jenkins/jenkins:lts-jdk21</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">2</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Cài Docker CLI + Compose</span></div>\n            <p>Chuyển sang <b>root</b> để cài <b>docker.io + curl</b>, tải <b>docker-compose v2.24.0</b> về làm CLI plugin, cấp quyền chạy, rồi xoá cache apt cho nhẹ image.</p>\n            <p class=\"why\">Bước then chốt: Jenkins sẽ cần gọi <b>docker compose</b> để chạy test ở Flow B.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Dockerfile</div><pre><code><span class=\"kw\">USER</span> root\n<span class=\"kw\">RUN</span> apt-get update &amp;&amp; \\\n    apt-get install -y docker.io curl &amp;&amp; \\\n    mkdir -p /usr/local/lib/docker/cli-plugins &amp;&amp; \\\n    curl -SL \"https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64\" \\\n         -o /usr/local/lib/docker/cli-plugins/docker-compose &amp;&amp; \\\n    chmod +x /usr/local/lib/docker/cli-plugins/docker-compose &amp;&amp; \\\n    rm -rf /var/lib/apt/lists/*</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">3</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Hạ quyền</span></div>\n            <p>Trả lại user thường sau khi cài xong. Không để Jenkins chạy bằng root, thu hẹp rủi ro bảo mật.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Dockerfile</div><pre><code><span class=\"kw\">USER</span> jenkins</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">4</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Khai báo service</span></div>\n            <p><b>build: .</b> dựng image từ Dockerfile. Port <b>8080</b> (web UI) và <b>50000</b> (kết nối agent). Volume <b>/var/jenkins_home</b> giữ dữ liệu qua mỗi lần restart; <b>/var/run/docker.sock</b> cho container điều khiển Docker của host (Docker-outside-of-Docker).</p>\n            <p class=\"why\">Chính socket này là cầu nối để Flow B chạy được container test.</p>\n            <div class=\"snip\"><div class=\"snip__file\">docker_ci_cd/docker-compose.yaml</div><pre><code>services:\n  jenkins:\n    build: .\n    user: root\n    ports:\n      - \"0.0.0.0:8080:8080\"\n      - \"0.0.0.0:50000:50000\"\n    volumes:\n      - /var/jenkins_home:/var/jenkins_home\n      - /var/run/docker.sock:/var/run/docker.sock\n    environment:\n      - GIT_CONFIG_COUNT=1\n      - GIT_CONFIG_KEY_0=safe.directory\n      - GIT_CONFIG_VALUE_0=*\n    restart: unless-stopped</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">5</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Build &amp; khởi động</span></div>\n            <p>Compose build image (nếu chưa có) rồi tạo và chạy container Jenkins.</p>\n            <div class=\"term\"><code><span class=\"p\">$</span> docker compose up --build -d</code></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">6</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Jenkins sẵn sàng</span></div>\n            <p>Giờ có một <b>Jenkins controller chạy trong Docker</b>, tự gọi được <b>docker</b> / <b>docker compose</b> — đúng môi trường mà Flow B cần. Truy cập web UI để cấu hình job.</p>\n            <div class=\"term\"><code><span class=\"p\">$</span> open http://localhost:8080</code></div>\n          </div>\n        </li>\n      </ol>\n    </div>\n  </section>\n\n  <!-- FLOW B -->\n  <section class=\"flow flow--b\">\n    <div class=\"flow__head\">\n      <div class=\"flow__badge\">B</div>\n      <div class=\"flow__t\">\n        <div class=\"name\">Jenkinsfile → job SCM chạy trên Jenkins</div>\n        <div class=\"goal\">Mục tiêu: mỗi job kéo code, chạy Playwright trong container, xuất report, dọn dẹp.</div>\n      </div>\n      <div class=\"flow__src\">\n        <span class=\"f\">Jenkinsfile</span>\n        <span class=\"f\">docker-compose.yml (gốc repo)</span>\n      </div>\n    </div>\n    <div class=\"flow__body\">\n      <ol class=\"steps\">\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">1</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Tham số job</span></div>\n            <p>Khi bấm Build, pipeline hỏi 2 lựa chọn: <b>ENVIRONMENT</b> và <b>BROWSER</b>.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · parameters</div><pre><code><span class=\"kw\">parameters</span> {\n    choice(name: 'ENVIRONMENT', choices: ['QA', 'Staging'],\n           description: 'Select environment to run tests against')\n    choice(name: 'BROWSER',\n           choices: ['chromium', 'firefox', 'webkit', 'All Browsers'],\n           description: 'Select browser (\"All Browsers\" = run on all 3)')\n}</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">2</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Suy ra biến môi trường</span></div>\n            <p><b>BASE_URL</b> tính từ ENVIRONMENT (QA → site UK, Staging → site VN); <b>BROWSER</b> = <b>all</b> nếu chọn All Browsers.</p>\n            <p class=\"why\">Hai biến này được truyền xuống container test ở bước 5.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · environment</div><pre><code><span class=\"kw\">environment</span> {\n    BASE_URL = \"${params.ENVIRONMENT == 'QA'\n        ? 'https://www.uniqlo.com/uk/en/'\n        : 'https://www.uniqlo.com/vn/en/'}\"\n    BROWSER  = \"${params.BROWSER == 'All Browsers' ? 'all' : params.BROWSER}\"\n}</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">3</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Options</span></div>\n            <p><b>timestamps()</b> gắn giờ vào log; <b>timeout 30 phút</b> để job không treo; <b>buildDiscarder</b> chỉ giữ 20 build gần nhất.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · options</div><pre><code><span class=\"kw\">options</span> {\n    timestamps()\n    timeout(time: 30, unit: 'MINUTES')\n    buildDiscarder(logRotator(numToKeepStr: '20'))\n}</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">4</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Stage: Checkout</span></div>\n            <p><b>checkout scm</b> kéo đúng branch/commit mà job được cấu hình trỏ tới (SCM = repo này).</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · stages</div><pre><code><span class=\"kw\">stage</span>('Checkout') {\n    steps {\n        checkout scm\n    }\n}</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">5</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Stage: Run Tests</span></div>\n            <p>Compose (dùng <b>docker-compose.yml</b> ở gốc repo) dựng service <b>playwright-tests</b>, chạy suite vào <b>BASE_URL</b> với <b>BROWSER</b> đã chọn. <b>--exit-code-from</b> lấy mã thoát của container test làm kết quả stage.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · stages</div><pre><code><span class=\"kw\">stage</span>('Run Tests') {\n    steps {\n        echo \"Environment: ${params.ENVIRONMENT} | URL: ${env.BASE_URL}\"\n        sh 'docker compose up --abort-on-container-exit \\\n                --exit-code-from playwright-tests'\n    }\n}</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">6</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Lưu kết quả</span></div>\n            <p><b>post → always</b> của stage: <b>publishHTML</b> gắn Playwright report vào build; <b>archiveArtifacts</b> lưu report + test-results để tải về. Chạy dù pass hay fail.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · post (Run Tests)</div><pre><code><span class=\"kw\">post</span> {\n    always {\n        publishHTML(target: [\n            reportName : \"Playwright - ${params.ENVIRONMENT}\",\n            reportDir  : 'playwright-report',\n            reportFiles: 'index.html',\n            keepAll    : true\n        ])\n        archiveArtifacts(\n            artifacts        : 'playwright-report/**/*,test-results/**/*',\n            allowEmptyArchive: true\n        )\n    }\n}</code></pre></div>\n          </div>\n        </li>\n        <li class=\"step\">\n          <div class=\"lane\"><span class=\"node\">7</span></div>\n          <div class=\"card\">\n            <div class=\"card__head\"><span class=\"h\">Dọn dẹp &amp; báo cáo</span></div>\n            <p><b>post → always</b> của pipeline: <b>docker compose down --volumes</b> gỡ container + volume, tránh rác giữa các lần chạy. Sau đó in PASSED / FAILED.</p>\n            <div class=\"snip\"><div class=\"snip__file\">Jenkinsfile · post (pipeline)</div><pre><code><span class=\"kw\">post</span> {\n    always  { sh 'docker compose down --volumes' }\n    success { echo \"PASSED on ${params.ENVIRONMENT} (${params.BROWSER})\" }\n    failure { echo \"FAILED on ${params.ENVIRONMENT} (${params.BROWSER})\" }\n}</code></pre></div>\n          </div>\n        </li>\n      </ol>\n    </div>\n  </section>\n\n  <div class=\"cf-foot\">Nguồn: Dockerfile · docker-compose.yaml · Jenkinsfile — trích nguyên văn từ repo tại thời điểm dựng sơ đồ.</div>\n</div>\n","words":0},{"id":"js-study","title":"JS Study Guide","sub":"Async, closures, this, OOP, event loop, TS","accent":"#d97757","spec":"javascript.guide","file":"js_study_guide.md","idx":7,"content":"# JavaScript Study Guide for QA Automation\n\n> Mục tiêu: ôn JS đủ sâu để pass interview QA Automation (Middle).\n> Format mỗi topic: **Mental Model → Code (Playwright/TS context) → Interview Q&A → Output-Prediction Quiz → Gotcha**.\n> Strategy: code-first, predict trước khi run, focus vào pitfall mà interviewer thực sự hỏi.\n\n---\n\n## TIER 1 — Critical (must master)\n\n---\n\n## A. Async / Promise / `await`\n\n### Mental model\n\nJavaScript là **single-threaded** với **event loop**. \"Async\" KHÔNG phải multi-thread — là cách lên lịch task tới lượt qua **task queues**.\n\n- **Call stack:** chỗ code đang chạy.\n- **Microtask queue:** Promise callbacks, `queueMicrotask`. Ưu tiên CAO.\n- **Macrotask queue:** `setTimeout`, I/O, UI render. Ưu tiên THẤP hơn.\n\nEvent loop: chạy task hiện tại → flush HẾT microtask queue → chạy 1 macrotask → flush microtask → lặp.\n\n`Promise` có 3 state: `pending` → `fulfilled` hoặc `rejected`. `await` **pause execution của async function** cho đến khi promise settle, KHÔNG block main thread.\n\n> [!IMPORTANT]\n> `async function` LUÔN return Promise. Return `42` → Promise resolved 42. Throw → Promise rejected.\n\n### Code (Playwright context)\n\n```ts\n// ❌ Forgot await — test pass nhưng KHÔNG verify\ntest('flaky', async ({ page }) => {\n  page.click('button');                  // dangling promise\n  expect(page).toHaveURL('/done');       // race condition\n});\n\n// ✅ Correct\ntest('correct', async ({ page }) => {\n  await page.click('button');\n  await expect(page).toHaveURL('/done');\n});\n\n// Parallel — 3 API call cùng lúc, tổng time = max thay vì sum\nconst [users, products, orders] = await Promise.all([\n  api.users.list(),\n  api.products.list(),\n  api.orders.list(),\n]);\n\n// Sequential — phải dùng khi step sau cần data của step trước\nfor (const id of orderIds) {\n  await api.orders.refund(id);  // tránh refund cùng lúc gây race condition\n}\n\n// allSettled — không bao giờ throw, useful khi muốn xem từng cái thắng/thua\nconst results = await Promise.allSettled(orderIds.map((id) => api.orders.refund(id)));\nconst failed = results.filter((r) => r.status === 'rejected');\n```\n\n### Interview Q&A\n\n**Q1: `Promise.all` vs `Promise.allSettled` vs `Promise.race`?**\n\n- `all`: 1 reject → toàn bộ reject NGAY. Resolved → array kết quả.\n- `allSettled`: chờ TẤT CẢ settle (kể cả fail). Return `[{status, value}|{status, reason}]`. Không bao giờ reject.\n- `race`: trả về promise đầu tiên settle (resolve hoặc reject).\n- `any` (ES2021): trả về promise đầu tiên RESOLVE (bỏ qua reject). Reject chỉ khi tất cả fail.\n\n**Q2: Microtask vs macrotask?**\n\nMicrotask (Promise) chạy NGAY khi task hiện tại xong, TRƯỚC macrotask kế tiếp. Macrotask = `setTimeout`/`setInterval`/I/O. Đây là lý do `setTimeout(fn, 0)` không phải chạy ngay — phải chờ microtask queue rỗng.\n\n**Q3: Khác biệt `await Promise.all([a(), b()])` vs `await a(); await b();`?**\n\n`Promise.all`: parallel, tổng time = `max(a, b)`. Sequential: tổng = `a + b`. Chỉ dùng sequential khi step sau **phụ thuộc** data của step trước.\n\n**Q4: Tại sao `forEach` KHÔNG hoạt động đúng với `async`?**\n\n```ts\n[1, 2, 3].forEach(async (id) => {\n  await api.delete(id);  // forEach không await callback → loop trả về NGAY\n});\n// → các delete chạy song song, không control được thứ tự\n```\n\nDùng `for...of` (sequential) hoặc `Promise.all(arr.map(...))` (parallel).\n\n**Q5: `async function` return gì?**\n\nLUÔN Promise. `return 42` → `Promise.resolve(42)`. `throw new Error()` → `Promise.reject(err)`.\n\n### Output-Prediction Quiz\n\n```js\nconsole.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nconsole.log(4);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `1, 4, 3, 2`\n\nSync code chạy trước (1, 4). Microtask (Promise.then → 3) chạy sau khi stack rỗng. Macrotask (setTimeout → 2) cuối cùng.\n\n</details>\n\n```js\nasync function foo() {\n  return 42;\n}\nconsole.log(foo());\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `Promise { 42 }` — KHÔNG phải 42. Phải `await foo()` hoặc `foo().then(console.log)` để lấy giá trị.\n\n</details>\n\n```js\nasync function test() {\n  console.log('A');\n  await Promise.resolve();\n  console.log('B');\n}\nconsole.log('1');\ntest();\nconsole.log('2');\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `1, A, 2, B`\n\n`test()` chạy đồng bộ đến `await` → log A → trả Promise (chưa resolve) → quay lại sync → log 2. Sau microtask, tiếp tục → log B.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> Quên `await` = test xanh giả. Đáng sợ nhất vì test pass nhưng KHÔNG verify gì.\n\n> [!GOTCHA]\n> `setTimeout(fn, 0)` KHÔNG chạy \"ngay lập tức\". Phải đợi microtask queue rỗng. Nếu có nhiều `.then()`, chúng chạy hết rồi mới đến `setTimeout`.\n\n> [!TIP]\n> Dấu hiệu code có vấn đề async: thấy promise nhưng không có `await` hay `.then`/`.catch`. → ESLint rule `no-floating-promises` bắt được.\n\n---\n\n## B. Closures & Scopes\n\n### Mental model\n\n**Closure** = function + lexical environment mà nó được tạo ra. Function \"nhớ\" được biến từ scope ngoài kể cả khi scope đó đã chấm dứt.\n\n**Lexical scope** = scope được xác định bởi vị trí code (nơi function được VIẾT), không phải nơi nó được GỌI.\n\n`var` có function scope, `let/const` có block scope. Đây là lý do `var` trong loop tạo bug kinh điển.\n\n### Code\n\n```ts\n// Counter pattern — kinh điển closure\nfunction createCounter() {\n  let count = 0;\n  return {\n    inc: () => ++count,\n    get: () => count,\n  };\n}\nconst c = createCounter();\nc.inc(); c.inc();\nconsole.log(c.get()); // 2 — count \"sống\" qua closure\n\n// Playwright fixture dùng closure để hold context\nexport const test = base.extend({\n  authedPage: async ({ browser }, use) => {\n    const ctx = await browser.newContext({ storageState: '.auth/user.json' });\n    const page = await ctx.newPage();\n    await use(page);           // function callback bên ngoài \"thấy\" ctx, page nhờ closure\n    await ctx.close();         // teardown cùng scope → sạch\n  },\n});\n\n// var trong loop — classic bug\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);  // 3, 3, 3 — tất cả share cùng i\n}\n\n// let — block scope mới mỗi iteration\nfor (let i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);  // 0, 1, 2 ✓\n}\n```\n\n### Interview Q&A\n\n**Q1: Closure là gì? Cho ví dụ?**\n\nFunction \"ôm\" được biến từ scope cha kể cả khi cha đã return. Ví dụ counter pattern (xem code trên). Trong Playwright, fixture dùng closure để giữ context giữa setup và teardown.\n\n**Q2: Tại sao `var` trong loop với `setTimeout` in ra số cuối cùng?**\n\n`var` có **function scope** — chỉ 1 biến `i` duy nhất. Khi setTimeout chạy (sau loop xong), `i` đã là 3. Dùng `let` để mỗi iteration tạo binding mới.\n\n**Q3: Khác nhau giữa `let` và `var`?**\n\n| | `var` | `let`/`const` |\n|---|---|---|\n| Scope | Function | Block (`{}`) |\n| Hoisting | Có, init `undefined` | Có nhưng TDZ → ReferenceError |\n| Redeclare | Cho phép | Lỗi |\n\n**Q4: Closure có gây memory leak không?**\n\nCó thể. Closure giữ reference tới biến ngoài → biến không được GC. Ví dụ: callback đăng ký event listener \"ôm\" DOM node lớn → DOM leak. Cách tránh: cleanup listener, nullify reference khi không cần.\n\n**Q5: Tại sao closure quan trọng trong test fixture?**\n\nFixture cần share state giữa setup và teardown, hoặc giữa setup và test callback. Closure là cơ chế tự nhiên: function setup capture biến local → callback teardown access cùng biến đó.\n\n### Output-Prediction Quiz\n\n```js\nfunction outer() {\n  let x = 10;\n  return function inner() {\n    console.log(x);\n  };\n}\nconst fn = outer();\nfn();\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `10`. Inner ôm `x` qua closure, dù `outer` đã return.\n\n</details>\n\n```js\nconst fns = [];\nfor (var i = 0; i < 3; i++) {\n  fns.push(() => i);\n}\nconsole.log(fns.map(f => f()));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `[3, 3, 3]`. Mọi function share cùng `i` (function scope). Sau loop, `i = 3`.\n\n</details>\n\n```js\nfunction makeAdders() {\n  const adders = [];\n  for (let i = 1; i <= 3; i++) {\n    adders.push((x) => x + i);\n  }\n  return adders;\n}\nconst [a1, a2, a3] = makeAdders();\nconsole.log(a1(10), a2(10), a3(10));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `11 12 13`. `let` tạo binding mới mỗi vòng → mỗi adder \"ôm\" `i` riêng.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `var` + loop + async callback = bug kinh điển. Phải dùng `let` hoặc IIFE.\n\n> [!GOTCHA]\n> Closure giữ TẤT CẢ biến trong scope, không chỉ biến được dùng. Có thể gây memory leak nếu scope chứa object lớn.\n\n---\n\n## C. `this` binding\n\n### Mental model\n\n`this` được resolve **tại thời điểm GỌI function** (run-time), KHÔNG phải khi viết. Trừ **arrow function** — `this` capture từ scope cha (lexical, giống closure).\n\n5 cách bind `this`:\n\n| # | Cách gọi | `this` là gì |\n|---|---|---|\n| 1 | `fn()` (default) | `undefined` (strict) hoặc `globalThis` |\n| 2 | `obj.fn()` (method) | `obj` |\n| 3 | `fn.call(x)`, `fn.apply(x, [...])`, `fn.bind(x)()` | `x` |\n| 4 | `new Fn()` | object mới |\n| 5 | Arrow `() => this` | `this` của scope viết |\n\n### Code (Playwright Page Object)\n\n```ts\n// ✅ Standard Page Object — method là regular function\nclass HomePage {\n  constructor(private page: Page) {}\n\n  async goto() {\n    await this.page.goto('/');  // this = HomePage instance ✓\n  }\n}\nconst home = new HomePage(page);\nawait home.goto();  // OK\n\n// ❌ Tách method ra khỏi object → mất this\nconst goto = home.goto;\nawait goto();  // TypeError: Cannot read 'page' of undefined\n\n// ✅ Fix với bind\nconst goto2 = home.goto.bind(home);\nawait goto2();\n\n// ❌ Arrow trong class method — captures wrong this khi callback từ ngoài\nclass Page {\n  fields = ['a', 'b'];\n  async log() {\n    setTimeout(function () {\n      console.log(this.fields);  // undefined — this là Timeout object/global\n    }, 100);\n  }\n}\n\n// ✅ Dùng arrow để giữ this\nclass PageOK {\n  fields = ['a', 'b'];\n  async log() {\n    setTimeout(() => {\n      console.log(this.fields);  // ['a', 'b'] ✓\n    }, 100);\n  }\n}\n```\n\n### Interview Q&A\n\n**Q1: 5 cách bind `this` là gì?**\n\nDefault (undefined/global), implicit (obj.method), explicit (call/apply/bind), `new`, arrow (lexical). Xem bảng mental model.\n\n**Q2: Sự khác biệt giữa arrow function và regular function?**\n\n- Arrow: KHÔNG có own `this`, `arguments`, không dùng làm constructor (`new` lỗi), không hoist.\n- Regular: có own `this` (xác định lúc gọi), có `arguments`, dùng được làm constructor.\n\n**Q3: Khi nào KHÔNG nên dùng arrow function?**\n\n- Method của class/object cần `this` reference object (nếu dùng arrow trong field initializer thì OK, nhưng method definition thì regular).\n- Constructor.\n- Function cần `arguments`.\n- Event handler cần `this = element`.\n\n**Q4: `bind`, `call`, `apply` khác nhau?**\n\n- `call(thisArg, a, b, c)` — gọi ngay, args truyền riêng.\n- `apply(thisArg, [a, b, c])` — gọi ngay, args truyền array.\n- `bind(thisArg, a, b)` — trả về function mới đã bind, KHÔNG gọi ngay.\n\n**Q5: `new` làm gì khi gọi function?**\n\n1. Tạo object mới `{}`.\n2. Set prototype của object = `Fn.prototype`.\n3. Gọi `Fn` với `this` = object mới.\n4. Nếu `Fn` không return object → return object mới.\n\n### Output-Prediction Quiz\n\n```js\nconst obj = {\n  name: 'Hai',\n  greet() { return `Hi ${this.name}`; },\n};\nconst greet = obj.greet;\nconsole.log(greet());\nconsole.log(obj.greet());\nconsole.log(greet.call({ name: 'Anh' }));\n```\n\n<details><summary>Answer</summary>\n\n**Output:**\n- `Hi undefined` (default binding, strict mode would throw)\n- `Hi Hai` (implicit)\n- `Hi Anh` (explicit via call)\n\n</details>\n\n```js\nclass C {\n  name = 'C';\n  arrow = () => this.name;\n  regular() { return this.name; }\n}\nconst c = new C();\nconst a = c.arrow;\nconst r = c.regular;\nconsole.log(a());\nconsole.log(r());\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `'C'` và `TypeError` (this undefined).\n\nArrow trong field initializer capture `this` = instance. Regular method mất `this` khi tách.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> **Arrow trong class METHOD definition** = sai. Đúng là arrow trong field initializer. Vì arrow trong method `class C { arrow = () => {} }` là field, mỗi instance có function mới (tốn RAM). Method thường nên là regular `method() {}` (shared trên prototype).\n\n> [!GOTCHA]\n> Truyền method làm callback → mất `this`. Phải `.bind(this)` hoặc wrap arrow `() => obj.method()`.\n\n> [!TIP]\n> Trong Playwright Page Object, dùng regular method là chuẩn. Class field method chỉ dùng khi cần stable reference cho event handler.\n\n---\n\n## D. Error handling async\n\n### Mental model\n\nLỗi trong async code propagate qua **Promise rejection**, không phải throw đồng bộ. `try/catch` với `await` bắt được rejection vì `await` \"unwrap\" promise — fulfilled trả value, rejected throw.\n\n3 cách bắt lỗi:\n- `try/catch` quanh `await`\n- `.catch(handler)` ở cuối Promise chain\n- Global: `process.on('unhandledRejection')` (Node), `window.onunhandledrejection` (browser)\n\n### Code\n\n```ts\n// try/catch với await\ntest('handles API error', async () => {\n  try {\n    await api.users.create(invalidData);\n    expect.fail('Should throw');\n  } catch (err) {\n    expect((err as Error).message).toContain('validation');\n  }\n});\n\n// .catch chain\napi.users.create(data)\n  .then(handleSuccess)\n  .catch(handleError);\n\n// allSettled — không bao giờ throw\nconst results = await Promise.allSettled(promises);\nconst errors = results\n  .filter((r): r is PromiseRejectedResult => r.status === 'rejected')\n  .map((r) => r.reason);\n\n// Retry với backoff\nasync function retry<T>(fn: () => Promise<T>, max = 3): Promise<T> {\n  for (let i = 0; i < max; i++) {\n    try {\n      return await fn();\n    } catch (err) {\n      if (i === max - 1) throw err;\n      await new Promise((r) => setTimeout(r, 2 ** i * 1000));\n    }\n  }\n  throw new Error('unreachable');\n}\n```\n\n### Interview Q&A\n\n**Q1: `throw` trong `async function` ra sao?**\n\nTự động convert thành `Promise.reject(err)`. Caller phải `await` hoặc `.catch` để xử lý.\n\n**Q2: Bắt lỗi của `Promise.all` ra sao?**\n\n`Promise.all` reject ngay khi 1 promise reject. `try/catch` quanh `await Promise.all([...])` chỉ bắt được lỗi ĐẦU TIÊN. Muốn biết hết → dùng `allSettled`.\n\n**Q3: Khi nào unhandled rejection xảy ra?**\n\nPromise reject nhưng không có `.catch` hoặc `try/catch`. Node default sẽ warn (Node 15+ sẽ crash). Bug khó debug vì không có stack trace rõ.\n\n**Q4: `try/catch` có bắt được lỗi trong `setTimeout` không?**\n\nKHÔNG. `setTimeout` chạy async ngoài stack. Lỗi trong callback của setTimeout không propagate ra try/catch ngoài. Phải try/catch BÊN TRONG callback.\n\n**Q5: Strategy retry cho test flaky?**\n\nWrap async call trong retry function với:\n- Max attempts (3-5)\n- Exponential backoff (1s, 2s, 4s)\n- Chỉ retry với lỗi nhất định (network, timeout), không retry assertion fail.\n\n### Output-Prediction Quiz\n\n```js\nasync function foo() {\n  throw new Error('boom');\n}\ntry {\n  foo();  // không có await\n} catch (e) {\n  console.log('caught', e.message);\n}\nconsole.log('done');\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `done` + UnhandledPromiseRejection warning. `try/catch` KHÔNG bắt được vì không await — promise rejection escape.\n\n</details>\n\n```js\nPromise.all([\n  Promise.resolve(1),\n  Promise.reject('B'),\n  Promise.resolve(3),\n])\n.then((r) => console.log('then', r))\n.catch((e) => console.log('catch', e));\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `catch B`. Promise thứ 2 reject → toàn bộ `all` reject với reason đó.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `try/catch` không await = không bắt được. Phải `try { await foo() } catch`.\n\n> [!GOTCHA]\n> `.then(success, failure)` vs `.then(success).catch(failure)` KHÁC NHAU. Form 1: `failure` không bắt được lỗi từ `success`. Form 2: bắt được. Luôn dùng `.catch` cuối chain.\n\n> [!TIP]\n> Trong Playwright test, để fail test rõ ràng khi expect throw không xảy ra: `expect.fail('Should have thrown')` sau action.\n\n---\n\n## E. Modules — CJS vs ESM\n\n### Mental model\n\n- **CommonJS (CJS):** `require()`, `module.exports`. Dynamic, runtime resolution. Node truyền thống.\n- **ES Modules (ESM):** `import`, `export`. Static, tree-shakable. Chuẩn modern, async.\n\nTrong project automation TS:\n- Source dùng ESM syntax (`import`).\n- TS compile target tùy `tsconfig.module`: `commonjs` hoặc `esnext`/`nodenext`.\n- `package.json` `\"type\": \"module\"` → file `.js` được treat là ESM.\n\n### Code\n\n```ts\n// Named export\nexport const USERS = { ... };\nexport class ProductApi { ... }\nimport { USERS, ProductApi } from './api';\n\n// Default export (1 per file)\nexport default class HomePage { ... }\nimport HomePage from './home.page';\n\n// Re-export (barrel pattern)\n// pages/index.ts\nexport * from './home.page';\nexport * from './cart.page';\n\n// Dynamic import (async, lazy load)\nconst { ProductApi } = await import('./product.api');\n\n// CJS (legacy)\nconst fs = require('fs');\nmodule.exports = { foo, bar };\n```\n\n### Interview Q&A\n\n**Q1: ESM vs CJS khác chính chỗ nào?**\n\n- Static (ESM) vs dynamic (CJS): ESM imports phải đặt top-level, biết trước compile time → tree-shake được.\n- Async (ESM) vs sync (CJS): `import()` trả Promise; `require` đồng bộ.\n- File extension trong path: ESM yêu cầu (`./foo.js`), CJS optional.\n\n**Q2: `import * as X from '...'` vs `import X from '...'`?**\n\n- `* as X` = namespace import, gom all named exports vào X object.\n- `X` (default) = chỉ lấy default export.\n\n**Q3: Tại sao `package.json` cần `\"type\": \"module\"`?**\n\nĐể Node biết file `.js` nên parse là ESM hay CJS. Mặc định là CJS. Với TS thường set `\"type\": \"module\"` + tsconfig `\"module\": \"esnext\"` cho ESM.\n\n**Q4: Dynamic import (`await import()`) dùng khi nào?**\n\n- Lazy load module nặng.\n- Conditional load: `if (env === 'prod') await import('./heavy')`.\n- Trong CJS file muốn import ESM module.\n\n### Output-Prediction Quiz\n\n```ts\n// foo.ts\nexport const x = 10;\nexport const y = 20;\nexport default function () { return 'default'; }\n\n// bar.ts\nimport fn, { x, y } from './foo';\nconsole.log(fn(), x, y);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `default 10 20`. `fn` lấy default export, `x` `y` lấy named.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> Trộn `import` và `require` trong cùng file ESM → lỗi `Cannot use import statement outside a module`. Set `\"type\": \"module\"` trong package.json.\n\n> [!GOTCHA]\n> Circular dependency giữa 2 module có thể gây import là `undefined` lúc đầu. Tránh bằng cách refactor shared code ra file thứ 3.\n\n---\n\n## TIER 2 — Frequently asked\n\n---\n\n## F. Equality & Type Coercion\n\n### Mental model\n\n- `==` (loose equality): convert type rồi so sánh. Có nhiều quirk.\n- `===` (strict equality): so sánh CẢ type + value. **Luôn dùng `===`** (ESLint default).\n- **Falsy values** (7 cái): `false`, `0`, `-0`, `0n`, `\"\"`, `null`, `undefined`, `NaN`.\n- **Truthy:** mọi cái khác (`{}`, `[]`, `\"0\"`, `\"false\"` đều truthy!).\n\n### Code\n\n```js\n0 == false       // true\n'' == false      // true\nnull == undefined // true (chỉ cặp này, không với 0/'')\n[] == false      // true (nightmare)\nNaN === NaN      // false! Dùng Number.isNaN()\n'5' == 5         // true\n'5' === 5        // false\n```\n\n### Interview Q&A\n\n**Q1: Tại sao `NaN === NaN` là `false`?**\n\nNaN theo IEEE 754 spec: KHÔNG bằng bất cứ gì, kể cả chính nó. Dùng `Number.isNaN(x)` hoặc `Object.is(x, x)`.\n\n**Q2: `null` vs `undefined`?**\n\n- `undefined`: biến chưa gán, return không có giá trị, missing arg.\n- `null`: gán có chủ ý để biểu thị \"không có giá trị\".\n- `typeof null` là `'object'` (lịch sử để lại, không fix vì backward compat).\n\n**Q3: `[] == false`?**\n\nTrue (😱). Vì `==` coerce: `[]` → `''` → `0`, `false` → `0`. Đây là lý do tránh `==`.\n\n**Q4: Cách check 1 giá trị là \"empty\"?**\n\nKhông có 1 cách duy nhất:\n- `value == null` (bắt cả null + undefined)\n- `!value` (bắt cả falsy: 0, '', false...)\n- `Object.keys(obj).length === 0` (empty object)\n- `arr.length === 0` (empty array)\n\n### Output-Prediction Quiz\n\n```js\nconsole.log(0 == '0');\nconsole.log(0 == []);\nconsole.log('0' == []);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `true, true, false`\n\n- `0 == '0'`: '0' → 0 → equal.\n- `0 == []`: [] → '' → 0 → equal.\n- `'0' == []`: [] → ''. '0' !== ''.\n\n</details>\n\n```js\nconsole.log(null == undefined);\nconsole.log(null === undefined);\nconsole.log(null == 0);\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `true, false, false`. `null == undefined` là exception đặc biệt.\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> KHÔNG BAO GIỜ dùng `==`. ESLint `eqeqeq` rule bật mặc định.\n\n> [!GOTCHA]\n> `if (x)` với x là số 0 → false (skip block). Nếu muốn check \"x exists\" mà 0 vẫn valid → `x != null`.\n\n---\n\n## G. Hoisting & TDZ\n\n### Mental model\n\n**Hoisting** = JS engine \"đưa\" declaration lên đầu scope trước khi chạy code.\n\n| | Hoisted? | Initialized? |\n|---|---|---|\n| `var` | Yes | `undefined` |\n| `let`/`const` | Yes | **TDZ** (Temporal Dead Zone) — ReferenceError nếu access trước declare |\n| Function declaration `function foo() {}` | Yes (full) | Body luôn available |\n| Function expression `const foo = function() {}` | Hoisted như `const` | TDZ |\n| Class | Yes | TDZ |\n\n### Code\n\n```js\nconsole.log(a); // undefined (var hoisted)\nvar a = 1;\n\nconsole.log(b); // ReferenceError (TDZ)\nlet b = 2;\n\nfoo();          // OK, function decl hoisted full\nfunction foo() { console.log('hi'); }\n\nbar();          // TypeError: bar is not a function\nvar bar = function () {};\n```\n\n### Interview Q&A\n\n**Q1: TDZ là gì?**\n\nKhoảng từ đầu scope đến dòng `let`/`const` declare. Trong khoảng đó, access biến → ReferenceError. Mục đích: bắt bug \"dùng trước khi khai báo\".\n\n**Q2: Function declaration vs function expression?**\n\nDeclaration: `function foo() {}` — hoist cả body, gọi được trước dòng. Expression: `const foo = function() {}` — hoist như const, TDZ trước dòng gán.\n\n**Q3: `var` ở top-level làm gì?**\n\nTrong Node CJS: gắn vào `global` (cẩn thận!). Trong ESM module: KHÔNG gắn global, scope là module.\n\n### Output-Prediction Quiz\n\n```js\nfunction test() {\n  console.log(x);\n  var x = 10;\n  console.log(x);\n}\ntest();\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `undefined`, `10`. `var x` được hoist (init undefined), gán 10 ở dòng sau.\n\n</details>\n\n```js\nconsole.log(typeof a);\nconsole.log(typeof b);\nlet b = 1;\n```\n\n<details><summary>Answer</summary>\n\n**Output:** `undefined` rồi ReferenceError. `typeof` an toàn với biến chưa declare (như `a`), nhưng KHÔNG an toàn với TDZ (như `b`).\n\n</details>\n\n### Gotcha\n\n> [!GOTCHA]\n> `typeof` an toàn với biến chưa declare, NHƯNG ném ReferenceError với let/const trong TDZ. Đừng dùng `typeof` để check biến đã được declare.\n\n---\n\n## H. Array methods (map / filter / reduce)\n\n### Mental model\n\nHầu hết array method **không mutate** (trừ `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`). Return ARRAY MỚI.\n\n| Method | Return | Khi dùng |\n|---|---|---|\n| `map(fn)` | array same length | transform từng phần tử |\n| `filter(fn)` | array ≤ length | giữ phần tử thỏa điều kiện |\n| `reduce(fn, init)` | bất kỳ value | gom array thành 1 value |\n| `find(fn)` | first match hoặc undefined | tìm 1 phần tử |\n| `some(fn)` | boolean | có ÍT NHẤT 1 match? |\n| `every(fn)` | boolean | TẤT CẢ match? |\n| `flatMap(fn)` | flat 1 level | map rồi flat |\n| `forEach(fn)` | undefined | side effect, không return |\n\n### Code\n\n```ts\nconst users = [\n  { id: 1, name: 'A', age: 25, active: true },\n  { id: 2, name: 'B', age: 30, active: false },\n  { id: 3, name: 'C', age: 35, active: true },\n];\n\n// map: transform\nconst names = users.map((u) => u.name); // ['A', 'B', 'C']\n\n// filter: giữ phần tử\nconst active = users.filter((u) => u.active); // 2 items\n\n// reduce: gom thành value\nconst totalAge = users.reduce((sum, u) => sum + u.age, 0); // 90\nconst byId = users.reduce<Record<number, typeof users[0]>>((acc, u) => {\n  acc[u.id] = u;\n  return acc;\n}, {});\n\n// Chain\nconst activeNames = users\n  .filter((u) => u.active)\n  .map((u) => u.name);\n\n// find\nconst a = users.find((u) => u.name === 'A');\n\n// some / every\nusers.some((u) => u.age > 30);  // true\nusers.every((u) => u.active);   // false\n```\n\n### Interview Q&A\n\n**Q1: Implement `map` bằng `reduce`?**\n\n```js\nconst myMap = (arr, fn) =>\n  arr.reduce((acc, x, i) => { acc.push(fn(x, i)); return acc; }, []);\n```\n\n**Q2: `map` vs `forEach`?**\n\n`map` return array mới, dùng khi cần transform. `forEach` return undefined, dùng cho side effect.\n\n**Q3: `reduce` initial value có quan trọng không?**\n\nCó. Không cung cấp initial → reduce dùng phần tử đầu làm initial, callback bắt đầu từ phần tử thứ 2. Empty array + no initial = TypeError.\
